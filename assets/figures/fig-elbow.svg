<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img" aria-label="肘部法则：簇内平方和随 K 的变化">
  <rect x="0" y="0" width="680" height="380" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="32" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#1c2733">选 K：簇内平方和开始“缓下来”的地方</text>
  <line x1="82" y1="250" x2="640" y2="250" stroke="#9db4cc" stroke-width="2"/>
  <line x1="82" y1="66" x2="82" y2="250" stroke="#9db4cc" stroke-width="2"/>
  <text x="634" y="246" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="400" fill="#5e6b7a">簇数 K →</text>
  <text x="72" y="68" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400" fill="#5e6b7a">簇内平方和 (SSE)</text>
  <path d="M 82.0,66.0 L 161.7,134.0 L 241.4,182.0 L 321.1,208.0 L 400.9,222.0 L 480.6,230.0 L 560.3,234.0 L 640.0,238.0" fill="none" stroke="#0f4c81" stroke-width="3"/>
  <circle cx="82.0" cy="66.0" r="4.5" fill="#0f4c81"/>
  <text x="82.0" y="266" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">1</text>
  <circle cx="161.7" cy="134.0" r="4.5" fill="#0f4c81"/>
  <text x="161.71428571428572" y="266" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">2</text>
  <circle cx="241.4" cy="182.0" r="4.5" fill="#0f4c81"/>
  <text x="241.42857142857142" y="266" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">3</text>
  <circle cx="321.1" cy="208.0" r="4.5" fill="#0f4c81"/>
  <text x="321.1428571428571" y="266" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">4</text>
  <circle cx="400.9" cy="222.0" r="4.5" fill="#0f4c81"/>
  <text x="400.85714285714283" y="266" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">5</text>
  <circle cx="480.6" cy="230.0" r="4.5" fill="#0f4c81"/>
  <text x="480.57142857142856" y="266" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">6</text>
  <circle cx="560.3" cy="234.0" r="4.5" fill="#0f4c81"/>
  <text x="560.2857142857142" y="266" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">7</text>
  <circle cx="640.0" cy="238.0" r="4.5" fill="#0f4c81"/>
  <text x="640.0" y="266" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">8</text>
  <line x1="241.42857142857142" y1="66" x2="241.42857142857142" y2="250" stroke="#b26a00" stroke-width="1.8" stroke-dasharray="6 4"/>
  <circle cx="241.4" cy="182.0" r="6.5" fill="none" stroke="#b26a00" stroke-width="2.5"/>
  <text x="241.42857142857142" y="170.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">拐点 K=3</text>
  <text x="82" y="290" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400" fill="#33475b">K 从 1 增大，SSE 单调下降；下降由“陡”变“缓”的拐点常是较自然的 K</text>
  <text x="82" y="312" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400" fill="#5e6b7a">SSE 不会到 0（除非每个点一个簇），所以不能只看“越小越好”</text>
</svg>
