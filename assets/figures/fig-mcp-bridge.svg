<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="MCP 客户端连接服务器：外部能力接入缝">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">一个标准协议，替 agent 接上多样外部后端</text>
  <rect x="60" y="130" width="200" height="130" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="2"/>
  <text x="160" y="162" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#5b3aa6">Agent（客户端）</text>
  <text x="160" y="192" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">通过 MCP client 连接</text>
  <text x="160" y="216" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">看到工具 name/schema</text>
  <rect x="320" y="130" width="130" height="130" rx="8" fill="#fafbfc" stroke="#0f4c81" stroke-width="2"/>
  <text x="385" y="176" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0f4c81">MCP server</text>
  <text x="385" y="202" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f4c81">文件系统</text>
  <text x="385" y="236" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#5e6b7a">外部进程</text>
  <rect x="420" y="130" width="130" height="130" rx="8" fill="#fafbfc" stroke="#0e7c66" stroke-width="2"/>
  <text x="485" y="176" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0e7c66">MCP server</text>
  <text x="485" y="202" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">Web 搜索</text>
  <text x="485" y="236" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#5e6b7a">外部进程</text>
  <rect x="520" y="130" width="130" height="130" rx="8" fill="#fafbfc" stroke="#b26a00" stroke-width="2"/>
  <text x="585" y="176" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b26a00">MCP server</text>
  <text x="585" y="202" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b26a00">数据库</text>
  <text x="585" y="236" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#5e6b7a">外部进程</text>
  <line x1="260" y1="170" x2="316" y2="170" stroke="#b26a00" stroke-width="2.5"/>
  <text x="288" y="160" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#b26a00">stdin/stdio</text>
  <line x1="316" y1="195" x2="260" y2="195" stroke="#b26a00" stroke-width="2.5"/>
  <text x="288" y="210" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#b26a00">返回结果</text>
  <rect x="60" y="300" width="560" height="44" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.8"/>
  <text x="340" y="326" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0e7c66">标准化 · 可插拔 · 安全边界 · 生态丰富</text>
  <text x="340" y="345" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">不必为每家公司写专属适配</text>
</svg>
