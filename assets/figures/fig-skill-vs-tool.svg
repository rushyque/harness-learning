<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="工具、Skill、MCP 三者分工">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">动作、方法与外部接入，三层各司其职</text>
  <rect x="60" y="100" width="180" height="150" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="150" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">工具 tool</text>
  <text x="150" y="158" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">可执行动作</text>
  <text x="150" y="182" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">读写 / 算 / 调 API</text>
  <text x="150" y="206" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0f4c81">模型能“调用”</text>
  <rect x="250" y="100" width="180" height="150" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="340" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">Skill</text>
  <text x="340" y="158" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">可复用方法</text>
  <text x="340" y="182" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">步骤 / 规范 / 样板</text>
  <text x="340" y="206" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0e7c66">遇到时“怎么做”</text>
  <rect x="440" y="100" width="180" height="150" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="530" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">MCP</text>
  <text x="530" y="158" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">外部工具/资源</text>
  <text x="530" y="182" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">标准协议暴露</text>
  <text x="530" y="206" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b26a00">agent 之外的执行者</text>
  <text x="340" y="288" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0e7c66">Skill 告诉 agent“怎么做某类事”</text>
  <text x="340" y="310" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">其中要“做的动作”，由工具 / MCP 承接</text>
  <rect x="60" y="336" width="560" height="44" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.8"/>
  <text x="340" y="362" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#5b3aa6">三者常配合：Skill 定方法，工具/MCP 给执行力</text>
</svg>
