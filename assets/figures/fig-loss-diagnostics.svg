<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="从 loss 曲线诊断训练问题">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">Loss 曲线教会你的事</text>
  <rect x="55" y="80" width="230" height="100" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.8"/>
  <line x1="75" y1="156" x2="205" y2="156" stroke="#9db4cc" stroke-width="1.5"/>
  <line x1="75" y1="156" x2="75" y2="94" stroke="#9db4cc" stroke-width="1.5"/>
  <path d="M 75.0,195.9 L 96.7,196.3 L 118.3,195.9 L 140.0,196.7 L 161.7,196.3 L 183.3,196.7 L 205.0,196.3" fill="none" stroke="#b23a2a" stroke-width="2.5"/>
  <text x="211" y="162" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b23a2a">一直不降</text>
  <text x="211" y="180" text-anchor="start" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">LR 太小 / 梯度消失</text>
  <rect x="325" y="80" width="230" height="100" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.8"/>
  <line x1="345" y1="156" x2="475" y2="156" stroke="#9db4cc" stroke-width="1.5"/>
  <line x1="345" y1="156" x2="345" y2="94" stroke="#9db4cc" stroke-width="1.5"/>
  <path d="M 345.0,203.8 L 366.7,188.8 L 388.3,202.9 L 410.0,189.7 L 431.7,202.1 L 453.3,190.5 L 475.0,200.3" fill="none" stroke="#b26a00" stroke-width="2.5"/>
  <text x="481" y="162" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b26a00">剧烈震荡</text>
  <text x="481" y="180" text-anchor="start" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">LR 太大 / batch 小</text>
  <rect x="55" y="230" width="230" height="100" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.8"/>
  <line x1="75" y1="306" x2="205" y2="306" stroke="#9db4cc" stroke-width="1.5"/>
  <line x1="75" y1="306" x2="75" y2="244" stroke="#9db4cc" stroke-width="1.5"/>
  <path d="M 75.0,341.4 L 96.7,333.5 L 118.3,331.7 L 140.0,335.2 L 161.7,345.0 L 183.3,359.1 L 205.0,364.5" fill="none" stroke="#5b3aa6" stroke-width="2.5"/>
  <text x="211" y="312" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">val 反升</text>
  <text x="211" y="330" text-anchor="start" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">过拟合</text>
  <rect x="325" y="230" width="230" height="100" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.8"/>
  <line x1="345" y1="306" x2="475" y2="306" stroke="#9db4cc" stroke-width="1.5"/>
  <line x1="345" y1="306" x2="345" y2="244" stroke="#9db4cc" stroke-width="1.5"/>
  <path d="M 345.0,353.8 L 366.7,348.5 L 388.3,342.3 L 410.0,337.9 L 431.7,334.3 L 453.3,332.6 L 475.0,330.8" fill="none" stroke="#0e7c66" stroke-width="2.5"/>
  <text x="481" y="312" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">平滑下降</text>
  <text x="481" y="330" text-anchor="start" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">健康训练</text>
  <text x="340.0" y="356" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">train loss 降但 val loss 升 → 过拟合；loss 平滑下降 → 健康</text>
  <text x="340.0" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">训练时结合三维曲线判断，比“只看指标”更可靠</text>
</svg>
