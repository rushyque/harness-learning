<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-label="Transformer block：自注意力、残差、LayerNorm、前馈网络的组合">
  <rect x="0" y="0" width="680" height="420" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">一个 Transformer Block：自注意力 + 残差 + LayerNorm + 前馈网络</text>
  <rect x="120" y="80" width="260" height="64" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="250" y="106" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f4c81">多头自注意力</text>
  <text x="250" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#33475b">位置之间信息融合</text>
  <rect x="420" y="80" width="180" height="64" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="510" y="106" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0e7c66">Add 残差</text>
  <text x="510" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#33475b">x + Attention(x)</text>
  <line x1="380" y1="112" x2="410.0" y2="112.0" stroke="#0f4c81" stroke-width="2"/>
  <path d="M410.0 112.0 L410.0 117.0 L410.0 107.0 Z" fill="#0f4c81"/>
  <rect x="120" y="168" width="260" height="52" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="250" y="194" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#b26a00">LayerNorm</text>
  <text x="250" y="212" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#33475b">逐样本归一化</text>
  <line x1="250" y1="144" x2="250.0" y2="158.0" stroke="#0e7c66" stroke-width="2"/>
  <path d="M250.0 158.0 L245.0 158.0 L255.0 158.0 Z" fill="#0e7c66"/>
  <rect x="120" y="252" width="260" height="64" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="2"/>
  <text x="250" y="278" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#5b3aa6">前馈网络 FFN</text>
  <text x="250" y="298" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#33475b">逐位置非线性加工</text>
  <line x1="250" y1="220" x2="250.0" y2="242.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M250.0 242.0 L245.0 242.0 L255.0 242.0 Z" fill="#b26a00"/>
  <rect x="420" y="252" width="180" height="64" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="510" y="278" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0e7c66">Add 残差</text>
  <text x="510" y="298" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#33475b">x + FFN(x)</text>
  <line x1="380" y1="284" x2="410.0" y2="284.0" stroke="#5b3aa6" stroke-width="2"/>
  <path d="M410.0 284.0 L410.0 289.0 L410.0 279.0 Z" fill="#5b3aa6"/>
  <rect x="120" y="340" width="260" height="52" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="250" y="366" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#b26a00">LayerNorm</text>
  <text x="250" y="384" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#33475b">输出</text>
  <line x1="250" y1="316" x2="250.0" y2="330.0" stroke="#5b3aa6" stroke-width="2"/>
  <path d="M250.0 330.0 L245.0 330.0 L255.0 330.0 Z" fill="#5b3aa6"/>
  <text x="340.0" y="410" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">堆 N 个这样的 block，就是一个可训练的 Transformer：无循环、可并行</text>
</svg>
