<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="LLM 与 Agent 的分工">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">LLM = 大脑，Agent = 装上感官与双手的循环</text>
  <rect x="55" y="90" width="270" height="230" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="190" y="118" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f4c81">LLM（大脑）</text>
  <rect x="80" y="138" width="220" height="26" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="190" y="156" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0f4c81">思考与语言</text>
  <rect x="80" y="174" width="220" height="26" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="190" y="192" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0e7c66">给出文本 / 结构化输出</text>
  <rect x="80" y="210" width="220" height="26" rx="6" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="190" y="228" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b26a00">“调用哪个、参数“</text>
  <text x="190" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">不直接“动手”</text>
  <line x1="325" y1="190" x2="370.0" y2="190.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M370.0 190.0 L370.0 195.0 L370.0 185.0 Z" fill="#b26a00"/>
  <text x="352" y="178" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b26a00">决定</text>
  <rect x="380" y="90" width="245" height="230" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="502" y="118" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0e7c66">Agent（行动循环）</text>
  <rect x="405" y="140" width="195" height="30" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="502" y="160" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0e7c66">感知 + 决策 + 行动</text>
  <rect x="405" y="180" width="195" height="30" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="502" y="200" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0f4c81">编排循环</text>
  <rect x="405" y="220" width="195" height="30" rx="6" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="502" y="240" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b26a00">调用工具、观察结果</text>
  <text x="502" y="300" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#5e6b7a">deepseek-harness 把这条线做成产品</text>
  <text x="340.0" y="356" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">LLM 提供“思考”，Agent 提供“能感知、能决策、能行动”的闭环</text>
</svg>
