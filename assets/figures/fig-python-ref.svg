<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="Python 变量是名字而非盒子：别名指向同一对象，浅复制创建新一列">
<defs>
  <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0f4c81"/></marker>
  <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0e7c66"/></marker>
</defs>
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="35" y="36" font-family="sans-serif" font-size="19" font-weight="700" fill="#1c2733">变量是“名字”，不是“盒子”</text>

  <!-- 名字列：a / b / c = a[:] 三个框 -->
  <rect x="60" y="115" width="110" height="50" rx="6" fill="#eef4fb" stroke="#c9dcee" stroke-width="2"/>
  <rect x="60" y="180" width="110" height="50" rx="6" fill="#eef4fb" stroke="#c9dcee" stroke-width="2"/>
  <rect x="60" y="245" width="110" height="50" rx="6" fill="#eef4fb" stroke="#c9dcee" stroke-width="2"/>
  <text x="115" y="146" font-family="sans-serif" font-size="18" font-weight="700" fill="#0f4c81" text-anchor="middle">a</text>
  <text x="115" y="211" font-family="sans-serif" font-size="18" font-weight="700" fill="#0e7c66" text-anchor="middle">b</text>
  <text x="115" y="276" font-family="sans-serif" font-size="16" font-weight="700" fill="#b96b2a" text-anchor="middle">c = a[:]</text>

  <!-- 对象列：shared 与 copy 两个框 -->
  <rect x="410" y="120" width="210" height="80" rx="6" fill="#ffffff" stroke="#0f4c81" stroke-width="2"/>
  <text x="515" y="158" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733" text-anchor="middle">[1, 2, 3, 4]</text>
  <text x="515" y="188" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a" text-anchor="middle">a、b 共用这一个对象</text>
  <rect x="410" y="248" width="210" height="72" rx="6" fill="#ffffff" stroke="#b96b2a" stroke-width="2"/>
  <text x="515" y="286" font-family="sans-serif" font-size="16" font-weight="700" fill="#b96b2a" text-anchor="middle">[1, 2, 3, 4]</text>
  <text x="515" y="310" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a" text-anchor="middle">c = a[:] 浅复制的新对象</text>

  <!-- 引用箭头：每个名字精确指向它引用的对象 -->
  <line x1="170" y1="140" x2="408" y2="150" stroke="#0f4c81" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="170" y1="205" x2="408" y2="170" stroke="#0f4c81" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="170" y1="270" x2="408" y2="280" stroke="#b96b2a" stroke-width="2.2" marker-end="url(#a2)"/>

  <rect x="35" y="338" width="610" height="34" rx="6" fill="#ffffff" stroke="#e3e8ee" stroke-width="2"/>
  <text x="50" y="360" font-family="sans-serif" font-size="13" font-weight="400" fill="#5e6b7a">b = a 只加标签不复制；append 就地改对象 → a、b 一起变；c = a[:] 才真的新建副本</text>
</svg>