<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" aria-label="编码器-解码器：编码器把输入压成上下文向量 C，解码器逐词自回归生成">
  <rect x="0" y="0" width="680" height="470" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">Seq2Seq：Encoder 压出上下文向量，Decoder 自回归生成</text>
  <rect x="84" y="76" width="52" height="34" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="110" y="97" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">x₁</text>
  <rect x="204" y="76" width="52" height="34" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="230" y="97" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">x₂</text>
  <rect x="324" y="76" width="52" height="34" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="350" y="97" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">x₃</text>
  <rect x="70" y="150" width="320" height="100" rx="8" fill="#ffffff" stroke="#0f4c81" stroke-width="2"/>
  <text x="230" y="190" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#0f4c81">Encoder</text>
  <text x="230" y="214" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#33475b">读入输入 → 压缩成上下文向量</text>
  <line x1="110" y1="110" x2="110.0" y2="140.0" stroke="#0f4c81" stroke-width="2"/>
  <path d="M110.0 140.0 L105.0 140.0 L115.0 140.0 Z" fill="#0f4c81"/>
  <line x1="230" y1="110" x2="230.0" y2="140.0" stroke="#0f4c81" stroke-width="2"/>
  <path d="M230.0 140.0 L225.0 140.0 L235.0 140.0 Z" fill="#0f4c81"/>
  <line x1="350" y1="110" x2="350.0" y2="140.0" stroke="#0f4c81" stroke-width="2"/>
  <path d="M350.0 140.0 L345.0 140.0 L355.0 140.0 Z" fill="#0f4c81"/>
  <rect x="435" y="60" width="150" height="70" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2.5"/>
  <text x="510" y="90" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#b26a00">C</text>
  <text x="510" y="112" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b26a00">固定长度摘要</text>
  <line x1="390" y1="170" x2="429.1" y2="116.1" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M429.1 116.1 L433.2 119.0 L425.1 113.2 Z" fill="#b26a00"/>
  <rect x="70" y="290" width="520" height="86" rx="8" fill="#ffffff" stroke="#0e7c66" stroke-width="2"/>
  <text x="330" y="322" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#0e7c66">Decoder</text>
  <text x="330" y="346" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#33475b">基于 C 逐词生成 y₁, y₂, ..., 把上一步输出喂回自己（自回归）</text>
  <line x1="435" y1="130" x2="435.0" y2="280.0" stroke="#0e7c66" stroke-width="2.5"/>
  <path d="M435.0 280.0 L430.0 280.0 L440.0 280.0 Z" fill="#0e7c66"/>
  <rect x="84" y="396" width="52" height="34" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="110" y="417" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">y₁</text>
  <line x1="110" y1="376" x2="110.0" y2="386.0" stroke="#0e7c66" stroke-width="2"/>
  <path d="M110.0 386.0 L105.0 386.0 L115.0 386.0 Z" fill="#0e7c66"/>
  <rect x="204" y="396" width="52" height="34" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="230" y="417" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">y₂</text>
  <line x1="230" y1="376" x2="230.0" y2="386.0" stroke="#0e7c66" stroke-width="2"/>
  <path d="M230.0 386.0 L225.0 386.0 L235.0 386.0 Z" fill="#0e7c66"/>
  <rect x="324" y="396" width="52" height="34" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="350" y="417" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">y₃</text>
  <line x1="350" y1="376" x2="350.0" y2="386.0" stroke="#0e7c66" stroke-width="2"/>
  <path d="M350.0 386.0 L345.0 386.0 L355.0 386.0 Z" fill="#0e7c66"/>
  <line x1="150" y1="290" x2="150.0" y2="382.0" stroke="#0e7c66" stroke-width="1.8" stroke-dasharray="4,3"/>
  <path d="M150.0 382.0 L145.0 382.0 L155.0 382.0 Z" fill="#0e7c66"/>
  <text x="340.0" y="445" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b23a2a">关键短板：不管输入多长都被压进固定长度的 C，长输入会丢失信息</text>
</svg>
