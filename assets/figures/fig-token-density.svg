<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="中英文 token 密度：同一意思中文常需要更多 token">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">为什么中文“token 密度”更高：同一意思 token 数更多</text>
  <rect x="40" y="72" width="290" height="300" rx="8" fill="#ffffff" stroke="#9db4cc" stroke-width="1.5"/>
  <text x="185" y="98" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#33475b">英文：常见词整词入库</text>
  <rect x="120" y="116" width="130" height="26" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="185" y="134" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">hello</text>
  <rect x="120" y="150" width="130" height="26" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="185" y="168" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">world</text>
  <rect x="120" y="184" width="130" height="26" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="185" y="202" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">this</text>
  <rect x="120" y="218" width="130" height="26" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="185" y="236" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">is</text>
  <rect x="120" y="252" width="130" height="26" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="185" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">a</text>
  <text x="185" y="306" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">5 个词 ≈ 5 个 token</text>
  <text x="185" y="344" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">≈ 4 字符 / token</text>
  <rect x="350" y="72" width="290" height="300" rx="8" fill="#ffffff" stroke="#9db4cc" stroke-width="1.5"/>
  <text x="495" y="98" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#33475b">中文：1 字常 1~2 token</text>
  <rect x="470" y="116" width="90" height="26" rx="6" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="515" y="134" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">你</text>
  <rect x="470" y="150" width="90" height="26" rx="6" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="515" y="168" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">好</text>
  <rect x="470" y="184" width="90" height="26" rx="6" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="515" y="202" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">，</text>
  <rect x="470" y="218" width="90" height="26" rx="6" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="515" y="236" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">世</text>
  <rect x="470" y="252" width="90" height="26" rx="6" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="515" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">界</text>
  <text x="495" y="306" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b23a2a">5 个字 ≈ 5~10 token</text>
  <text x="495" y="344" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">≈ 1~2 token / 字</text>
  <text x="340.0" y="376" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">成本跟着 token 走：中文产品要注意 token 用量（07 章）</text>
</svg>
