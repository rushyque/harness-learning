<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="非线性激活：没有它多层层会坍缩成一条直线，有了它才能折出复杂曲线">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">为什么必须有非线性：左侧坍缩成直线，右侧能折出复杂形状</text>
  <text x="170" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#33475b">A  只有线性层</text>
  <rect x="40" y="78" width="260" height="300" rx="8" fill="#ffffff" stroke="#9db4cc" stroke-width="1.5"/>
  <line x1="70" y1="330" x2="262" y2="330" stroke="#9db4cc" stroke-width="2"/>
  <line x1="70" y1="150" x2="70" y2="330" stroke="#9db4cc" stroke-width="2"/>
  <text x="296" y="326" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">x →</text>
  <text x="60" y="152" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">y</text>
  <path d="M 90.0,300.0 L 250.0,178.0" fill="none" stroke="#0f4c81" stroke-width="3"/>
  <text x="170" y="118" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b26a00">多层线性</text>
  <text x="170" y="140" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b26a00">折叠成一条直线</text>
  <text x="170" y="368" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">等价于一层，表达力不增</text>
  <text x="510" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#33475b">B  夹进非线性</text>
  <rect x="380" y="78" width="260" height="300" rx="8" fill="#ffffff" stroke="#9db4cc" stroke-width="1.5"/>
  <line x1="410" y1="330" x2="600" y2="330" stroke="#9db4cc" stroke-width="2"/>
  <line x1="410" y1="150" x2="410" y2="330" stroke="#9db4cc" stroke-width="2"/>
  <text x="636" y="326" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">x →</text>
  <text x="400" y="152" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">y</text>
  <path d="M 430.0,318.0 L 478.0,318.0 L 494.0,250.0 L 524.0,250.0 L 538.0,160.0 L 568.0,160.0 L 580.0,96.0 L 610.0,96.0" fill="none" stroke="#0e7c66" stroke-width="3"/>
  <text x="510" y="118" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">每一层折一下</text>
  <text x="510" y="140" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">越叠越复杂</text>
  <text x="510" y="368" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">能表达绕过直线走的各种曲线</text></svg>
