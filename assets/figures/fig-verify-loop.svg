<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="验证与回退闭环">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">每步设关卡：检查、回退、重试</text>
  <rect x="70" y="95" width="170" height="100" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="155" y="125" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">执行动作</text>
  <text x="155" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">调工具/跑命令</text>
  <line x1="244" y1="145" x2="276.0" y2="145.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M276.0 145.0 L276.0 150.0 L276.0 140.0 Z" fill="#b26a00"/>
  <rect x="290" y="95" width="180" height="100" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="380" y="125" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">验证</text>
  <text x="380" y="155" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">返回码/测试/规则</text>
  <text x="380" y="178" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0e7c66">对上预期了吗？</text>
  <line x1="470" y1="120" x2="510.0" y2="120.0" stroke="#0e7c66" stroke-width="2.5"/>
  <path d="M510.0 120.0 L510.0 125.0 L510.0 115.0 Z" fill="#0e7c66"/>
  <text x="495" y="108" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">通过</text>
  <rect x="525" y="95" width="100" height="50" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="575" y="123" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">继续/完成</text>
  <line x1="470" y1="175" x2="510.0" y2="175.0" stroke="#b23a2a" stroke-width="2.5"/>
  <path d="M510.0 175.0 L510.0 180.0 L510.0 170.0 Z" fill="#b23a2a"/>
  <text x="495" y="165" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b23a2a">失败</text>
  <rect x="525" y="160" width="100" height="60" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="2"/>
  <text x="575" y="186" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b23a2a">回退/重试</text>
  <line x1="380" y1="195" x2="164.9" y2="220.8" stroke="#b23a2a" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M164.9 220.8 L164.3 215.8 L165.5 225.8 Z" fill="#b23a2a"/>
  <text x="266" y="218" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b23a2a">回到正确状态</text>
  <rect x="90" y="245" width="500" height="58" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="340" y="271" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">回退依赖“每步可逆 + 快照/状态”</text>
  <text x="340" y="293" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">没有快照，“发现错了”也无从回滚</text>
  <text x="340.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">真实错误回传让模型读到并调整，闭环</text>
</svg>
