<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="model-visible 与 logged 硬规则">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">凡是模型看到的，都必须能从日志重建</text>
  <rect x="70" y="90" width="260" height="150" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="200" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">模型看到的 model-visible</text>
  <text x="200" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">-- 用户消息</text>
  <text x="200" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">-- 工具结果</text>
  <text x="200" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">-- 请求参数</text>
  <text x="200" y="214" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">-- 中间状态</text>
  <text x="200" y="232" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">不存在看到却没记录</text>
  <line x1="334" y1="165" x2="382.0" y2="165.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M382.0 165.0 L382.0 170.0 L382.0 160.0 Z" fill="#b26a00"/>
  <text x="363" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b26a00">必须</text>
  <rect x="400" y="90" width="220" height="150" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="510" y="120" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">会话日志 logged</text>
  <text x="510" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">-- 每条消息含 role</text>
  <text x="510" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">-- 工具参数与返回</text>
  <text x="510" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">-- system prompt</text>
  <text x="510" y="214" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">-- 顺序与事件类型</text>
  <text x="510" y="232" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">只看日志即可完整复现</text>
  <rect x="70" y="268" width="550" height="60" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.8"/>
  <text x="345" y="294" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">调试 / 审计 / 安全 / 回归 / 可复现</text>
  <text x="345" y="318" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">日志能回答模型当时为什么这么做</text>
  <text x="340.0" y="360" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b23a2a">反例：只有模型说成功而无工具输出，就无法证实</text>
</svg>
