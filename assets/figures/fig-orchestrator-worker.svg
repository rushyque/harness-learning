<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="编排式多智能体">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">一个编排者统筹，多个 worker 分工</text>
  <rect x="90" y="100" width="180" height="150" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="2"/>
  <text x="180" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#5b3aa6">编排者</text>
  <text x="180" y="154" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">拆任务</text>
  <text x="180" y="176" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">派发给 worker</text>
  <text x="180" y="198" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">收集结果、决定</text>
  <text x="180" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">下一步</text>
  <rect x="340" y="130" width="120" height="90" rx="8" fill="#fafbfc" stroke="#0f4c81" stroke-width="2"/>
  <text x="400" y="166" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0f4c81">worker 查资料</text>
  <text x="400" y="194" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#5e6b7a">独立上下文</text>
  <line x1="270" y1="150" x2="326.2" y2="162.8" stroke="#b26a00" stroke-width="2"/>
  <path d="M326.2 162.8 L325.1 167.7 L327.4 157.9 Z" fill="#b26a00"/>
  <rect x="420" y="130" width="120" height="90" rx="8" fill="#fafbfc" stroke="#0e7c66" stroke-width="2"/>
  <text x="480" y="166" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0e7c66">worker 跑代码</text>
  <text x="480" y="194" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#5e6b7a">独立上下文</text>
  <line x1="270" y1="150" x2="326.2" y2="162.8" stroke="#b26a00" stroke-width="2"/>
  <path d="M326.2 162.8 L325.1 167.7 L327.4 157.9 Z" fill="#b26a00"/>
  <rect x="510" y="130" width="120" height="90" rx="8" fill="#fafbfc" stroke="#b26a00" stroke-width="2"/>
  <text x="570" y="166" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b26a00">worker 写报告</text>
  <text x="570" y="194" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#5e6b7a">独立上下文</text>
  <line x1="270" y1="150" x2="326.2" y2="162.8" stroke="#b26a00" stroke-width="2"/>
  <path d="M326.2 162.8 L325.1 167.7 L327.4 157.9 Z" fill="#b26a00"/>
  <line x1="550" y1="220" x2="280.0" y2="210.4" stroke="#b26a00" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M280.0 210.4 L280.2 205.4 L279.8 215.4 Z" fill="#b26a00"/>
  <text x="410" y="240" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b26a00">结果汇总回编排者</text>
  <rect x="90" y="280" width="500" height="44" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.8"/>
  <text x="340" y="306" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">子代理（subagent）隔离上下文，独立执行后交回</text>
  <text x="340" y="326" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0e7c66">别把主 agent 的窗口塞爆</text>
  <text x="340.0" y="362" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b23a2a">代价：协调成本、错误传播、死循环、评测更复杂</text>
</svg>
