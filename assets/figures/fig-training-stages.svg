<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="训练三阶段：预训练给知识、指令微调给听话、对齐给安全">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">训练三阶段：预训练 → 指令微调 → 对齐</text>
  <rect x="60" y="70" width="460" height="72" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="85" y="94" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f4c81">1 预训练</text>
  <text x="85" y="116" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">海量文本 → next-token</text>
  <text x="85" y="134" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">底座：会续写、有知识</text>
  <circle cx="575" cy="106" r="24" fill="#ffffff" stroke="#0f4c81" stroke-width="2"/>
  <text x="575" y="111" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">知识</text>
  <rect x="60" y="170" width="460" height="72" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="85" y="194" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="700" fill="#0e7c66">2 指令微调 SFT</text>
  <text x="85" y="216" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">指令-回答 → 按指令续写</text>
  <text x="85" y="234" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">助手：会听话</text>
  <circle cx="575" cy="206" r="24" fill="#ffffff" stroke="#0e7c66" stroke-width="2"/>
  <text x="575" y="211" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">听话</text>
  <rect x="60" y="270" width="460" height="72" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="85" y="294" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="700" fill="#b26a00">3 对齐 RLHF</text>
  <text x="85" y="316" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">人类偏好 → 奖励模型 → PPO</text>
  <text x="85" y="334" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">合格助手：安全</text>
  <circle cx="575" cy="306" r="24" fill="#ffffff" stroke="#b26a00" stroke-width="2"/>
  <text x="575" y="311" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">安全</text>
  <line x1="520" y1="106" x2="520.0" y2="160.0" stroke="#0e7c66" stroke-width="2"/>
  <path d="M520.0 160.0 L515.0 160.0 L525.0 160.0 Z" fill="#0e7c66"/>
  <line x1="520" y1="206" x2="520.0" y2="260.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M520.0 260.0 L515.0 260.0 L525.0 260.0 Z" fill="#b26a00"/>
  <text x="340.0" y="378" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">每一步都在改进“行为方式”：底座 → 听话 → 安全</text>
</svg>
