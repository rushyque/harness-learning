<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="语言建模损失：-log P(真实下一个 token)，指数即困惑度">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">损失曲线：-log P 指数即困惑度 PPL</text>
  <line x1="90" y1="330" x2="640" y2="330" stroke="#9db4cc" stroke-width="2"/>
  <line x1="90" y1="70" x2="90" y2="330" stroke="#9db4cc" stroke-width="2"/>
  <text x="634" y="326" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="400" fill="#5e6b7a">训练轮数 →</text>
  <text x="80" y="72" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400" fill="#5e6b7a">loss</text>
  <path d="M 90.0,93.4 L 98.2,104.2 L 106.5,114.4 L 114.8,124.2 L 123.0,133.5 L 131.2,142.3 L 139.5,150.7 L 147.8,158.7 L 156.0,166.3 L 164.2,173.5 L 172.5,180.4 L 180.8,186.9 L 189.0,193.1 L 197.2,199.0 L 205.5,204.7 L 213.8,210.0 L 222.0,215.1 L 230.2,219.9 L 238.5,224.5 L 246.8,228.9 L 255.0,233.1 L 263.2,237.1 L 271.5,240.8 L 279.8,244.4 L 288.0,247.8 L 296.2,251.1 L 304.5,254.2 L 312.8,257.1 L 321.0,259.9 L 329.2,262.6 L 337.5,265.1 L 345.8,267.5 L 354.0,269.8 L 362.2,272.0 L 370.5,274.0 L 378.8,276.0 L 387.0,277.9 L 395.2,279.7 L 403.5,281.3 L 411.8,283.0 L 420.0,284.5 L 428.2,285.9 L 436.5,287.3 L 444.8,288.7 L 453.0,289.9 L 461.2,291.1 L 469.5,292.2 L 477.8,293.3 L 486.0,294.4 L 494.2,295.3 L 502.5,296.3 L 510.8,297.1 L 519.0,298.0 L 527.2,298.8 L 535.5,299.5 L 543.8,300.3 L 552.0,301.0 L 560.2,301.6 L 568.5,302.2 L 576.8,302.8 L 585.0,303.4 L 593.2,303.9 L 601.5,304.4 L 609.8,304.9 L 618.0,305.4 L 626.2,305.8 L 634.5,306.2" fill="none" stroke="#0e7c66" stroke-width="2.8"/>
  <text x="282.5" y="233.57988751487392" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">loss（交叉熵）健康下降</text>
  <rect x="430" y="86" width="200" height="56" rx="6" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="530" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#b26a00">PPL = exp(loss)</text>
  <text x="530" y="130" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">loss 是负对数概率，PPL 是候选数</text>
  <text x="340.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">看 loss 或 PPL 都是一回事：越低说明预测下一个词越准</text>
  <text x="340.0" y="392" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#b26a00">但训练 loss 低 ≠ 能力好，它只反映“预测下一个词”的拟合度</text>
</svg>
