<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="位置编码外推能力对比">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">长度外推：能否处理“训练时没见过的更长序列”</text>
  <rect x="80" y="100" width="500" height="78" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <rect x="80" y="190" width="500" height="78" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="2"/>
  <rect x="80" y="280" width="500" height="78" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="105" y="132" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="700" fill="#0e7c66">正弦</text>
  <text x="105" y="158" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">固定波形，可外推</text>
  <text x="540" y="132" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">较好</text>
  <text x="540" y="158" text-anchor="end" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">外推能力</text>
  <text x="105" y="222" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="700" fill="#b23a2a">可学习</text>
  <text x="105" y="248" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">位置索引越界即失效</text>
  <text x="540" y="222" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="700" fill="#b23a2a">差</text>
  <text x="540" y="248" text-anchor="end" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">外推能力</text>
  <text x="105" y="312" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f4c81">RoPE</text>
  <text x="105" y="338" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">相对位置，泛化友好</text>
  <text x="540" y="312" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">好</text>
  <text x="540" y="338" text-anchor="end" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">外推能力</text>
  <text x="340.0" y="380" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">想拉长上下文窗口，就指望“能外推”的方案（07 章细讲）</text>
</svg>
