<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="NER 用 BIO 标注每个 token">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">命名实体识别（NER）：给每个 token 打标签</text>
  <rect x="48" y="110" width="84" height="46" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="90" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">张三</text>
  <line x1="90" y1="156" x2="90.0" y2="186.0" stroke="#9db4cc" stroke-width="2"/>
  <path d="M90.0 186.0 L85.0 186.0 L95.0 186.0 Z" fill="#9db4cc"/>
  <rect x="48" y="196" width="84" height="40" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="90" y="221" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0f4c81">B-PER</text>
  <rect x="148" y="110" width="84" height="46" rx="8" fill="#eef1f5" stroke="#9db4cc" stroke-width="2"/>
  <text x="190" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#9db4cc">在</text>
  <line x1="190" y1="156" x2="190.0" y2="186.0" stroke="#9db4cc" stroke-width="2"/>
  <path d="M190.0 186.0 L185.0 186.0 L195.0 186.0 Z" fill="#9db4cc"/>
  <rect x="148" y="196" width="84" height="40" rx="8" fill="#eef1f5" stroke="#9db4cc" stroke-width="1.5"/>
  <text x="190" y="221" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#9db4cc">O</text>
  <rect x="248" y="110" width="84" height="46" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="290" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">北京</text>
  <line x1="290" y1="156" x2="290.0" y2="186.0" stroke="#9db4cc" stroke-width="2"/>
  <path d="M290.0 186.0 L285.0 186.0 L295.0 186.0 Z" fill="#9db4cc"/>
  <rect x="248" y="196" width="84" height="40" rx="8" fill="#dce8f5" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="290" y="221" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0e7c66">B-LOC</text>
  <rect x="358" y="110" width="84" height="46" rx="8" fill="#eef1f5" stroke="#9db4cc" stroke-width="2"/>
  <text x="400" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#9db4cc">的</text>
  <line x1="400" y1="156" x2="400.0" y2="186.0" stroke="#9db4cc" stroke-width="2"/>
  <path d="M400.0 186.0 L395.0 186.0 L405.0 186.0 Z" fill="#9db4cc"/>
  <rect x="358" y="196" width="84" height="40" rx="8" fill="#eef1f5" stroke="#9db4cc" stroke-width="1.5"/>
  <text x="400" y="221" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#9db4cc">O</text>
  <rect x="458" y="110" width="84" height="46" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="2"/>
  <text x="500" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#5b3aa6">腾讯</text>
  <line x1="500" y1="156" x2="500.0" y2="186.0" stroke="#9db4cc" stroke-width="2"/>
  <path d="M500.0 186.0 L495.0 186.0 L505.0 186.0 Z" fill="#9db4cc"/>
  <rect x="458" y="196" width="84" height="40" rx="8" fill="#dce8f5" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="500" y="221" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#5b3aa6">B-ORG</text>
  <rect x="543" y="110" width="84" height="46" rx="8" fill="#eef1f5" stroke="#9db4cc" stroke-width="2"/>
  <text x="585" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#9db4cc">上班</text>
  <line x1="585" y1="156" x2="585.0" y2="186.0" stroke="#9db4cc" stroke-width="2"/>
  <path d="M585.0 186.0 L580.0 186.0 L590.0 186.0 Z" fill="#9db4cc"/>
  <rect x="543" y="196" width="84" height="40" rx="8" fill="#eef1f5" stroke="#9db4cc" stroke-width="1.5"/>
  <text x="585" y="221" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#9db4cc">O</text>
  <circle cx="98" cy="300" r="7" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="112" y="304" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">B = Begin 开头</text>
  <circle cx="298" cy="300" r="7" fill="#dce8f5" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="312" y="304" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">I = Inside 内部</text>
  <circle cx="498" cy="300" r="7" fill="#dce8f5" stroke="#9db4cc" stroke-width="1.5"/>
  <text x="512" y="304" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">O = Outside 无关</text>
  <text x="340.0" y="352" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">跨 token 的实体（如“张 三”）用 B 开头、I 续内部、O 无关</text>
  <text x="340.0" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">深层模型学会“相邻 token 标签的依赖”</text>
</svg>
