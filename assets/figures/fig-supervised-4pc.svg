<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-label="监督学习四件套：模型、损失、优化、评估">
  <rect x="0" y="0" width="680" height="300" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1c2733">几乎所有学习系统都逃不出这套闭环</text>
  <rect x="24.0" y="80" width="144.5" height="96" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="96.25" y="122" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#0f4c81">模型</text>
  <text x="96.25" y="148" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#33475b">怎么预测</text>
  <line x1="168.5" y1="128.0" x2="176.5" y2="128.0" stroke="#0f4c81" stroke-width="2.5"/>
  <path d="M176.5 128.0 L176.5 133.0 L176.5 123.0 Z" fill="#0f4c81"/>
  <rect x="186.5" y="80" width="144.5" height="96" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="258.75" y="122" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#0f4c81">损失</text>
  <text x="258.75" y="148" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#33475b">预测有多错</text>
  <line x1="331.0" y1="128.0" x2="339.0" y2="128.0" stroke="#0f4c81" stroke-width="2.5"/>
  <path d="M339.0 128.0 L339.0 133.0 L339.0 123.0 Z" fill="#0f4c81"/>
  <rect x="349.0" y="80" width="144.5" height="96" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="421.25" y="122" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#0f4c81">优化</text>
  <text x="421.25" y="148" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#33475b">怎么改进</text>
  <line x1="493.5" y1="128.0" x2="501.5" y2="128.0" stroke="#0f4c81" stroke-width="2.5"/>
  <path d="M501.5 128.0 L501.5 133.0 L501.5 123.0 Z" fill="#0f4c81"/>
  <rect x="511.5" y="80" width="144.5" height="96" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="583.75" y="122" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#0f4c81">评估</text>
  <text x="583.75" y="148" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#33475b">是否真更好</text>
  <line x1="24" y1="206" x2="656" y2="206" stroke="#9db4cc" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="340.0" y="236" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#5e6b7a">评估结果反过来指导“优化”，这是训练中不断发生的闭环</text>
  <text x="340.0" y="274" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#33475b">评判一个模型，就是问这四个答案</text>
</svg>
