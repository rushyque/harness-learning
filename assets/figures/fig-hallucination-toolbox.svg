<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="防幻觉四层工具箱">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">幻觉缓解：从源头到执行的安全网</text>
  <rect x="70" y="80" width="540" height="52" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.8"/>
  <text x="105" y="112" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0f4c81">训练/微调层</text>
  <text x="330" y="112" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">高质量数据、对齐偏好、“不知道”样本</text>
  <rect x="70" y="142" width="540" height="52" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.8"/>
  <text x="105" y="174" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">提示层</text>
  <text x="330" y="174" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">RAG、引用、低温度、few-shot 教“不知道”</text>
  <rect x="70" y="204" width="540" height="52" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.8"/>
  <text x="105" y="236" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b26a00">推理层</text>
  <text x="330" y="236" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">多答一致性、自评、二次检索、schema 校验</text>
  <rect x="70" y="266" width="540" height="52" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.8"/>
  <text x="105" y="298" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">Agent 层</text>
  <text x="330" y="298" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">真实工具回传、白名单、审批、证据链</text>
  <rect x="70" y="328" width="540" height="52" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.8"/>
  <text x="105" y="360" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b23a2a">评估层</text>
  <text x="330" y="360" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">自动/人工抽查、幻觉区间识别</text>
</svg>
