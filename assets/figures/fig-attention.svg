<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="注意力 QKV：Query 与各 Key 打分 → softmax 成权重 → 加权求和 Value">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">注意力三步：Q·K 打分 → softmax 归一化 → 加权求和 V</text>
  <rect x="120" y="90" width="120" height="52" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="180" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f4c81">Query</text>
  <text x="180" y="138" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#33475b">我在找什么</text>
  <rect x="320" y="90" width="120" height="52" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="380" y="112" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">Key 1</text>
  <text x="380" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">score 0.72</text>
  <rect x="470" y="90" width="130" height="52" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="535" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">Value 1</text>
  <line x1="240" y1="100" x2="310.0" y2="107.0" stroke="#0f4c81" stroke-width="2"/>
  <path d="M310.0 107.0 L309.6 112.0 L310.5 102.0 Z" fill="#0f4c81"/>
  <line x1="440" y1="116" x2="460.0" y2="116.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M460.0 116.0 L460.0 121.0 L460.0 111.0 Z" fill="#b26a00"/>
  <rect x="320" y="180" width="120" height="52" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="380" y="202" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">Key 2</text>
  <text x="380" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">score 0.25</text>
  <rect x="470" y="180" width="130" height="52" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="535" y="210" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">Value 2</text>
  <line x1="240" y1="100" x2="313.7" y2="190.3" stroke="#0f4c81" stroke-width="2"/>
  <path d="M313.7 190.3 L309.8 193.4 L317.5 187.1 Z" fill="#0f4c81"/>
  <line x1="440" y1="206" x2="460.0" y2="206.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M460.0 206.0 L460.0 211.0 L460.0 201.0 Z" fill="#b26a00"/>
  <rect x="120" y="300" width="480" height="60" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="2"/>
  <text x="360" y="328" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#5b3aa6">输出 = Σ 权重 · Value</text>
  <text x="360" y="348" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#33475b">权重 0.615 / 0.385 由 softmax 决定，越相关的 key 权重越大</text>
  <line x1="535" y1="186" x2="535.0" y2="290.0" stroke="#5b3aa6" stroke-width="2"/>
  <path d="M535.0 290.0 L530.0 290.0 L540.0 290.0 Z" fill="#5b3aa6"/>
  <line x1="535" y1="96" x2="535.0" y2="290.0" stroke="#5b3aa6" stroke-width="2"/>
  <path d="M535.0 290.0 L530.0 290.0 L540.0 290.0 Z" fill="#5b3aa6"/>
  <text x="340.0" y="388" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">模型“看”哪里由算出的权重动态决定，而非固定结构</text>
