<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="显式计划的数据结构">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">一份好计划的骨架</text>
  <rect x="80" y="80" width="520" height="52" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="2"/>
  <text x="340" y="106" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#5b3aa6">goal</text>
  <text x="340" y="124" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">目标：部署项目并写文档</text>
  <rect x="120" y="155" width="200" height="36" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="220" y="178" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f4c81">step 1</text>
  <rect x="340" y="155" width="220" height="36" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="450" y="178" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">检查 git 状态 [git_status]</text>
  <rect x="120" y="203" width="200" height="36" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="220" y="226" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f4c81">step 2</text>
  <rect x="340" y="203" width="220" height="36" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="450" y="226" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">运行构建 [run_command]</text>
  <rect x="120" y="251" width="200" height="36" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="220" y="274" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f4c81">step 3</text>
  <rect x="340" y="251" width="220" height="36" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="450" y="274" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">部署到测试环境 [deploy]</text>
  <rect x="120" y="299" width="200" height="36" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="220" y="322" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f4c81">step 4</text>
  <rect x="340" y="299" width="220" height="36" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="450" y="322" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">写部署文档 [write_file]</text>
  <rect x="80" y="335" width="520" height="42" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="340" y="359" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b26a00">每步：动作+工具+预期结果；可标记完成/失败/待做</text>
</svg>
