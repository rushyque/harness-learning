<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="可复现研究项目的目录组织：configs、src、tests、results 四层职责">
<defs>
  <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0f4c81"/></marker>
  <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0e7c66"/></marker>
</defs>
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="35" y="42" font-family="sans-serif" font-size="19" font-weight="700" fill="#1c2733">研究项目骨架：分层职责，各司其职</text>
  <rect x="120" y="100" width="190" height="46" rx="6" fill="#eef4fb" stroke="#c9dcee" stroke-width="2"/>
  <text x="134" y="120" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">configs/</text>
  <text x="134" y="137" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">种子、超参数</text><rect x="120" y="164" width="190" height="46" rx="6" fill="#eef4fb" stroke="#c9dcee" stroke-width="2"/>
  <text x="134" y="184" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">src/</text>
  <text x="134" y="201" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">可导入的核心逻辑</text>
  <line x1="215" y1="146" x2="215" y2="164" stroke="#0f4c81" stroke-width="2.2" marker-end="url(#a)"/><rect x="120" y="228" width="190" height="46" rx="6" fill="#eef4fb" stroke="#c9dcee" stroke-width="2"/>
  <text x="134" y="248" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">tests/</text>
  <text x="134" y="265" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">行为兜底</text>
  <line x1="215" y1="210" x2="215" y2="228" stroke="#0f4c81" stroke-width="2.2" marker-end="url(#a)"/><rect x="120" y="292" width="190" height="46" rx="6" fill="#eef4fb" stroke="#c9dcee" stroke-width="2"/>
  <text x="134" y="312" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">results/</text>
  <text x="134" y="329" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">输出成果</text>
  <line x1="215" y1="274" x2="215" y2="292" stroke="#0f4c81" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="400" y="112" font-family="sans-serif" font-size="14" font-weight="400" fill="#33475b">•</text>
  <text x="414" y="112" font-family="sans-serif" font-size="14" font-weight="700" fill="#1c2733">配置与代码分离</text>
  <text x="414" y="130" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">参数不埋在代码深处，可改种子跑多次</text>
  <text x="400" y="176" font-family="sans-serif" font-size="14" font-weight="400" fill="#33475b">•</text>
  <text x="414" y="176" font-family="sans-serif" font-size="14" font-weight="700" fill="#1c2733">逻辑可被测试</text>
  <text x="414" y="194" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">src 是唯一被 tests 覆盖的</text>
  <text x="400" y="240" font-family="sans-serif" font-size="14" font-weight="400" fill="#33475b">•</text>
  <text x="414" y="240" font-family="sans-serif" font-size="14" font-weight="700" fill="#1c2733">测试给行为兜底</text>
  <text x="414" y="258" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">改代码后跑一遍测试就有安全感</text>
  <text x="400" y="304" font-family="sans-serif" font-size="14" font-weight="400" fill="#33475b">•</text>
  <text x="414" y="304" font-family="sans-serif" font-size="14" font-weight="700" fill="#1c2733">结果与代码分离</text>
  <text x="414" y="322" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">输出不入 git，只留可复现入口</text>
  <rect x="35" y="356" width="610" height="32" rx="6" fill="#ffffff" stroke="#e3e8ee" stroke-width="2"/>
  <text x="52" y="378" font-family="sans-serif" font-size="13" font-weight="400" fill="#5e6b7a">数据流向下：configs 定参数 → src 计算 → tests 校验 → results 沉淀</text>
</svg>