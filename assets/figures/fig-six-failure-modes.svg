<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="六类高频失败模式">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">先把常见“死法”列出来，才能快速诊断</text>
  <rect x="70" y="88" width="250" height="58" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.8"/>
  <text x="195" y="110" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b23a2a">死循环</text>
  <text x="195" y="132" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">不收敛反复转圈</text>
  <text x="195" y="146" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#b23a2a">→ 最大步数/重复检测</text>
  <rect x="360" y="88" width="250" height="58" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.8"/>
  <text x="485" y="110" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b26a00">假装成功</text>
  <text x="485" y="132" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">编造工具结果</text>
  <text x="485" y="146" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#b26a00">→ 真实回传/审批</text>
  <rect x="70" y="162" width="250" height="58" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.8"/>
  <text x="195" y="184" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0f4c81">工具误用</text>
  <text x="195" y="206" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">参数错/用错工具</text>
  <text x="195" y="220" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0f4c81">→ 写清描述/schema</text>
  <rect x="360" y="162" width="250" height="58" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.8"/>
  <text x="485" y="184" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">上下文爆炸</text>
  <text x="485" y="206" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">塞爆窗口/漏读</text>
  <text x="485" y="220" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0e7c66">→ 截断/摘要/检索</text>
  <rect x="70" y="236" width="250" height="58" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.8"/>
  <text x="195" y="258" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">计划僵化</text>
  <text x="195" y="280" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">遇偏差不调整</text>
  <text x="195" y="294" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#5b3aa6">→ 计划可改/可回退</text>
  <rect x="360" y="236" width="250" height="58" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.8"/>
  <text x="485" y="258" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b23a2a">越权越界</text>
  <text x="485" y="280" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">不该执行的执行</text>
  <text x="485" y="294" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#b23a2a">→ 最小权限/沙箱</text>
  <rect x="90" y="322" width="500" height="46" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="340" y="348" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">诊断：复现→轨迹定位→归类→修最小→验证</text>
</svg>
