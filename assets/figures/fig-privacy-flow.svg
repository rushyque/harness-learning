<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="数据流向与凭据引用：谁能看到什么数据">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">默认最小暴露：能关则关，能引用则不暴露原文</text>
  <rect x="60" y="96" width="250" height="110" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="185" y="124" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0f4c81">Agent 接触的数据</text>
  <text x="185" y="152" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#33475b">用户文本 · 文件 · 工具结果</text>
  <text x="185" y="174" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#33475b">网络内容 · 凭据</text>
  <path d="M 310.0,150.0 L 366.0,150.0" fill="none" stroke="#b26a00" stroke-width="2"/>
  <text x="338" y="140" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#5e6b7a">谁看</text>
  <rect x="370" y="90" width="250" height="120" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="495" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">三问</text>
  <text x="495" y="146" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">谁能看到？</text>
  <text x="495" y="168" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">数据去哪（本地/云端/第三方）？</text>
  <text x="495" y="190" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">谁不能进模型/要脱敏/要同意？</text>
  <rect x="60" y="224" width="250" height="74" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.8"/>
  <text x="185" y="250" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">凭据引用</text>
  <text x="185" y="274" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#33475b">工具用时才取，模型见不到原文</text>
  <text x="185" y="294" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#b23a2a">日志不存明文密钥</text>
  <rect x="370" y="224" width="250" height="74" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.8"/>
  <text x="495" y="250" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#5b3aa6">脱敏 / 最小暴露</text>
  <text x="495" y="274" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#33475b">打码、只给必要最小信息</text>
  <text x="495" y="294" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#5b3aa6">可追溯但可控地记</text>
  <rect x="60" y="320" width="560" height="44" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="340" y="346" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0f4c81">数据流向决定隐私风险：本地最私密，云端看条款，第三方更高危</text>
</svg>
