<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="LLM 的三层：结构层、训练层、产品层">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">LLM 不是黑盒，而是三层：结构 → 训练 → 产品</text>
  <rect x="70" y="70" width="540" height="72" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="95" y="100" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f4c81">结构层</text>
  <text x="95" y="124" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#33475b">自回归 Transformer（decoder block：注意力 + FFN）</text>
  <rect x="70" y="164" width="540" height="72" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="95" y="194" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="700" fill="#0e7c66">训练层</text>
  <text x="95" y="218" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#33475b">预训练 → 指令微调 → 对齐</text>
  <rect x="70" y="258" width="540" height="72" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="95" y="288" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="700" fill="#b26a00">产品层</text>
  <text x="95" y="312" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#33475b">聊天、Agent、搜索对接（对话助手是这里的封装）</text>
  <line x1="340" y1="236" x2="340.0" y2="174.0" stroke="#0e7c66" stroke-width="2"/>
  <path d="M340.0 174.0 L345.0 174.0 L335.0 174.0 Z" fill="#0e7c66"/>
  <line x1="340" y1="142" x2="340.0" y2="80.0" stroke="#0f4c81" stroke-width="2"/>
  <path d="M340.0 80.0 L345.0 80.0 L335.0 80.0 Z" fill="#0f4c81"/>
  <text x="405" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">底座 → 听话 → 可用</text>
  <text x="340.0" y="372" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">你日常的“助手”是产品层封装，底层还有层层训练与结构</text>
</svg>
