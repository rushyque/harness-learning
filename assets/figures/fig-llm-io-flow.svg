<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="一次推理的输入输出链：文本 → token → 向量 → 分布 → 采样">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">从文本到输出：一次续写的完整链条</text>
  <rect x="24" y="120" width="96" height="78" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.8"/>
  <text x="72" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">文本</text>
  <text x="72" y="172" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">prompt</text>
  <text x="72" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">1</text>
  <line x1="120" y1="159" x2="120.0" y2="159.0" stroke="#0f4c81" stroke-width="2"/>
  <path d="M120.0 159.0 L120.0 164.0 L120.0 154.0 Z" fill="#0f4c81"/>
  <rect x="130" y="120" width="96" height="78" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.8"/>
  <text x="178" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">Tokenize</text>
  <text x="178" y="172" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">子词 token</text>
  <text x="178" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">2</text>
  <line x1="226" y1="159" x2="226.0" y2="159.0" stroke="#0f4c81" stroke-width="2"/>
  <path d="M226.0 159.0 L226.0 164.0 L226.0 154.0 Z" fill="#0f4c81"/>
  <rect x="236" y="120" width="96" height="78" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.8"/>
  <text x="284" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">Embed</text>
  <text x="284" y="172" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">向量 + 位置</text>
  <text x="284" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">3</text>
  <line x1="332" y1="159" x2="332.0" y2="159.0" stroke="#0f4c81" stroke-width="2"/>
  <path d="M332.0 159.0 L332.0 164.0 L332.0 154.0 Z" fill="#0f4c81"/>
  <rect x="342" y="120" width="96" height="78" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.8"/>
  <text x="390" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">N 层</text>
  <text x="390" y="172" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">Transformer 编码</text>
  <text x="390" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">4</text>
  <line x1="438" y1="159" x2="438.0" y2="159.0" stroke="#0f4c81" stroke-width="2"/>
  <path d="M438.0 159.0 L438.0 164.0 L438.0 154.0 Z" fill="#0f4c81"/>
  <rect x="448" y="120" width="96" height="78" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.8"/>
  <text x="496" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">输出头 + softmax</text>
  <text x="496" y="172" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">词表概率</text>
  <text x="496" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">5</text>
  <line x1="544" y1="159" x2="542.0" y2="159.0" stroke="#0f4c81" stroke-width="2"/>
  <path d="M542.0 159.0 L542.0 164.0 L542.0 154.0 Z" fill="#0f4c81"/>
  <rect x="552" y="120" width="96" height="78" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.8"/>
  <text x="600" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b23a2a">采样</text>
  <text x="600" y="172" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">新 token</text>
  <text x="600" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">6</text>
  <line x1="600" y1="205" x2="600.0" y2="242.0" stroke="#b23a2a" stroke-width="2" stroke-dasharray="4,3"/>
  <path d="M600.0 242.0 L595.0 242.0 L605.0 242.0 Z" fill="#b23a2a"/>
  <line x1="600" y1="252" x2="82.0" y2="252.0" stroke="#b23a2a" stroke-width="2" stroke-dasharray="4,3"/>
  <path d="M82.0 252.0 L82.0 247.0 L82.0 257.0 Z" fill="#b23a2a"/>
  <line x1="72" y1="252" x2="72.0" y2="210.0" stroke="#b23a2a" stroke-width="2" stroke-dasharray="4,3"/>
  <path d="M72.0 210.0 L77.0 210.0 L67.0 210.0 Z" fill="#b23a2a"/>
  <text x="340.0" y="292" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b23a2a">采到的新 token 接回上下文，再次走完整个链条（自回归）</text>
  <text x="340.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">没有“一次想好”，每个字都是同一套前向的重复</text>
  <text x="340.0" y="366" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">工程上用 KV cache 加速重复前向（07 章）</text>
</svg>
