<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="RAG 三段式流程">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">RAG：检索 → 注入 → 生成</text>
  <rect x="30" y="110" width="200" height="120" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="130" y="142" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">检索 Retrieve</text>
  <text x="130" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">资料库找相关片段</text>
  <text x="130" y="198" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">（外部资料库）</text>
  <rect x="250" y="110" width="200" height="120" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="350" y="142" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">注入 Augment</text>
  <text x="350" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">片段拼进 prompt</text>
  <text x="350" y="198" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">（片段进上下文）</text>
  <rect x="470" y="110" width="200" height="120" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="570" y="142" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">生成 Generate</text>
  <text x="570" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">基于片段+问题产出</text>
  <text x="570" y="198" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">（答案带出处）</text>
  <line x1="234" y1="170" x2="236.0" y2="170.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M236.0 170.0 L236.0 175.0 L236.0 165.0 Z" fill="#b26a00"/>
  <text x="240" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">→</text>
  <line x1="454" y1="170" x2="456.0" y2="170.0" stroke="#0e7c66" stroke-width="2.5"/>
  <path d="M456.0 170.0 L456.0 175.0 L456.0 165.0 Z" fill="#0e7c66"/>
  <text x="460" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">→</text>
  <rect x="55" y="260" width="570" height="60" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="340" y="286" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">解决：过时知识 / 幻觉 / 长文档塞不进窗口</text>
  <text x="340" y="309" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">向量检索 ≈ 语义搜索：找“意思相近”的资料块</text>
  <text x="340.0" y="352" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">进化方向：query 改写、多跳检索、rerank、Agentic RAG</text>
</svg>
