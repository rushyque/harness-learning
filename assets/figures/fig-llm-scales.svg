<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="衡量 LLM 的三个维度">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">三种“大小”观：参数、上下文、量化</text>
  <rect x="70" y="90" width="180" height="210" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="160" y="122" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f4c81">参数量</text>
  <text x="160" y="152" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">可调数字个数</text>
  <text x="160" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#33475b">7B / 70B / 几百 B</text>
  <line x1="100" y1="214" x2="220" y2="214" stroke="#9db4cc" stroke-width="1.5"/>
  <text x="160" y="248" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">决定能力与内存</text>
  <rect x="270" y="90" width="180" height="210" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="360" y="122" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0e7c66">上下文窗口</text>
  <text x="360" y="152" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">一次能容纳的 token 上限</text>
  <text x="360" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#33475b">4k / 32k / 128k</text>
  <line x1="300" y1="214" x2="420" y2="214" stroke="#9db4cc" stroke-width="1.5"/>
  <text x="360" y="248" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">决定能看到多远</text>
  <rect x="470" y="90" width="180" height="210" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="560" y="122" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#b26a00">量化 / 精度</text>
  <text x="560" y="152" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">数字用多少 bit 存</text>
  <text x="560" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#33475b">FP16 / INT8 / INT4</text>
  <line x1="500" y1="214" x2="620" y2="214" stroke="#9db4cc" stroke-width="1.5"/>
  <text x="560" y="248" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">省内存但损失精度</text>
  <rect x="70" y="320" width="560" height="60" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="350" y="346" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">参数决定能力，上下文决定“看到多少”，量化决定能否本地跑</text>
  <text x="350" y="370" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">7B 消费级能跑，往往靠量化降内存</text>
</svg>
