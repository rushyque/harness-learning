<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="缩放：标准化 vs 归一化">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="32" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#1c2733">两种常见缩放：量纲不同无法直接比较</text>
  <text x="70" y="88" text-anchor="start" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#33475b">原始</text>
  <rect x="90" y="94.0" width="40" height="8.0" rx="3" fill="#5e6b7a"/>
  <text x="110.0" y="118" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">18</text>
  <rect x="154" y="88.85714285714286" width="40" height="13.142857142857142" rx="3" fill="#5e6b7a"/>
  <text x="174.0" y="118" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">24</text>
  <rect x="218" y="83.71428571428572" width="40" height="18.285714285714285" rx="3" fill="#5e6b7a"/>
  <text x="238.0" y="118" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">30</text>
  <rect x="282" y="75.14285714285714" width="40" height="26.857142857142858" rx="3" fill="#5e6b7a"/>
  <text x="302.0" y="118" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">40</text>
  <rect x="346" y="64.85714285714286" width="40" height="37.14285714285714" rx="3" fill="#5e6b7a"/>
  <text x="366.0" y="118" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">52</text>
  <rect x="410" y="58.0" width="40" height="44.0" rx="3" fill="#5e6b7a"/>
  <text x="430.0" y="118" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">60</text>
  <text x="70" y="180" text-anchor="start" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#33475b">标准化 StandardScaler</text>
  <rect x="90" y="182.4" width="40" height="11.6" rx="3" fill="#0f4c81"/>
  <text x="110.0" y="210" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">-1.29</text>
  <rect x="154" y="177.9" width="40" height="16.1" rx="3" fill="#0f4c81"/>
  <text x="174.0" y="210" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">-0.89</text>
  <rect x="218" y="171.6" width="40" height="22.4" rx="3" fill="#0f4c81"/>
  <text x="238.0" y="210" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">-0.49</text>
  <rect x="282" y="168.0" width="40" height="26.0" rx="3" fill="#0f4c81"/>
  <text x="302.0" y="210" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">+0.18</text>
  <rect x="346" y="163.5" width="40" height="30.5" rx="3" fill="#0f4c81"/>
  <text x="366.0" y="210" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">+0.98</text>
  <rect x="410" y="159.0" width="40" height="35.0" rx="3" fill="#0f4c81"/>
  <text x="430.0" y="210" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">+1.52</text>
  <text x="70" y="272" text-anchor="start" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#33475b">归一化 MinMaxScaler</text>
  <rect x="90" y="278.0" width="40" height="8.0" rx="3" fill="#0e7c66"/>
  <text x="110.0" y="302" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">0.0</text>
  <rect x="154" y="270.8" width="40" height="15.2" rx="3" fill="#0e7c66"/>
  <text x="174.0" y="302" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">0.2</text>
  <rect x="218" y="263.6" width="40" height="22.4" rx="3" fill="#0e7c66"/>
  <text x="238.0" y="302" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">0.4</text>
  <rect x="282" y="256.4" width="40" height="29.599999999999998" rx="3" fill="#0e7c66"/>
  <text x="302.0" y="302" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">0.6</text>
  <rect x="346" y="249.2" width="40" height="36.8" rx="3" fill="#0e7c66"/>
  <text x="366.0" y="302" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">0.8</text>
  <rect x="410" y="242.0" width="40" height="44.0" rx="3" fill="#0e7c66"/>
  <text x="430.0" y="302" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">1.0</text>
  <text x="340.0" y="366" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#33475b">标准化把数据拉成均值 0、方差 1；归一化把数据压进 [0,1]——都消除量纲差异</text>
  <text x="340.0" y="388" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#5e6b7a">树模型不吃这一套；线性、距离、神经网络强烈依赖</text>
</svg>
