<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="工具层的多道护栏在真执行前拦截">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">工具层最靠近执行：在这里做硬校验才能拦住</text>
  <rect x="60" y="96" width="72" height="76" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="96" y="126" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0f4c81">参数校验</text>
  <text x="96" y="152" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="400" fill="#33475b">格式/范围</text>
  <line x1="134" y1="134" x2="132.0" y2="134.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M132.0 134.0 L132.0 139.0 L132.0 129.0 Z" fill="#b26a00"/>
  <rect x="145" y="96" width="72" height="76" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="181" y="126" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0e7c66">作用域</text>
  <text x="181" y="152" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="400" fill="#33475b">目标在允许目录</text>
  <line x1="219" y1="134" x2="217.0" y2="134.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M217.0 134.0 L217.0 139.0 L217.0 129.0 Z" fill="#b26a00"/>
  <rect x="230" y="96" width="72" height="76" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="266" y="126" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#b26a00">白名单</text>
  <text x="266" y="152" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="400" fill="#33475b">命令/类型允许</text>
  <line x1="304" y1="134" x2="302.0" y2="134.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M302.0 134.0 L302.0 139.0 L302.0 129.0 Z" fill="#b26a00"/>
  <rect x="315" y="96" width="72" height="76" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="2"/>
  <text x="351" y="126" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#b23a2a">拒绝清单</text>
  <text x="351" y="152" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="400" fill="#33475b">封禁 rm -rf 等</text>
  <line x1="389" y1="134" x2="387.0" y2="134.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M387.0 134.0 L387.0 139.0 L387.0 129.0 Z" fill="#b26a00"/>
  <rect x="400" y="96" width="72" height="76" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="2"/>
  <text x="436" y="126" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#5b3aa6">审批钩子</text>
  <text x="436" y="152" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="400" fill="#33475b">危险再确认</text>
  <rect x="470" y="96" width="150" height="76" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="545" y="126" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0e7c66">全部通过才能执行</text>
  <text x="545" y="152" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#33475b">在沙箱内跑</text>
  <line x1="432" y1="134" x2="456.0" y2="134.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M456.0 134.0 L456.0 139.0 L456.0 129.0 Z" fill="#b26a00"/>
  <rect x="60" y="200" width="560" height="54" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.8"/>
  <text x="340" y="226" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0f4c81">只校验“有参数”不够，要校验“做什么、对谁做、能不能做”</text>
  <text x="340" y="246" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">path 是否在根目录、是否可写、是否被禁 · 非法即拒绝</text>
  <rect x="60" y="280" width="260" height="62" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.8"/>
  <text x="190" y="306" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">白名单 + 拒绝清单</text>
  <text x="190" y="328" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">默认收敛 + 高危显式封死</text>
  <rect x="350" y="280" width="270" height="62" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.8"/>
  <text x="485" y="306" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#5b3aa6">审批最人性化</text>
  <text x="485" y="328" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#33475b">把危险项交给人/明确策略判断</text>
  <rect x="60" y="356" width="560" height="36" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.5"/>
  <text x="340" y="379" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b23a2a">多道都过才真执行：删除/覆盖/写外区/装依赖要审批</text>
</svg>
