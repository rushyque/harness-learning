<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="profile = 目标驱动的 Agent 配方">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">先想目标，再选恰好够用的能力</text>
  <rect x="60" y="90" width="260" height="220" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="190" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">目标：这个 agent 干什么</text>
  <text x="190" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">-- 模型 / 参数</text>
  <text x="190" y="166" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#5e6b7a">     deepseek-chat...</text>
  <text x="190" y="182" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">-- 工具</text>
  <text x="190" y="198" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#5e6b7a">     shell / fs / web / mcp</text>
  <text x="190" y="214" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">-- Skill</text>
  <text x="190" y="230" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#5e6b7a">     可复用方法</text>
  <text x="190" y="246" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">-- 权限 / 审批</text>
  <text x="190" y="262" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#5e6b7a">     白名单 / 危险拦截</text>
  <text x="190" y="278" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">-- 系统提示</text>
  <text x="190" y="294" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#5e6b7a">     怎么说话、边界</text>
  <line x1="324" y1="200" x2="356.0" y2="200.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M356.0 200.0 L356.0 205.0 L356.0 195.0 Z" fill="#b26a00"/>
  <rect x="370" y="90" width="250" height="150" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="495" y="122" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0e7c66">装配成 Agent</text>
  <text x="495" y="152" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">把头/工具/记忆/权限</text>
  <text x="495" y="174" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">组合成一个可运行体</text>
  <text x="495" y="196" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0e7c66">按需选能力</text>
  <rect x="370" y="262" width="250" height="50" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.8"/>
  <text x="495" y="288" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b23a2a">“全都要”不好</text>
  <text x="495" y="308" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">攻击面大 · 慢 · 贵</text>
  <text x="190" y="352" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#5b3aa6">最小权限：不在配置里的插件不出现</text>
</svg>
