<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="自一致性多路投票">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">Self-Consistency：多条推理，取多数</text>
  <rect x="70" y="90" width="180" height="80" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="160" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">同一问题</text>
  <text x="160" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">生成 N 条独立推理</text>
  <line x1="254" y1="130" x2="286.0" y2="130.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M286.0 130.0 L286.0 135.0 L286.0 125.0 Z" fill="#b26a00"/>
  <rect x="300" y="90" width="160" height="52" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.8"/>
  <text x="380" y="121" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">推理路径 A → 答案 X</text>
  <rect x="300" y="175" width="160" height="52" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.8"/>
  <text x="380" y="206" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b26a00">推理路径 B → 答案 Y</text>
  <rect x="300" y="260" width="160" height="52" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.8"/>
  <text x="380" y="291" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">推理路径 C → 答案 X</text>
  <rect x="480" y="90" width="140" height="210" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="2"/>
  <text x="550" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#5b3aa6">多数一致</text>
  <text x="550" y="160" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#33475b">答案 X：2</text>
  <text x="550" y="184" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">答案 Y：1</text>
  <text x="550" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#5b3aa6">→ 选 X</text>
  <line x1="464" y1="130" x2="466.0" y2="130.0" stroke="#0e7c66" stroke-width="2"/>
  <path d="M466.0 130.0 L466.0 135.0 L466.0 125.0 Z" fill="#0e7c66"/>
  <line x1="464" y1="201" x2="466.0" y2="201.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M466.0 201.0 L466.0 206.0 L466.0 196.0 Z" fill="#b26a00"/>
  <line x1="464" y1="286" x2="466.0" y2="286.0" stroke="#0e7c66" stroke-width="2"/>
  <path d="M466.0 286.0 L466.0 291.0 L466.0 281.0 Z" fill="#0e7c66"/>
  <rect x="70" y="300" width="550" height="58" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="345" y="326" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">多个“推理器”投票，比单条更稳</text>
  <text x="345" y="348" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b23a2a">代价：多烧几倍 token</text>
</svg>
