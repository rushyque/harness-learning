<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="投机解码流程">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">投机解码：用便宜猜想换吞吐</text>
  <rect x="55" y="100" width="250" height="120" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="180" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">草稿模型（小、快）</text>
  <text x="180" y="156" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">快速生成 k 个候选 token</text>
  <text x="180" y="180" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#5e6b7a">便宜但可能不准</text>
  <line x1="305" y1="160" x2="340.0" y2="160.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M340.0 160.0 L340.0 165.0 L340.0 155.0 Z" fill="#b26a00"/>
  <text x="327" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b26a00">候选</text>
  <rect x="350" y="100" width="275" height="120" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="487" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">大模型（一次验证）</text>
  <text x="487" y="156" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">批量确认 k 个候选</text>
  <text x="487" y="180" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">对的照单全收，错的重来</text>
  <rect x="55" y="245" width="570" height="70" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="340" y="271" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">一次前向确认多个 token → 吞吐提升</text>
  <text x="340" y="295" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">输出分布不变（近似无损）</text>
  <text x="340.0" y="350" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">是主流推理库的高频优化</text>
</svg>
