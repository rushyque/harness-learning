<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="Agent 的三个核心部件">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">Agent = 模型 + 工具 + 记忆 + 循环</text>
  <rect x="70" y="100" width="150" height="130" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="145" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">大脑（模型）</text>
  <text x="145" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">思考、决策、生成行动</text>
  <text x="145" y="200" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">缺它则无从决策</text>
  <rect x="250" y="100" width="150" height="130" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="325" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">手（工具）</text>
  <text x="325" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">读写文件、执行命令</text>
  <text x="325" y="200" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">缺它则空谈</text>
  <rect x="430" y="100" width="150" height="130" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="505" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">记忆（上下文）</text>
  <text x="505" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">记得历史与结果</text>
  <text x="505" y="200" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">缺它则失忆</text>
  <text x="220" y="175" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#b26a00">+</text>
  <text x="400" y="175" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#b26a00">+</text>
  <text x="580" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#5b3aa6">= Agent</text>
  <rect x="90" y="255" width="500" height="60" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="340" y="281" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">循环（loop）把三者串起来、驱动与终止</text>
  <text x="340" y="304" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">无工具则空谈；无记忆则每次失忆；无模型则无从决策</text>
  <text x="340.0" y="356" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">在 harness 里：ctx.llm / ctx.tools / session / ctx.agentLoop</text>
</svg>
