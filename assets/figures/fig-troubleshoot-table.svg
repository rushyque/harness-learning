<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="故障快速排查表">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">对号入座，优先检查、对症下药</text>
  <rect x="70" y="70" width="540" height="40" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.8"/>
  <text x="200" y="95" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">症状</text>
  <text x="390" y="95" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">可能原因</text>
  <text x="560" y="95" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">对策</text>
  <rect x="70" y="118" width="540" height="36" rx="6" fill="#fafbfc" stroke="#9db4cc" stroke-width="1"/>
  <text x="150" y="141" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#33475b">卡死转圈</text>
  <text x="390" y="141" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">无终止判断</text>
  <text x="560" y="141" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">硬上限</text>
  <rect x="70" y="160" width="540" height="36" rx="6" fill="#fafbfc" stroke="#9db4cc" stroke-width="1"/>
  <text x="150" y="183" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#33475b">假装成功</text>
  <text x="390" y="183" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">幻觉</text>
  <text x="560" y="183" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">禁猜结果</text>
  <rect x="70" y="202" width="540" height="36" rx="6" fill="#fafbfc" stroke="#9db4cc" stroke-width="1"/>
  <text x="150" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#33475b">用错工具</text>
  <text x="390" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">描述差</text>
  <text x="560" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">写好描述</text>
  <rect x="70" y="244" width="540" height="36" rx="6" fill="#fafbfc" stroke="#9db4cc" stroke-width="1"/>
  <text x="150" y="267" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#33475b">上下文爆</text>
  <text x="390" y="267" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">全量回填</text>
  <text x="560" y="267" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">截断/摘要/检索</text>
  <rect x="70" y="286" width="540" height="36" rx="6" fill="#fafbfc" stroke="#9db4cc" stroke-width="1"/>
  <text x="150" y="309" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#33475b">计划死磕</text>
  <text x="390" y="309" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">不修正</text>
  <text x="560" y="309" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">可改可回退</text>
  <rect x="70" y="328" width="540" height="36" rx="6" fill="#fafbfc" stroke="#9db4cc" stroke-width="1"/>
  <text x="150" y="351" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#33475b">越权操作</text>
  <text x="390" y="351" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">权限过宽</text>
  <text x="560" y="351" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">最小权限</text>
  <text x="340.0" y="382" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#5b3aa6">别一上来改 prompt：先复现、定位、归类、再修最小</text>
</svg>
