<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="能力缝的三件套">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">契约 + 实现 + 使用，三者齐才通</text>
  <rect x="70" y="76" width="190" height="84" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="165" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">Service Definition</text>
  <text x="165" y="126" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">能力的契约/接口</text>
  <text x="165" y="146" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">长什么样</text>
  <rect x="420" y="76" width="190" height="84" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="515" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">Service Provider</text>
  <text x="515" y="126" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">契约的具体实现</text>
  <text x="515" y="146" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">怎么真正干活</text>
  <rect x="245" y="200" width="190" height="84" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="340" y="224" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">Consumer</text>
  <text x="340" y="250" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">谁去调用它</text>
  <text x="340" y="270" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">agent/工具侧</text>
  <line x1="264" y1="118" x2="406.0" y2="118.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M406.0 118.0 L406.0 123.0 L406.0 113.0 Z" fill="#b26a00"/>
  <text x="340" y="106" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b26a00">提供契约</text>
  <line x1="470" y1="160" x2="394.0" y2="195.7" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M394.0 195.7 L391.9 191.2 L396.2 200.3 Z" fill="#b26a00"/>
  <text x="448" y="182" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b26a00">调用实现</text>
  <line x1="260" y1="242" x2="206.1" y2="171.9" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M206.1 171.9 L210.1 168.9 L202.1 175.0 Z" fill="#b26a00"/>
  <text x="206" y="226" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b26a00">被使用</text>
  <text x="340" y="300" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">插座标准（Definition）独立于电器（Provider）与使用（Consumer）</text>
  <rect x="70" y="316" width="540" height="64" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.8"/>
  <text x="340" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#5b3aa6">缺 Definition：消费者不知有何接口可调</text>
  <text x="340" y="359" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">缺 Consumer：实现只是孤岛；缺 Provider：契约是空头支票</text>
  <text x="340" y="376" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#5b3aa6">只有三者齐，一条能力缝才真正通</text>
</svg>
