<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-label="一次推理六步：tokenize、embed、forward、head、sample、append">
  <rect x="0" y="0" width="680" height="420" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">一次推理的六步流水线</text>
  <rect x="26" y="110" width="92" height="74" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.8"/>
  <text x="72" y="140" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0f4c81">1 Tokenize</text>
  <text x="72" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">文本 → 索引</text>
  <line x1="118" y1="147" x2="122.0" y2="147.0" stroke="#0f4c81" stroke-width="2"/>
  <path d="M122.0 147.0 L122.0 152.0 L122.0 142.0 Z" fill="#0f4c81"/>
  <rect x="132" y="110" width="92" height="74" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.8"/>
  <text x="178" y="140" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0f4c81">2 Embed+Pos</text>
  <text x="178" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">向量 + 位置</text>
  <line x1="224" y1="147" x2="228.0" y2="147.0" stroke="#0f4c81" stroke-width="2"/>
  <path d="M228.0 147.0 L228.0 152.0 L228.0 142.0 Z" fill="#0f4c81"/>
  <rect x="238" y="110" width="92" height="74" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.8"/>
  <text x="284" y="140" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">3 Forward</text>
  <text x="284" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">N 层编码</text>
  <line x1="330" y1="147" x2="334.0" y2="147.0" stroke="#0f4c81" stroke-width="2"/>
  <path d="M334.0 147.0 L334.0 152.0 L334.0 142.0 Z" fill="#0f4c81"/>
  <rect x="344" y="110" width="92" height="74" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.8"/>
  <text x="390" y="140" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b26a00">4 Head</text>
  <text x="390" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">词表 logits</text>
  <line x1="436" y1="147" x2="440.0" y2="147.0" stroke="#0f4c81" stroke-width="2"/>
  <path d="M440.0 147.0 L440.0 152.0 L440.0 142.0 Z" fill="#0f4c81"/>
  <rect x="450" y="110" width="92" height="74" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.8"/>
  <text x="496" y="140" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b26a00">5 Sample</text>
  <text x="496" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">采一个 token</text>
  <line x1="542" y1="147" x2="544.0" y2="147.0" stroke="#0f4c81" stroke-width="2"/>
  <path d="M544.0 147.0 L544.0 152.0 L544.0 142.0 Z" fill="#0f4c81"/>
  <rect x="554" y="110" width="92" height="74" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.8"/>
  <text x="600" y="140" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b23a2a">6 Append</text>
  <text x="600" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">接回上下文</text>
  <rect x="90" y="232" width="500" height="40" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="340" y="258" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">第 3 步用因果掩码：第 i 个 token 只能看到 0..i，不偷看未来</text>
  <line x1="600" y1="184" x2="82.0" y2="184.0" stroke="#b23a2a" stroke-width="2" stroke-dasharray="4,3"/>
  <path d="M82.0 184.0 L82.0 179.0 L82.0 189.0 Z" fill="#b23a2a"/>
  <text x="340" y="300" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#33475b">第 6 步把新 token 接回末尾后，回到第 1 步，序列整体再走一遍</text>
  <text x="340.0" y="348" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b26a00">采样策略调节“稳 vs 奇”：贪心 / temperature / top-k / top-p</text>
  <text x="340.0" y="380" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">输出是“概率采样”，不是“必然答案”</text>
</svg>
