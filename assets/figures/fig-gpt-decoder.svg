<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="GPT 只保留解码器 + 因果掩码">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">从完整 Transformer 到 GPT</text>
  <rect x="55" y="80" width="275" height="140" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="192" y="108" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f4c81">完整 Transformer</text>
  <rect x="75" y="128" width="90" height="40" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="120" y="153" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">Encoder</text>
  <rect x="185" y="128" width="90" height="40" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="230" y="153" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">Decoder</text>
  <rect x="125" y="178" width="140" height="26" rx="6" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="195" y="195" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b26a00">交叉注意力</text>
  <text x="192" y="216" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#5e6b7a">翻译/摘要都需要</text>
  <line x1="330" y1="150" x2="375.0" y2="150.0" stroke="#b23a2a" stroke-width="2"/>
  <path d="M375.0 150.0 L375.0 155.0 L375.0 145.0 Z" fill="#b23a2a"/>
  <text x="357" y="137" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b23a2a">去掉</text>
  <rect x="385" y="80" width="240" height="140" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="505" y="108" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0e7c66">GPT（只留 Decoder）</text>
  <rect x="410" y="128" width="190" height="40" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="505" y="153" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">掩码自注意力 + FFN</text>
  <text x="505" y="196" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#5e6b7a">因果掩码 + 自回归</text>
  <rect x="55" y="245" width="570" height="80" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="340" y="273" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">GPT = 解码器风格 Transformer</text>
  <text x="340" y="297" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#33475b">+ 因果掩码 + 海量文本预训练 = LLM</text>
  <text x="340.0" y="356" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">“预测下一个词”从 Seq2Seq 独立出来，成为规模化的自回归模型</text>
  <text x="340.0" y="382" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">没有“先完整理解再生成”的过程，只做预测下一个词</text>
</svg>
