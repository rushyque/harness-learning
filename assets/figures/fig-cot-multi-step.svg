<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="一步想完 vs 多步推理">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">把推理展开成多步，更稳、可校验</text>
  <rect x="60" y="90" width="260" height="130" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="2"/>
  <text x="190" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b23a2a">一步想完（易错）</text>
  <text x="190" y="148" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">问题→直接给答案</text>
  <text x="190" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b23a2a">一步错全错</text>
  <text x="190" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">中间不可回看</text>
  <rect x="360" y="90" width="260" height="130" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="490" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">多步推理（更稳）</text>
  <text x="490" y="148" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">步骤1→步骤2→步骤3</text>
  <text x="490" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">每步更简单可校验</text>
  <text x="490" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">中间可见可定位</text>
  <rect x="60" y="250" width="260" height="60" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.8"/>
  <text x="190" y="276" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">CoT</text>
  <text x="190" y="298" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">外化隐藏思考为文本步骤</text>
  <rect x="360" y="250" width="260" height="60" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.8"/>
  <text x="490" y="276" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">ReAct</text>
  <text x="490" y="298" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">思考+真实行动取观察</text>
  <text x="340.0" y="356" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#5b3aa6">代价：更慢更贵、可能暴露思考；关键任务上用</text>
</svg>
