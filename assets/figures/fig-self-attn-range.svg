<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="自注意力长距离直连 vs RNN 逐层传递">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">长距离依赖：Attention 一步直连，RNN 逐层传递</text>
  <rect x="55" y="80" width="280" height="200" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="195" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0e7c66">自注意力</text>
  <rect x="73" y="140" width="44" height="34" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="95" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">fruit</text>
  <rect x="133" y="140" width="44" height="34" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="155" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">the</text>
  <rect x="193" y="140" width="44" height="34" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="215" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">few</text>
  <rect x="223" y="140" width="44" height="34" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="245" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">...</text>
  <rect x="283" y="140" width="44" height="34" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="305" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">apple</text>
  <line x1="220" y1="205" x2="130.0" y2="205.0" stroke="#0e7c66" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M130.0 205.0 L130.0 200.0 L130.0 210.0 Z" fill="#0e7c66"/>
  <line x1="290" y1="205" x2="236.0" y2="205.0" stroke="#0e7c66" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M236.0 205.0 L236.0 200.0 L236.0 210.0 Z" fill="#0e7c66"/>
  <text x="195" y="246" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0e7c66">任意远一步可达、并行算</text>
  <text x="195" y="268" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">apple→fruit 直接相连</text>
  <rect x="345" y="80" width="280" height="200" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="2"/>
  <text x="485" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#b23a2a">RNN</text>
  <rect x="380" y="150" width="36" height="34" rx="6" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.5"/>
  <text x="398" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b23a2a">h1</text>
  <rect x="428" y="150" width="36" height="34" rx="6" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.5"/>
  <text x="446" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b23a2a">h2</text>
  <rect x="476" y="150" width="36" height="34" rx="6" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.5"/>
  <text x="494" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b23a2a">h3</text>
  <rect x="524" y="150" width="36" height="34" rx="6" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.5"/>
  <text x="542" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b23a2a">…</text>
  <rect x="572" y="150" width="36" height="34" rx="6" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.5"/>
  <text x="590" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b23a2a">hT</text>
  <line x1="416" y1="167" x2="442.0" y2="167.0" stroke="#b23a2a" stroke-width="2"/>
  <path d="M442.0 167.0 L442.0 172.0 L442.0 162.0 Z" fill="#b23a2a"/>
  <line x1="464" y1="167" x2="490.0" y2="167.0" stroke="#b23a2a" stroke-width="2"/>
  <path d="M490.0 167.0 L490.0 172.0 L490.0 162.0 Z" fill="#b23a2a"/>
  <line x1="512" y1="167" x2="538.0" y2="167.0" stroke="#b23a2a" stroke-width="2"/>
  <path d="M538.0 167.0 L538.0 172.0 L538.0 162.0 Z" fill="#b23a2a"/>
  <line x1="560" y1="167" x2="586.0" y2="167.0" stroke="#b23a2a" stroke-width="2"/>
  <path d="M586.0 167.0 L586.0 172.0 L586.0 162.0 Z" fill="#b23a2a"/>
  <text x="485" y="226" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b23a2a">每步只传给相邻</text>
  <text x="485" y="248" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">早期信息易丢失</text>
  <text x="485" y="270" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">无法并行</text>
  <text x="340.0" y="326" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">一个注意力头就能“看见”任意远的词，无需一层层传</text>
  <text x="340.0" y="356" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">同时每个位置独立计算 → 全部位置可并行</text>
</svg>
