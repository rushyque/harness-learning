<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="teacher forcing：训练与推理的输入差异">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">Teacher Forcing：训练喂“真实答案”，推理喂“自己的预测”</text>
  <rect x="55" y="80" width="280" height="250" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="195" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0e7c66">训练（teacher forcing）</text>
  <text x="90" y="150" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">上一步 = 真实 token y₁</text>
  <rect x="90" y="170" width="190" height="40" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="185" y="195" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">Decoder 输入 y₁（真实）</text>
  <line x1="185" y1="210" x2="185.0" y2="235.0" stroke="#0e7c66" stroke-width="2"/>
  <path d="M185.0 235.0 L180.0 235.0 L190.0 235.0 Z" fill="#0e7c66"/>
  <rect x="90" y="245" width="190" height="40" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="185" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">学习正确的前后文</text>
  <text x="195" y="316" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#5e6b7a">收敛快：不在错误输入上学</text>
  <rect x="345" y="80" width="280" height="250" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="485" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#b26a00">推理（自回归）</text>
  <text x="380" y="150" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">上一步 = 自己的预测 ŷ₁</text>
  <rect x="380" y="170" width="190" height="40" rx="6" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="475" y="195" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">Decoder 输入 ŷ₁（预测）</text>
  <line x1="475" y1="210" x2="475.0" y2="235.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M475.0 235.0 L470.0 235.0 L480.0 235.0 Z" fill="#b26a00"/>
  <rect x="380" y="245" width="190" height="40" rx="6" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.5"/>
  <text x="475" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b23a2a">错误可能滚雪球</text>
  <text x="485" y="316" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#5e6b7a">训练与推理不一致是风险</text>
  <text x="340.0" y="364" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">早期预测不准，若喂回自己的错误会“一步错、步步错”</text>
</svg>
