<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="Skip-gram：中心词预测窗口内的上下文词，把语义写进词向量">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">Skip-gram 窗口：中心词预测左右邻近的上下文词</text>
  <rect x="92" y="152" width="56" height="52" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="120" y="178" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f4c81">the</text>
  <text x="120" y="196" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0f4c81">上下文 c</text>
  <rect x="212" y="152" width="56" height="52" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="240" y="178" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f4c81">cat</text>
  <text x="240" y="196" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0f4c81">上下文 c</text>
  <rect x="328" y="150" width="64" height="56" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2.5"/>
  <text x="360" y="176" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#b26a00">sat</text>
  <text x="360" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">中心词 w</text>
  <rect x="452" y="152" width="56" height="52" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="480" y="178" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f4c81">on</text>
  <text x="480" y="196" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0f4c81">上下文 c</text>
  <rect x="572" y="152" width="56" height="52" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="600" y="178" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f4c81">the</text>
  <text x="600" y="196" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0f4c81">上下文 c</text>
  <line x1="330" y1="170" x2="158.0" y2="160.5" stroke="#0e7c66" stroke-width="2"/>
  <path d="M158.0 160.5 L158.3 155.6 L157.7 165.5 Z" fill="#0e7c66"/>
  <line x1="330" y1="170" x2="277.9" y2="161.6" stroke="#0e7c66" stroke-width="2"/>
  <path d="M277.9 161.6 L278.7 156.7 L277.1 166.5 Z" fill="#0e7c66"/>
  <line x1="390" y1="170" x2="442.1" y2="161.6" stroke="#0e7c66" stroke-width="2"/>
  <path d="M442.1 161.6 L442.9 166.5 L441.3 156.7 Z" fill="#0e7c66"/>
  <line x1="390" y1="170" x2="562.0" y2="160.5" stroke="#0e7c66" stroke-width="2"/>
  <path d="M562.0 160.5 L562.3 165.5 L561.7 155.6 Z" fill="#0e7c66"/>
  <text x="340.0" y="262" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0e7c66">模型要最大化  P(c | w)，即中心词能“带出”上下文</text>
  <line x1="60" y1="286" x2="620" y2="286" stroke="#9db4cc" stroke-width="1.5"/>
  <text x="340.0" y="316" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#33475b">训练完的副产品：每个词在隐藏层学到的向量就是词向量</text>
  <text x="340.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">为了预测上下文，模型被迫把词的语义写进向量</text>
  <text x="340.0" y="372" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b26a00">分布假说：出现在相似上下文里的词，语义相近</text>
</svg>
