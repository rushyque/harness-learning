<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="红队：攻击者视角主动找漏洞并回归">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">不是等出事，而是主动攻击，发现并被兜住</text>
  <path d="M 60.0,148.0 L 500.0,148.0" fill="none" stroke="#b26a00" stroke-width="2"/>
  <rect x="60" y="104" width="84" height="52" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="102" y="136" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#b26a00">直接注入</text>
  <rect x="150" y="104" width="84" height="52" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="2"/>
  <text x="192" y="136" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#b23a2a">间接注入</text>
  <rect x="240" y="104" width="84" height="52" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="282" y="136" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f4c81">越权</text>
  <rect x="330" y="104" width="84" height="52" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="2"/>
  <text x="372" y="136" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#5b3aa6">隐私泄露</text>
  <rect x="420" y="104" width="84" height="52" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="462" y="136" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0e7c66">工具滥用</text>
  <rect x="460" y="200" width="160" height="96" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="540" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">记录突破</text>
  <text x="540" y="256" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">哪个防线被越过</text>
  <text x="540" y="278" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#5e6b7a">在隔离环境跑</text>
  <line x1="540" y1="172" x2="540.0" y2="188.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M540.0 188.0 L535.0 188.0 L545.0 188.0 Z" fill="#b26a00"/>
  <text x="560" y="188" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#5e6b7a">攻击后</text>
  <line x1="540" y1="296" x2="540.0" y2="260.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M540.0 260.0 L545.0 260.0 L535.0 260.0 Z" fill="#b26a00"/>
  <rect x="230" y="200" width="200" height="96" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="330" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">反馈到设计</text>
  <text x="330" y="256" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">越权→收紧权限</text>
  <text x="330" y="278" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">注入→结构隔离/护栏</text>
  <line x1="230" y1="248" x2="192.0" y2="248.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M192.0 248.0 L192.0 243.0 L192.0 253.0 Z" fill="#b26a00"/>
  <rect x="60" y="200" width="118" height="96" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="2"/>
  <text x="119" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#5b3aa6">分类</text>
  <text x="119" y="258" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#33475b">提示/权限/沙箱/审批</text>
  <line x1="178" y1="248" x2="216.0" y2="248.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M216.0 248.0 L216.0 253.0 L216.0 243.0 Z" fill="#b26a00"/>
  <path d="M 119.0,200.0 L 119.0,172.0 L 185.0,130.0" fill="none" stroke="#b26a00" stroke-width="2.5"/>
  <text x="119" y="192" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#5e6b7a">回到攻击清单</text>
  <rect x="60" y="320" width="560" height="44" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.5"/>
  <text x="340" y="346" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b23a2a">红队持续 + 随能力扩展回归：发现越权/注入/泄露/滥用各自收紧</text>
</svg>
