<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="RLHF 三步流程">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">RLHF：让“人的偏好”变成可优化的信号</text>
  <rect x="50" y="120" width="160" height="110" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="130" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">1. 偏好排序</text>
  <text x="130" y="180" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">人类给多个回答排序</text>
  <text x="130" y="206" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">（标注偏好数据）</text>
  <rect x="270" y="120" width="160" height="110" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="350" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">2. 奖励模型</text>
  <text x="350" y="180" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">学会给回答打分</text>
  <text x="350" y="206" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">（监督训练）</text>
  <rect x="490" y="120" width="160" height="110" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="570" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">3. 强化学习</text>
  <text x="570" y="180" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">优化策略模型</text>
  <text x="570" y="206" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">（如 PPO）</text>
  <line x1="214" y1="175" x2="256.0" y2="175.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M256.0 175.0 L256.0 180.0 L256.0 170.0 Z" fill="#b26a00"/>
  <text x="240" y="164" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b26a00">打分</text>
  <line x1="434" y1="175" x2="476.0" y2="175.0" stroke="#0e7c66" stroke-width="2"/>
  <path d="M476.0 175.0 L476.0 180.0 L476.0 170.0 Z" fill="#0e7c66"/>
  <text x="460" y="164" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">优化</text>
  <rect x="90" y="260" width="500" height="60" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="340" y="286" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">先是“评委”学会什么算好，再让“选手”往好回答靠</text>
  <text x="340" y="308" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">现代还有 DPO 等直接偏好优化，思路一致</text>
  <text x="340.0" y="356" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">对齐让模型“符合偏好与安全”，但不会凭空增加知识（知识在预训练）</text>
</svg>
