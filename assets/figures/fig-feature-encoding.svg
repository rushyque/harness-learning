<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" aria-label="类别编码：label 编码 vs one-hot 编码">
  <rect x="0" y="0" width="680" height="330" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="32" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1c2733">编码方式对比：别给类别强加顺序</text>
  <text x="50" y="78" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="700" fill="#b23a2a">Label 编码（会引入顺序）</text>
  <rect x="50" y="100" width="120" height="27" rx="6" fill="#fbeae6" stroke="#b23a2a" stroke-width="1.5"/>
  <text x="62" y="119" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400" fill="#33475b">猫</text>
  <text x="158" y="119" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="700" fill="#b23a2a">0</text>
  <rect x="50" y="136" width="120" height="27" rx="6" fill="#fbeae6" stroke="#b23a2a" stroke-width="1.5"/>
  <text x="62" y="155" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400" fill="#33475b">狗</text>
  <text x="158" y="155" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="700" fill="#b23a2a">1</text>
  <rect x="50" y="172" width="120" height="27" rx="6" fill="#fbeae6" stroke="#b23a2a" stroke-width="1.5"/>
  <text x="62" y="191" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400" fill="#33475b">鸟</text>
  <text x="158" y="191" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="700" fill="#b23a2a">2</text>
  <text x="50" y="242" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#b23a2a">模型误以为 2 &gt; 1 &gt; 0</text>
  <text x="330" y="78" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="700" fill="#0e7c66">One-Hot（无顺序）</text>
  <text x="346" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">is猫</text>
  <text x="398" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">is狗</text>
  <text x="450" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">is鸟</text>
  <rect x="330" y="126" width="58" height="27" rx="6" fill="#eef4fb" stroke="#9db4cc" stroke-width="1.5"/>
  <text x="340" y="145" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400" fill="#33475b">猫</text>
  <rect x="394" y="126" width="156" height="27" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="412" y="145" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">1</text>
  <text x="464" y="145" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">0</text>
  <text x="516" y="145" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">0</text>
  <rect x="330" y="162" width="58" height="27" rx="6" fill="#eef4fb" stroke="#9db4cc" stroke-width="1.5"/>
  <text x="340" y="181" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400" fill="#33475b">狗</text>
  <rect x="394" y="162" width="156" height="27" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="412" y="181" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">0</text>
  <text x="464" y="181" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">1</text>
  <text x="516" y="181" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">0</text>
  <rect x="330" y="198" width="58" height="27" rx="6" fill="#eef4fb" stroke="#9db4cc" stroke-width="1.5"/>
  <text x="340" y="217" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400" fill="#33475b">鸟</text>
  <rect x="394" y="198" width="156" height="27" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="412" y="217" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">0</text>
  <text x="464" y="217" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">0</text>
  <text x="516" y="217" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">1</text>
  <text x="330" y="252" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#0e7c66">每类一个 0/1 列，无大小关系</text>
</svg>
