<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="检查点续训">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">checkpoint：崩溃后从不从头来</text>
  <line x1="70" y1="120" x2="610" y2="120" stroke="#9db4cc" stroke-width="2.5"/>
  <line x1="80" y1="114" x2="80" y2="126" stroke="#9db4cc" stroke-width="2"/>
  <text x="80" y="146" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#33475b">0</text>
  <line x1="210" y1="114" x2="210" y2="126" stroke="#9db4cc" stroke-width="2"/>
  <text x="210" y="146" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#33475b">ckpt₁</text>
  <line x1="340" y1="114" x2="340" y2="126" stroke="#9db4cc" stroke-width="2"/>
  <text x="340" y="146" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#33475b">ckpt₂</text>
  <line x1="470" y1="114" x2="470" y2="126" stroke="#9db4cc" stroke-width="2"/>
  <text x="470" y="146" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#33475b">崩溃</text>
  <line x1="610" y1="114" x2="610" y2="126" stroke="#9db4cc" stroke-width="2"/>
  <text x="610" y="146" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#33475b">恢复</text>
  <circle cx="210" cy="120" r="7" fill="#0e7c66" stroke="#0e7c66" stroke-width="2"/>
  <circle cx="340" cy="120" r="7" fill="#0e7c66" stroke="#0e7c66" stroke-width="2"/>
  <circle cx="470" cy="120" r="8" fill="#b23a2a" stroke="#b23a2a" stroke-width="2"/>
  <text x="470" y="104" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b23a2a">断电</text>
  <line x1="474" y1="120" x2="596.0" y2="120.0" stroke="#0f4c81" stroke-width="2.5"/>
  <path d="M596.0 120.0 L596.0 125.0 L596.0 115.0 Z" fill="#0f4c81"/>
  <text x="540" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f4c81">从 ckpt 续训</text>
  <rect x="70" y="170" width="500" height="92" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="320" y="194" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">checkpoint 里存什么</text>
  <text x="170" y="222" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">参数 + 优化器状态(m/v)</text>
  <text x="390" y="222" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">步数 + 随机种子</text>
  <text x="320" y="246" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#5e6b7a">所以存盘常是参数的好几倍，要分片</text>
  <rect x="70" y="282" width="500" height="60" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="320" y="308" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">代价：可能回退几步 + 偶尔引入训练分布的微妙偏移</text>
  <text x="320" y="330" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">“何时存、多频繁”本身就要设计</text>
  <text x="340.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">几个月不重启的训练，靠 checkpoint 续命</text>
</svg>
