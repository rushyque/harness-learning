<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="三层记忆框架">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">工作记忆 / 会话记忆 / 长期记忆</text>
  <rect x="75" y="100" width="140" height="150" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="145" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">工作记忆</text>
  <text x="145" y="168" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">当前轮活跃窗口内容</text>
  <text x="145" y="206" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#5e6b7a">存活期：当前轮</text>
  <rect x="230" y="100" width="140" height="150" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="300" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">会话记忆</text>
  <text x="300" y="168" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">最近几轮对话与结果</text>
  <text x="300" y="206" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#5e6b7a">存活期：本次会话</text>
  <rect x="385" y="100" width="140" height="150" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="455" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">长期记忆</text>
  <text x="455" y="168" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">画像、知识、历史偏好</text>
  <text x="455" y="206" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#5e6b7a">存活期：跨会话</text>
  <rect x="80" y="275" width="520" height="54" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="340" y="301" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#5b3aa6">模型本身没有持久记忆，所有“记得”都是重新放回上下文</text>
  <text x="340" y="323" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">越往右，越靠外部存储、检索与工程化</text>
  <text x="340.0" y="362" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">长期记忆：结构化档案 / 向量库 / 摘要档案</text>
</svg>
