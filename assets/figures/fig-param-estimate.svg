<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="参数量估算：d_model 的平方效应">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">参数 ≈ 12 × n_layers × d_model²</text>
  <rect x="90" y="80" width="500" height="50" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="2"/>
  <text x="340" y="112" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#5b3aa6">参数 ≈ 12 × n_layers × d_model²（粗略合计）</text>
  <rect x="70" y="160" width="180" height="120" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="160" y="192" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0f4c81">d_model=1024</text>
  <text x="160" y="224" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">基础</text>
  <text x="160" y="252" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">变化幅度</text>
  <rect x="270" y="160" width="180" height="120" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="2"/>
  <text x="360" y="192" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b23a2a">d_model→2048</text>
  <text x="360" y="224" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">参数量 ×4（平方）</text>
  <text x="360" y="252" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">变化幅度</text>
  <rect x="470" y="160" width="180" height="120" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="560" y="192" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">再加一层</text>
  <text x="560" y="224" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">参数量 只×N</text>
  <text x="560" y="252" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">变化幅度</text>
  <rect x="90" y="300" width="500" height="60" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="340" y="326" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">翻 d_model 比翻层数更吃参数量（因为平方）</text>
  <text x="340" y="348" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">理解“模型为什么这么大、内存怎么估算”的抓手</text>
</svg>
