  <line x1="252" y1="137" x2="266.0" y2="137.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M266.0 137.0 L266.0 142.0 L266.0 132.0 Z" fill="#b26a00"/>
  <line x1="362" y1="137" x2="376.0" y2="137.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M376.0 137.0 L376.0 142.0 L376.0 132.0 Z" fill="#b26a00"/>
  <line x1="472" y1="137" x2="486.0" y2="137.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M486.0 137.0 L486.0 142.0 L486.0 132.0 Z" fill="#b26a00"/>
  <rect x="60" y="200" width="560" height="52" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.8"/>
