  <text x="485" y="328" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#33475b">快照/重放重建并发状态</text>
  <rect x="60" y="356" width="560" height="36" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="340" y="379" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#5b3aa6">审计特性：append-only · 可验证 · 可导出 · 保留策略</text>
