  <text x="541" y="162" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#33475b">评估确认</text>
  <line x1="142" y1="137" x2="156.0" y2="137.0" stroke="#b26a00" stroke-width="2"/>
