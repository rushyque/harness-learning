  <text x="340" y="246" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">模型决策 / 工具护栏 / 权限配置 / 提示被注入</text>
  <rect x="60" y="278" width="250" height="66" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.8"/>
