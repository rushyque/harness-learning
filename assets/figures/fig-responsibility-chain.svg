  <text x="211" y="162" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#33475b">找异常起点</text>
  <rect x="280" y="96" width="82" height="82" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
