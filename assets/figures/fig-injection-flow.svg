<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="提示注入：数据里的指令如何变成动作">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">模型把指令与数据都当 token，注入一旦变成动作就危险</text>
  <rect x="60" y="100" width="250" height="110" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="185" y="128" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b26a00">外部内容（网页/文档）</text>
  <text x="185" y="152" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">藏恶意指令</text>
  <text x="185" y="176" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#5e6b7a">直接注入：用户直接说</text>
  <line x1="314" y1="130" x2="352.0" y2="130.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M352.0 130.0 L352.0 135.0 L352.0 125.0 Z" fill="#b26a00"/>
  <text x="338" y="120" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#5e6b7a">读入</text>
  <rect x="366" y="96" width="250" height="116" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="491" y="124" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0f4c81">模型把其当指令</text>
  <text x="491" y="150" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#33475b">无法区分系统指令与夹带指令</text>
  <text x="491" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#b23a2a">“想”做越权动作</text>
  <line x1="491" y1="216" x2="491.0" y2="252.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M491.0 252.0 L486.0 252.0 L496.0 252.0 Z" fill="#b26a00"/>
  <text x="530" y="242" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#5e6b7a">tool_call</text>
  <rect x="366" y="266" width="250" height="70" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="2"/>
  <text x="491" y="296" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b23a2a">工具执行危险动作</text>
  <text x="491" y="320" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">删除 / 外传 / 越权</text>
  <rect x="60" y="354" width="560" height="38" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="340" y="378" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">核心思路：让“被注入”≠“能破坏”——权限/沙箱/工具护栏兜底</text>
</svg>
