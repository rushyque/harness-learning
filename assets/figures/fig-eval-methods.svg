<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="三种评估方法">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">可判定 / LLM 裁判 / 轨迹回放</text>
  <rect x="70" y="100" width="170" height="170" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="155" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">可判定任务</text>
  <text x="155" y="160" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">结果自动判断</text>
  <text x="155" y="200" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0e7c66">✓ 客观可重复自动</text>
  <text x="155" y="224" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#b23a2a">✗ 只覆盖可判结果</text>
  <rect x="255" y="100" width="170" height="170" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="340" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">LLM/人工评测</text>
  <text x="340" y="160" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">开放任务评分</text>
  <text x="340" y="200" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0e7c66">✓ 覆盖开放任务</text>
  <text x="340" y="224" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#b23a2a">✗ 有偏且贵</text>
  <rect x="440" y="100" width="170" height="170" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="525" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">轨迹回放复盘</text>
  <text x="525" y="160" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">定位失败原因</text>
  <text x="525" y="200" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0e7c66">✓ 可定位源头</text>
  <text x="525" y="224" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#b23a2a">✗ 需完整日志</text>
  <rect x="90" y="295" width="500" height="56" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="340" y="321" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#5b3aa6">复现性是最大坑：固定 seed/环境/工具返回</text>
  <text x="340" y="343" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">多次运行取统计，重放稳定才可持续迭代</text>
  <text x="340.0" y="366" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">循环：定任务→跑→评估→定位→改进→再跑</text>
</svg>
