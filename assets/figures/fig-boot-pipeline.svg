<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="dsh 从命令行到干活的启动链">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">一条链：参数 → 配置 → 运行时 → 能力 → 循环</text>
  <rect x="60" y="90" width="92" height="92" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="106" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f4c81">1 命令行</text>
  <text x="106" y="156" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#33475b">解析 --profile / 任务</text>
  <rect x="170" y="90" width="92" height="92" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="216" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">2 读配置</text>
  <text x="216" y="156" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#33475b">profile / bundle</text>
  <rect x="280" y="90" width="92" height="92" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="326" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b26a00">3 实例化</text>
  <text x="326" y="156" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#33475b">创建 Cordis ctx</text>
  <rect x="390" y="90" width="92" height="92" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="436" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">4 注册插件</text>
  <text x="436" y="156" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#33475b">effect 注册能力</text>
  <rect x="500" y="90" width="92" height="92" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="2"/>
  <text x="546" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#5b3aa6">5 进入循环</text>
  <text x="546" y="156" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#33475b">任务交给 turn/step</text>
  <line x1="152" y1="136" x2="156.0" y2="136.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M156.0 136.0 L156.0 141.0 L156.0 131.0 Z" fill="#b26a00"/>
  <line x1="262" y1="136" x2="266.0" y2="136.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M266.0 136.0 L266.0 141.0 L266.0 131.0 Z" fill="#b26a00"/>
  <line x1="372" y1="136" x2="376.0" y2="136.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M376.0 136.0 L376.0 141.0 L376.0 131.0 Z" fill="#b26a00"/>
  <line x1="482" y1="136" x2="488.0" y2="136.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M488.0 136.0 L488.0 141.0 L488.0 131.0 Z" fill="#b26a00"/>
  <rect x="60" y="210" width="560" height="52" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.8"/>
  <text x="340" y="236" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0f4c81">三个“启动到位”信号：ctx 建立 / 能力注册 / 循环就绪</text>
  <text x="340" y="256" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">读日志按这三级定位启动到哪一步</text>
  <rect x="60" y="286" width="260" height="60" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.8"/>
  <text x="190" y="312" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">profile = 选哪组插件</text>
  <text x="190" y="334" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">bundle = 可分发的补丁层</text>
  <rect x="350" y="286" width="270" height="60" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.8"/>
  <text x="485" y="312" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b26a00">Cordis: 插件靠 side-effect</text>
  <text x="485" y="334" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">ctx.effect / ctx.on 注册能力</text>
</svg>
