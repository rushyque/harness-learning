<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="one-hot 稀疏无语义 vs 稠密向量有语义">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">两种表示：给词编号 vs 把语义写进几何</text>
  <rect x="55" y="70" width="280" height="260" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="2"/>
  <text x="195" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#b23a2a">one-hot（糟糕）</text>
  <text x="90" y="140" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">cat → [1,0,0,0,0,…]</text>
  <text x="90" y="168" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">dog → [0,1,0,0,0,…]</text>
  <text x="90" y="196" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">apple→ [0,0,1,0,0,…]</text>
  <text x="195" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b23a2a">正交 → 距离看不出相似</text>
  <text x="195" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b23a2a">维度 = 词表大小（上万）</text>
  <text x="195" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b23a2a">cat 与 dog 毫无关系</text>
  <rect x="345" y="70" width="280" height="260" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="485" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0e7c66">稠密词向量（好）</text>
  <path d="M 390.0,284.0 L 530.0,284.0" fill="none" stroke="#9db4cc" stroke-width="2"/>
  <path d="M 390.0,284.0 L 390.0,165.0" fill="none" stroke="#9db4cc" stroke-width="2"/>
  <text x="528" y="300" text-anchor="end" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">语义轴1</text>
  <text x="382" y="172" text-anchor="end" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">语义轴2</text>
  <circle cx="430" cy="252" r="4" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="438" y="256" text-anchor="start" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f4c81">cat</text>
  <circle cx="462" cy="266" r="4" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="470" y="270" text-anchor="start" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f4c81">dog</text>
  <circle cx="482" cy="232" r="4" fill="#dce8f5" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="490" y="236" text-anchor="start" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">apple</text>
  <circle cx="512" cy="218" r="4" fill="#dce8f5" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="520" y="222" text-anchor="start" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">banana</text>
  <circle cx="468" cy="202" r="4" fill="#dce8f5" stroke="#b26a00" stroke-width="1.5"/>
  <text x="476" y="206" text-anchor="start" font-family="sans-serif" font-size="11" font-weight="700" fill="#b26a00">king</text>
  <circle cx="505" cy="196" r="4" fill="#dce8f5" stroke="#b26a00" stroke-width="1.5"/>
  <text x="513" y="200" text-anchor="start" font-family="sans-serif" font-size="11" font-weight="700" fill="#b26a00">queen</text>
  <text x="485" y="316" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">相似词靠近、维度低且稠密</text>
  <text x="340.0" y="360" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">one-hot 只是编号，稠密向量让“语义距离”可计算</text>
</svg>
