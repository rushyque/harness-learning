<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img" aria-label="混淆矩阵：真实与预测的四种组合">
  <rect x="0" y="0" width="680" height="360" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="32" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1c2733">混淆矩阵：TP / TN / FP / FN</text>
  <text x="195.0" y="52" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#33475b">预测为正</text>
  <text x="461.0" y="52" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#33475b">预测为负</text>
  <text x="54" y="115.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="700" fill="#33475b">真实为正</text>
  <text x="54" y="235.0" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="700" fill="#33475b">真实为负</text>
  <rect x="70" y="62" width="250" height="106" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="195.0" y="111.0" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#0e7c66">TP</text>
  <text x="195.0" y="135.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#33475b">真对</text>
  <rect x="336" y="62" width="250" height="106" rx="6" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="461.0" y="111.0" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#b26a00">FN</text>
  <text x="461.0" y="135.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#33475b">漏报</text>
  <rect x="70" y="182" width="250" height="106" rx="6" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="195.0" y="231.0" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#b26a00">FP</text>
  <text x="195.0" y="255.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#33475b">误报</text>
  <rect x="336" y="182" width="250" height="106" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="461.0" y="231.0" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#0e7c66">TN</text>
  <text x="461.0" y="255.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#33475b">真对</text>
  <text x="340.0" y="318" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#33475b">精确率 = TP / (TP + FP)  预测为“是”的多可信</text>
  <text x="340.0" y="344" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#33475b">召回率 = TP / (TP + FN)  真实为“是”找回了多少</text>
</svg>
