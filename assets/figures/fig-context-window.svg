<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="上下文窗口：一次推理能看到的 token 上限，独立推理后清空">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">上下文窗口：一次能看到多少，跨请求不记忆</text>
  <rect x="60" y="90" width="560" height="70" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="150" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">系统说明</text>
  <line x1="200" y1="100" x2="200" y2="150" stroke="#0f4c81" stroke-width="1.2"/>
  <text x="280" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">对话历史</text>
  <line x1="310" y1="100" x2="310" y2="150" stroke="#0f4c81" stroke-width="1.2"/>
  <text x="400" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">当前问题</text>
  <line x1="445" y1="100" x2="445" y2="150" stroke="#0f4c81" stroke-width="1.2"/>
  <text x="510" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">输出</text>
  <text x="340" y="88" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#33475b">窗口内（本次推理）</text>
  <text x="340" y="196" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">输入 + 输出 ≤ 窗口上限（如 8k）</text>
  <rect x="60" y="238" width="270" height="90" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="195" y="266" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#b26a00">模型“知道”</text>
  <text x="195" y="290" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">预训练写进权重的世界知识</text>
  <text x="195" y="310" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">长期记忆，可能过时</text>
  <rect x="350" y="238" width="270" height="90" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="485" y="266" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0e7c66">这次“看到”</text>
  <text x="485" y="290" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">本次窗口内的临时材料</text>
  <text x="485" y="310" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">用完即清，需重新塞入</text>
  <text x="340.0" y="372" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">窗口有限且深处的信息可能被“淹没”→ Agent 要主动管理上下文</text>
</svg>
