<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img" aria-label="常见概率分布形状：正态、均匀、偏斜">
  <defs>
    <marker id="dist-axis" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9db4cc"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="320" rx="8" fill="#fafbfc"/>

  <text x="40" y="30" font-family="sans-serif" font-size="18" font-weight="700" fill="#1c2733">概率密度函数 PDF</text>

  <line x1="60" y1="270" x2="640" y2="270" stroke="#9db4cc" stroke-width="2" marker-end="url(#dist-axis)"/>
  <line x1="60" y1="60" x2="60" y2="270" stroke="#9db4cc" stroke-width="2"/>

  <path d="M 120 270
           C 150 70, 210 52, 300 54
           C 390 52, 450 70, 480 270
           Z" fill="#0f4c81" opacity="0.35" stroke="#0f4c81" stroke-width="2.5"/>
  <text x="235" y="150" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f4c81">正态</text>

  <rect x="200" y="170" width="200" height="100" fill="#0e7c66" opacity="0.35" stroke="#0e7c66" stroke-width="2.5"/>
  <text x="312" y="212" font-family="sans-serif" font-size="14" font-weight="700" fill="#0e7c66">均匀</text>

  <path d="M 560 270
           C 540 180, 520 120, 520 110
           C 500 90, 480 220, 470 270
           Z" fill="#b96b2a" opacity="0.4" stroke="#b96b2a" stroke-width="2.5"/>
  <text x="502" y="176" font-family="sans-serif" font-size="14" font-weight="700" fill="#b96b2a">偏斜</text>

  <text x="60" y="306" font-family="sans-serif" font-size="13" fill="#5e6b7a">曲线下的总面积 = 1，任何区间 [a,b] 的概率 = 该区间下方曲线与 x 轴围成的面积</text>
</svg>