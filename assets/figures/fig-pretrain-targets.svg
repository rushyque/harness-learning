<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-label="两种自监督目标：BERT 掩码双向预测，GPT 自回归单向预测下一个词">
  <rect x="0" y="0" width="680" height="420" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">自监督两种目标：BERT 双向遮词 vs GPT 单向续写</text>
  <rect x="40" y="70" width="290" height="320" rx="8" fill="#ffffff" stroke="#9db4cc" stroke-width="1.5"/>
  <text x="185" y="96" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#33475b">MLM（BERT）双向</text>
  <rect x="58" y="116" width="44" height="34" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="80" y="137" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">The</text>
  <rect x="118" y="116" width="44" height="34" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="140" y="137" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">quick</text>
  <rect x="178" y="116" width="44" height="34" rx="6" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.5"/>
  <text x="200" y="137" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b23a2a">[MASK]</text>
  <rect x="238" y="116" width="44" height="34" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="260" y="137" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">fox</text>
  <text x="185" y="196" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b23a2a">预测被遮住的 brown</text>
  <line x1="140" y1="120" x2="170.3" y2="127.6" stroke="#0e7c66" stroke-width="2"/>
  <path d="M170.3 127.6 L169.1 132.4 L171.5 122.7 Z" fill="#0e7c66"/>
  <line x1="220" y1="120" x2="194.6" y2="127.3" stroke="#0e7c66" stroke-width="2"/>
  <path d="M194.6 127.3 L193.2 122.4 L196.0 132.1 Z" fill="#0e7c66"/>
  <text x="185" y="250" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">✓ 左右上下文都能用</text>
  <text x="185" y="276" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">✓ 理解类任务强</text>
  <text x="185" y="306" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b23a2a">✗ 生成不顺（非自回归）</text>
  <rect x="350" y="70" width="290" height="320" rx="8" fill="#ffffff" stroke="#9db4cc" stroke-width="1.5"/>
  <text x="495" y="96" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#33475b">自回归（GPT）单向</text>
  <rect x="368" y="116" width="44" height="34" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="390" y="137" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">The</text>
  <rect x="428" y="116" width="44" height="34" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="450" y="137" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">quick</text>
  <rect x="488" y="116" width="44" height="34" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="510" y="137" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">brown</text>
  <rect x="548" y="116" width="44" height="34" rx="6" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="570" y="137" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#b26a00">?</text>
  <line x1="412" y1="133" x2="436.0" y2="133.0" stroke="#0e7c66" stroke-width="2"/>
  <path d="M436.0 133.0 L436.0 138.0 L436.0 128.0 Z" fill="#0e7c66"/>
  <line x1="472" y1="133" x2="496.0" y2="133.0" stroke="#0e7c66" stroke-width="2"/>
  <path d="M496.0 133.0 L496.0 138.0 L496.0 128.0 Z" fill="#0e7c66"/>
  <line x1="532" y1="133" x2="556.0" y2="133.0" stroke="#0e7c66" stroke-width="2"/>
  <path d="M556.0 133.0 L556.0 138.0 L556.0 128.0 Z" fill="#0e7c66"/>
  <text x="495" y="196" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">预测下一个词 jumps</text>
  <text x="495" y="250" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">✓ 天生生成式，可续写</text>
  <text x="495" y="276" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">✓ 生成能力 = 通用能力</text>
  <text x="495" y="306" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b23a2a">✗ 只用左侧上下文</text>
  <text x="345" y="372" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b23a2a">GPT 路线最终统一了所有任务 → 通用大模型（06 章）</text>
  <text x="340.0" y="402" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">MLM 理解型适合分类抽取；自回归生成型适合续写、翻译、问答</text>
</svg>
