<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="RLHF 与 DPO 对比">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">RLHF：两步；DPO：一步到位</text>
  <rect x="55" y="90" width="270" height="220" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="190" y="118" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f4c81">RLHF</text>
  <text x="190" y="150" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">偏好数据 → 奖励模型</text>
  <text x="190" y="174" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">再用 PPO 强化学习</text>
  <text x="190" y="198" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b23a2a">维护策略/参考/奖励多模型</text>
  <text x="190" y="222" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b23a2a">稳定难、超参多</text>
  <text x="190" y="258" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">效果好但工程重</text>
  <rect x="355" y="90" width="270" height="220" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="490" y="118" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0e7c66">DPO</text>
  <text x="490" y="150" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">偏好数据 → 策略模型</text>
  <text x="490" y="174" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0e7c66">数学上两步合并成一步</text>
  <text x="490" y="198" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">省掉奖励模型 + PPO</text>
  <text x="490" y="222" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">损失直接定义在策略概率上</text>
  <text x="490" y="258" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">简单稳定、趋势主流</text>
  <rect x="55" y="330" width="570" height="50" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="340" y="354" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b26a00">DPO 省了基础设施，但没省数据质量</text>
  <text x="340" y="374" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">仍需高质量“好/坏”偏好对，在线改进不如 PPO 自然</text>
</svg>
