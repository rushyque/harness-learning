<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="子代理委派与上下文隔离">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">主 agent 委派，子 agent 独立闭环</text>
  <rect x="60" y="100" width="230" height="120" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="2"/>
  <text x="175" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#5b3aa6">主 agent</text>
  <text x="175" y="158" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">保留自己的上下文</text>
  <text x="175" y="182" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">决定哪些要委派</text>
  <line x1="294" y1="140" x2="336.0" y2="140.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M336.0 140.0 L336.0 145.0 L336.0 135.0 Z" fill="#b26a00"/>
  <text x="320" y="128" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b26a00">委派</text>
  <rect x="350" y="72" width="270" height="80" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="485" y="100" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">子 agent</text>
  <text x="485" y="126" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">独立上下文 / 工具 / 循环</text>
  <rect x="350" y="172" width="270" height="80" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="485" y="200" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0f4c81">独立执行</text>
  <text x="485" y="226" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">不清空主 agent 窗口</text>
  <line x1="485" y1="256" x2="280.0" y2="250.3" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M280.0 250.3 L280.1 245.3 L279.9 255.3 Z" fill="#b26a00"/>
  <text x="400" y="268" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b26a00">交回结果</text>
  <rect x="60" y="300" width="560" height="54" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.8"/>
  <text x="340" y="326" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b23a2a">注意：错误传播 / 上下文串联 / 相互死循环</text>
  <text x="340" y="348" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">拆分收益大于协调成本才拆，否则优先单一 agent</text>
</svg>
