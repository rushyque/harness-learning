<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img" aria-label="贝叶斯公式与医生之问的先验到后验更新">
  <rect x="0" y="0" width="680" height="340" rx="8" fill="#fafbfc"/>

  <!-- 先验：总体样本空间 -->
  <rect x="40" y="80" width="260" height="180" rx="4" fill="#eef4fb" stroke="#c9dcee"/>
  <text x="56" y="110" font-family="sans-serif" font-size="14" fill="#1c2733">先验 P(患病) = 0.01</text>
  <rect x="70" y="130" width="70" height="90" rx="3" fill="#0f4c81" opacity="0.55"/>
  <rect x="175" y="130" width="110" height="90" rx="3" fill="#dfe6ec"/>
  <text x="60" y="246" font-family="sans-serif" font-size="12" fill="#5e6b7a">100 人里约 1 人患病</text>

  <!-- 后验 -->
  <rect x="380" y="80" width="260" height="180" rx="4" fill="#e7f5ef" stroke="#bcdccf"/>
  <text x="396" y="110" font-family="sans-serif" font-size="14" fill="#1c2733">后验：检测阳性后 P(患病|+) ≈ 0.33</text>
  <rect x="420" y="130" width="100" height="90" rx="3" fill="#0e7c66" opacity="0.6"/>
  <rect x="530" y="130" width="90" height="90" rx="3" fill="#dfe6ec"/>
  <text x="392" y="246" font-family="sans-serif" font-size="12" fill="#5e6b7a">真阳 ≈ 33%，假阳 ≈ 67%——直觉的 99% 被基础患病率大幅打折</text>

  <!-- 公式 -->
  <rect x="120" y="272" width="440" height="50" rx="8" fill="#ffffff" stroke="#e3e8ee"/>
  <text x="150" y="304" font-family="sans-serif" font-size="17" fill="#1c2733">P(病|+) = P(+|病)·P(病) / P(+)</text>

  <text x="40" y="40" font-family="sans-serif" font-size="18" font-weight="700" fill="#1c2733">先验 →（观察的证据）→ 后验</text>
  <text x="350" y="158" font-family="sans-serif" font-size="26" fill="#0e7c66">→</text>
</svg>
