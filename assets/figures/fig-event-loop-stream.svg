<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="事件驱动的 turn/step 流">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1c2733">每一步都发出事件，外部可监听、可拦截</text>
  <rect x="48" y="90" width="80" height="44" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="2"/>
  <text x="88" y="116" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#5b3aa6">turn 开始</text>
  <rect x="136" y="90" width="80" height="70" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.8"/>
  <text x="176" y="118" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0f4c81">step:start</text>
  <text x="176" y="140" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#33475b">模型请求</text>
  <rect x="224" y="90" width="80" height="70" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.8"/>
  <text x="264" y="118" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0e7c66">model:done</text>
  <text x="264" y="140" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#33475b">回复 / call</text>
  <rect x="312" y="90" width="80" height="70" rx="6" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.8"/>
  <text x="352" y="118" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#b26a00">tool:start</text>
  <text x="352" y="140" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#33475b">执行工具</text>
  <rect x="400" y="90" width="80" height="70" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.8"/>
  <text x="440" y="118" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0e7c66">tool:done</text>
  <text x="440" y="140" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#33475b">真实结果</text>
  <rect x="488" y="90" width="80" height="70" rx="6" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.8"/>
  <text x="528" y="118" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#5b3aa6">step:done</text>
  <text x="528" y="140" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#33475b">推进下一 step</text>
  <rect x="576" y="90" width="80" height="44" rx="6" fill="#f6dddc" stroke="#b23a2a" stroke-width="2"/>
  <text x="616" y="116" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#b23a2a">turn 结束</text>
  <line x1="128" y1="112" x2="134.0" y2="112.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M134.0 112.0 L134.0 117.0 L134.0 107.0 Z" fill="#b26a00"/>
  <line x1="216" y1="112" x2="222.0" y2="112.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M222.0 112.0 L222.0 117.0 L222.0 107.0 Z" fill="#b26a00"/>
  <line x1="304" y1="112" x2="310.0" y2="112.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M310.0 112.0 L310.0 117.0 L310.0 107.0 Z" fill="#b26a00"/>
  <line x1="392" y1="112" x2="398.0" y2="112.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M398.0 112.0 L398.0 117.0 L398.0 107.0 Z" fill="#b26a00"/>
  <line x1="480" y1="112" x2="486.0" y2="112.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M486.0 112.0 L486.0 117.0 L486.0 107.0 Z" fill="#b26a00"/>
  <line x1="568" y1="112" x2="574.0" y2="112.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M574.0 112.0 L574.0 117.0 L574.0 107.0 Z" fill="#b26a00"/>
  <rect x="55" y="190" width="120" height="90" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="115" y="216" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">on 监听</text>
  <text x="115" y="242" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">观察不阻断</text>
  <text x="115" y="264" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">日志/指标</text>
  <rect x="200" y="190" width="120" height="90" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="260" y="216" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">interaction</text>
  <text x="260" y="242" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">工具前请求批准</text>
  <text x="260" y="264" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">可暂停等决定</text>
  <rect x="345" y="190" width="290" height="90" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="490" y="216" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">可观测副产品</text>
  <text x="490" y="242" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">事件流 = 完整执行轨迹</text>
  <text x="490" y="264" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">可回放、可审计、可落日志</text>
  <line x1="55" y1="123" x2="55" y2="186" stroke="#9db4cc" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="260" y1="123" x2="260" y2="186" stroke="#9db4cc" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="490" y1="123" x2="490" y2="186" stroke="#9db4cc" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="55" y="306" width="570" height="52" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.8"/>
  <text x="340" y="331" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#5b3aa6">瀑布（waterfall）：处理器不 next() 就短路该链</text>
  <text x="340" y="352" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">可插桩、可暂停/恢复、易可视化——这就是事件驱动的价值</text>
</svg>
