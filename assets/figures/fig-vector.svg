<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-label="二维向量 v=(3,4)，长度 5">
  <defs>
    <marker id="v-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0f4c81"/></marker>
    <marker id="axis-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9db4cc"/></marker>
  </defs>
  <rect x="0" y="0" width="640" height="460" rx="8" fill="#fafbfc"/>

  <!-- 网格 -->
  <g stroke="#e6ebf0" stroke-width="1">
    <line x1="80" y1="80" x2="80" y2="380"/><line x1="150" y1="80" x2="150" y2="380"/>
    <line x1="220" y1="80" x2="220" y2="380"/><line x1="290" y1="80" x2="290" y2="380"/>
    <line x1="360" y1="80" x2="360" y2="380"/><line x1="430" y1="80" x2="430" y2="380"/>
    <line x1="500" y1="80" x2="500" y2="380"/><line x1="570" y1="80" x2="570" y2="380"/>
    <line x1="80" y1="390" x2="580" y2="390"/><line x1="80" y1="320" x2="580" y2="320"/>
    <line x1="80" y1="250" x2="580" y2="250"/><line x1="80" y1="180" x2="580" y2="180"/>
    <line x1="80" y1="110" x2="580" y2="110"/><line x1="80" y1="80" x2="580" y2="80"/>
  </g>

  <!-- 坐标轴 -->
  <line x1="80" y1="390" x2="580" y2="390" stroke="#9db4cc" stroke-width="2" marker-end="url(#axis-arrow)"/>
  <line x1="80" y1="390" x2="80" y2="80" stroke="#9db4cc" stroke-width="2" marker-end="url(#axis-arrow)"/>
  <text x="566" y="410" font-family="sans-serif" font-size="15" fill="#5e6b7a">x</text>
  <text x="64" y="100" font-family="sans-serif" font-size="15" fill="#5e6b7a">y</text>

  <!-- 分量导引线：1 格 = 1 单位，vx=3 跨 3 格，vy=4 跨 4 格 -->
  <line x1="80" y1="390" x2="290" y2="390" stroke="#bcdccf" stroke-width="3"/>
  <line x1="290" y1="390" x2="290" y2="110" stroke="#f3c7a8" stroke-width="3"/>
  <text x="140" y="378" font-family="sans-serif" font-size="14" fill="#0e7c66">vx = 3</text>
  <text x="298" y="255" font-family="sans-serif" font-size="14" fill="#b96b2a">vy = 4</text>

  <!-- 向量 -->
  <line x1="80" y1="390" x2="290" y2="110" stroke="#0f4c81" stroke-width="4" marker-end="url(#v-arrow)"/>
  <circle cx="290" cy="110" r="5" fill="#0f4c81"/>

  <!-- 长度标注：细引线 + 文字 -->
  <line x1="185" y1="250" x2="148" y2="148" stroke="#c9dcee" stroke-width="1.5"/>
  <text x="100" y="132" font-family="sans-serif" font-size="15" fill="#0f4c81">‖v‖ = √(3²+4²) = 5</text>

  <!-- 标题与说明 -->
  <text x="70" y="46" font-family="sans-serif" font-size="18" font-weight="700" fill="#1c2733">向量是一个带箭头的几何对象</text>
  <text x="70" y="446" font-family="sans-serif" font-size="13" fill="#5e6b7a">原点 O → 终点 (3,4)，箭头方向和长度同时携带信息</text>
</svg>