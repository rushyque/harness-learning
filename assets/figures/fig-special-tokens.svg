<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img" aria-label="特殊 token 在序列中的位置">
  <rect x="0" y="0" width="680" height="360" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">特殊 token：模型与任务的“约定符号”</text>
  <rect x="42" y="100" width="76" height="60" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="2"/>
  <text x="80" y="138" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b23a2a">&lt;BOS&gt;</text>
  <rect x="137" y="100" width="76" height="60" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="175" y="138" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0f4c81">大家好</text>
  <rect x="247" y="100" width="76" height="60" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="285" y="138" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b26a00">&lt;SEP&gt;</text>
  <rect x="347" y="100" width="76" height="60" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="385" y="138" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0f4c81">今天好吗？</text>
  <rect x="462" y="100" width="76" height="60" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="2"/>
  <text x="500" y="138" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b23a2a">&lt;EOS&gt;</text>
  <rect x="562" y="100" width="76" height="60" rx="8" fill="#eef1f5" stroke="#9db4cc" stroke-width="2"/>
  <text x="600" y="138" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#9db4cc">&lt;PAD&gt;</text>
  <text x="95" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">开始标记</text>
  <text x="230" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">正文 token</text>
  <text x="335" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">句子/段分隔</text>
  <text x="435" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">正文 token</text>
  <text x="550" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">结束标记</text>
  <text x="650" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#b26a00">填充到等长</text>
  <rect x="80" y="235" width="590" height="55" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="375" y="262" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">它们不表达语义，而是告诉模型“这一段是什么”</text>
  <text x="375" y="284" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">对话用 &lt;|im_start|&gt; / &lt;|im_end|&gt; 区分用户、助手、系统</text>
</svg>
