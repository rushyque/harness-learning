<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="采样策略：temperature / top-k / top-p">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">输出旋钮：控制“稳 vs 奇”</text>
  <rect x="55" y="80" width="270" height="130" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="190" y="108" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f4c81">温度 temperature</text>
  <text x="190" y="138" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">T&lt;1 分布更尖 → 更确定、重复</text>
  <text x="190" y="162" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">T&gt;1 分布更平 → 更随机、有创意</text>
  <text x="190" y="186" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#5e6b7a">调节 softmax 的尖锐度</text>
  <rect x="355" y="80" width="270" height="130" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="490" y="108" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0e7c66">top-k / top-p</text>
  <text x="490" y="138" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">top-k：只在概率最高 k 个里采样</text>
  <text x="490" y="162" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">top-p：只从累计概率到 p 的集合采样</text>
  <text x="490" y="186" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#5e6b7a">截断“尾巴”，兼顾多样与稳定</text>
  <rect x="55" y="230" width="570" height="70" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="340" y="256" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b26a00">贪心 = 永远取最大 → 稳定但易单调重复</text>
  <text x="340" y="280" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">采样 = 按分布随机 → 自然多样但可能不稳</text>
  <text x="340.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">“下一个 token 不是必选概率最大” —— 输出是采样，不是查表</text>
  <text x="340.0" y="370" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">这些是 07 章产品调性的核心参数</text>
</svg>
