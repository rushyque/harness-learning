<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="量化精度阶梯">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">量化：用更少 bit 换显存与速度</text>
  <rect x="70" y="105" width="120" height="54" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="130" y="133" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f4c81">FP16</text>
  <text x="130" y="151" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">16 bit</text>
  <text x="250" y="133" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">精度最高</text>
  <text x="250" y="152" text-anchor="start" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">显存满配</text>
  <rect x="70" y="183" width="120" height="54" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="130" y="211" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0e7c66">INT8</text>
  <text x="130" y="229" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">8 bit</text>
  <text x="250" y="211" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">精度稍降</text>
  <text x="250" y="230" text-anchor="start" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">显存减半</text>
  <rect x="70" y="261" width="120" height="54" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="130" y="289" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#b26a00">INT4</text>
  <text x="130" y="307" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">4 bit</text>
  <text x="250" y="289" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">更快更多省</text>
  <text x="250" y="308" text-anchor="start" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">显存约 1/4</text>
  <rect x="420" y="105" width="205" height="78" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="522" y="132" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#5b3aa6">PTQ：训完再量化，简单</text>
  <text x="522" y="156" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#5b3aa6">QAT：训练时就模拟量化</text>
  <text x="522" y="180" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">更准但更费</text>
  <rect x="55" y="300" width="570" height="60" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="340" y="326" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">“7B 塞进 8G 显卡”的关键手段</text>
  <text x="340" y="349" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">精度下降换“能不能本地跑、跑多快”</text>
</svg>
