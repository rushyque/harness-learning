<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img" aria-label="ROC 曲线：真阳率 vs 假阳率，AUC 为线下面积">
  <rect x="0" y="0" width="680" height="360" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="32" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1c2733">ROC 曲线：TPR vs FPR，AUC 是线下面积</text>
  <line x1="82" y1="264" x2="640" y2="264" stroke="#9db4cc" stroke-width="2"/>
  <line x1="82" y1="264" x2="82" y2="66" stroke="#9db4cc" stroke-width="2"/>
  <text x="622" y="282" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="400" fill="#5e6b7a">FPR（假阳率）→</text>
  <text x="74" y="72" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="400" fill="#5e6b7a">TPR</text>
  <line x1="82" y1="264" x2="640" y2="66" stroke="#9db4cc" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="632" y="84" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">随机猜：AUC = 0.5</text>
  <path d="M 82.0,264.0 L 96.0,185.3 L 109.9,170.4 L 123.8,160.4 L 137.8,152.7 L 151.8,146.3 L 165.7,140.8 L 179.6,135.9 L 193.6,131.6 L 207.6,127.6 L 221.5,124.0 L 235.5,120.6 L 249.4,117.5 L 263.4,114.5 L 277.3,111.7 L 291.2,109.1 L 305.2,106.5 L 319.1,104.1 L 333.1,101.8 L 347.1,99.6 L 361.0,97.5 L 374.9,95.5 L 388.9,93.5 L 402.8,91.6 L 416.8,89.7 L 430.8,88.0 L 444.7,86.2 L 458.7,84.5 L 472.6,82.9 L 486.6,81.3 L 500.5,79.7 L 514.5,78.2 L 528.4,76.7 L 542.3,75.3 L 556.3,73.9 L 570.2,72.5 L 584.2,71.1 L 598.1,69.8 L 612.1,68.5 L 626.0,67.2 L 640.0,66.0 L 640.0,264.0 L 82.0,264.0 Z" fill="#dce8f5" opacity="0.9"/>
  <path d="M 82.0,264.0 L 96.0,185.3 L 109.9,170.4 L 123.8,160.4 L 137.8,152.7 L 151.8,146.3 L 165.7,140.8 L 179.6,135.9 L 193.6,131.6 L 207.6,127.6 L 221.5,124.0 L 235.5,120.6 L 249.4,117.5 L 263.4,114.5 L 277.3,111.7 L 291.2,109.1 L 305.2,106.5 L 319.1,104.1 L 333.1,101.8 L 347.1,99.6 L 361.0,97.5 L 374.9,95.5 L 388.9,93.5 L 402.8,91.6 L 416.8,89.7 L 430.8,88.0 L 444.7,86.2 L 458.7,84.5 L 472.6,82.9 L 486.6,81.3 L 500.5,79.7 L 514.5,78.2 L 528.4,76.7 L 542.3,75.3 L 556.3,73.9 L 570.2,72.5 L 584.2,71.1 L 598.1,69.8 L 612.1,68.5 L 626.0,67.2 L 640.0,66.0" fill="none" stroke="#0f4c81" stroke-width="3"/>
  <circle cx="165.7" cy="140.8" r="5" fill="#b26a00" stroke="#1c2733" stroke-width="1.5"/>
  <text x="173.7" y="160.8" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b26a00">一个阈值：FPR 低、TPR 高</text>
  <line x1="165.7" y1="264" x2="165.7" y2="140.8" stroke="#b26a00" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="340.0" y="318" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#5e6b7a">纵轴 TPR（=召回率），横轴 FPR：虚线是随机，曲线越靠左上越好，AUC 越接近 1</text>
  <text x="340.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#33475b">AUC 与阈值无关，衡量的是模型把正样本排在负样本前面的能力</text>
</svg>
