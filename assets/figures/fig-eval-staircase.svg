<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="评估层级阶梯">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">评测层级：从粗筛到贴近真实</text>
  <rect x="100" y="300" width="480" height="42" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.8"/>
  <text x="116" y="326" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0f4c81">自动基准</text>
  <text x="380.0" y="326" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">MMLU / GSM8K</text>
  <text x="568" y="326" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">低 / 高</text>
  <rect x="115" y="248" width="450" height="42" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.8"/>
  <text x="131" y="274" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">自动指标</text>
  <text x="380.0" y="274" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">ROUGE / BLEU</text>
  <text x="553" y="274" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">低 / 高</text>
  <rect x="130" y="196" width="420" height="42" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.8"/>
  <text x="146" y="222" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b26a00">LLM-judge</text>
  <text x="380.0" y="222" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">AI 打分</text>
  <text x="538" y="222" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">中 / 中</text>
  <rect x="145" y="144" width="390" height="42" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.8"/>
  <text x="161" y="170" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b23a2a">人工评测</text>
  <text x="380.0" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">判员打分</text>
  <text x="523" y="170" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">高 / 低</text>
  <rect x="160" y="92" width="360" height="42" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.8"/>
  <text x="176" y="118" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">Agent 评测</text>
  <text x="380.0" y="118" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">成功率 / 轨迹</text>
  <text x="508" y="118" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">高 / 中</text>
  <text x="340.0" y="360" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">越高越贴近真实用户，也越贵越难复用</text>
  <rect x="160" y="66" width="360" height="46" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="340" y="94" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b26a00">评测是工程的地基，不能只看一个指标</text>
</svg>
