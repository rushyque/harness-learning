<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img" aria-label="特征向量：A 作用在特征向量上方向不变，仅按特征值伸缩">
  <defs>
    <marker id="ev-o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0f4c81"/></marker>
    <marker id="ev-t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b96b2a"/></marker>
    <marker id="ev-g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0e7c66"/></marker>
  </defs>
  <rect x="0" y="0" width="680" height="360" rx="8" fill="#fafbfc"/>

  <!-- 原点 -->
  <circle cx="150" cy="230" r="4.5" fill="#33475b"/>
  <text x="157" y="244" font-family="sans-serif" font-size="13" fill="#5e6b7a">O</text>

  <!-- 特征向量 v1（水平，λ=2 拉伸） -->
  <line x1="150" y1="230" x2="350" y2="230" stroke="#0f4c81" stroke-width="4" marker-end="url(#ev-o)"/>
  <text x="200" y="222" font-family="sans-serif" font-size="15" font-style="italic" fill="#0f4c81">v₁</text>
  <line x1="150" y1="230" x2="530" y2="230" stroke="#b96b2a" stroke-width="4" marker-end="url(#ev-t)" stroke-dasharray="6 4"/>
  <text x="460" y="250" font-family="sans-serif" font-size="13" fill="#b96b2a">A·v₁ = 2·v₁</text>

  <!-- 特征向量 v2（朝左上，λ=0.5 压缩，方向与 v1 共用原点） -->
  <line x1="150" y1="230" x2="80" y2="145" stroke="#0e7c66" stroke-width="4" marker-end="url(#ev-g)"/>
  <text x="84" y="161" font-family="sans-serif" font-size="15" font-style="italic" fill="#0e7c66">v₂</text>
  <line x1="150" y1="230" x2="115" y2="187.5" stroke="#b96b2a" stroke-width="3.5" marker-end="url(#ev-t)" stroke-dasharray="5 4"/>
  <text x="52" y="181.5" font-family="sans-serif" font-size="12.5" fill="#b96b2a">A·v₂ = 0.5·v₂</text>

  <!-- 主公式卡 -->
  <rect x="60" y="16" width="560" height="66" rx="8" fill="#eef4fb" stroke="#c9dcee"/>
  <text x="84" y="44" font-family="sans-serif" font-size="20" fill="#1c2733">A·v = λ·v</text>
  <text x="84" y="68" font-family="sans-serif" font-size="15" fill="#5e6b7a">变换后方向不变，只沿主轴伸缩 λ 倍——把复杂变换拆成互不干扰的主轴</text>

  <text x="60" y="344" font-family="sans-serif" font-size="13" fill="#5e6b7a">实线：原特征向量（作为基准） · 橙色虚线：A 作用后的伸缩结果（都从同一个原点出发）</text>
</svg>