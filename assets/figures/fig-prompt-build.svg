<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="好 prompt 的四个要件">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">上下文工程四件套</text>
  <rect x="55" y="90" width="160" height="105" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="135" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">系统提示</text>
  <text x="135" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">身份/边界/口吻</text>
  <rect x="255" y="90" width="160" height="105" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="335" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">Few-shot</text>
  <text x="335" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">给示例校准行为</text>
  <rect x="455" y="90" width="160" height="105" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="535" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">思维链</text>
  <text x="535" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">先一步步想再答</text>
  <rect x="60" y="220" width="160" height="105" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="2"/>
  <text x="140" y="258" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#5b3aa6">压缩/检索</text>
  <text x="140" y="286" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">窗口里只留要点</text>
  <rect x="255" y="220" width="360" height="105" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="435" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">核心：给模型完整指引</text>
  <text x="435" y="276" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">我是谁 + 怎么做 + 长什么样</text>
  <text x="435" y="300" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">缺任何一块，效果都可能崩</text>
  <rect x="55" y="320" width="570" height="60" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="340" y="346" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">同一个模型，配好/配坏 prompt 天差地别</text>
  <text x="340" y="368" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">这不是玄学，是“窗口里给什么”的工程</text>
</svg>
