<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent 知识图谱</title>
  <link rel="stylesheet" href="assets/docsify/docsify.min.css">
  <link rel="stylesheet" href="assets/katex/katex.min.css">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/study.css">
</head>
<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      name: 'Agent 知识图谱',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 0,
      maxLevel: 4,
      search: {
        placeholder: '搜索…',
        noData: '没有匹配结果',
        depth: 6,
        hideOtherSidebarContent: true
      },
      plugins: [
        function (hook, vm) {
          hook.afterEach(function (html) {
            // 让带 .tip/.warn/.danger/.quote 的块级元素更醒目，并给标题加锚点
            return html
              .replace(/<blockquote>/g, '<blockquote class="dsh-note">')
              .replace(/<h([1-4]) /g, function (m, n) {
                return '<h' + n + ' ';
              });
          });
        }
      ],
      formatUpdated: '{YYYY}/{MM}/{DD}',
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md'
      }
    };
  </script>

  <!-- 互动学习层需在 docsify 初始化前注册插件钩子 -->
  <script src="assets/lucide.min.js"></script>
  <script src="assets/study.js"></script>
  <script src="assets/mermaid.min.js"></script>
  <script src="assets/katex/katex.min.js"></script>
  <script src="assets/katex/auto-render.min.js"></script>
  <script src="assets/viz.js"></script>
  <script src="assets/docsify/docsify.min.js"></script>
  <script src="assets/docsify/search.min.js"></script>
  <script src="assets/docsify/zoom-image.min.js"></script>

  <script>
    // 极简 copy-code：给代码块加复制按钮
    document.addEventListener('DOMContentLoaded', function () {
      setInterval(function () {
        var blocks = document.querySelectorAll('pre code');
        blocks.forEach(function (code) {
          var pre = code.parentNode;
          if (pre.querySelector('.copy-btn')) return;
          var btn = document.createElement('button');
          btn.className = 'copy-btn';
          btn.textContent = '复制';
          btn.addEventListener('click', function () {
            var text = code.innerText;
            if (navigator.clipboard) {
              navigator.clipboard.writeText(text).then(function () {
                btn.textContent = '已复制';
                setTimeout(function () { btn.textContent = '复制'; }, 1200);
              });
            }
          });
          pre.style.position = 'relative';
          pre.appendChild(btn);
        });
      }, 200);
    });
  </script>
</body>
</html>
