<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="按 token 计费：输入+输出都计">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">API 为什么按 token 计费</text>
  <rect x="55" y="90" width="250" height="180" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="180" y="118" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f4c81">输入（prompt）</text>
  <rect x="80" y="140" width="200" height="34" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="180" y="162" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0f4c81">系统说明 + 历史 + 文档</text>
  <text x="180" y="200" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">上下文越长，前向计算越多</text>
  <text x="180" y="226" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b23a2a">长对话 = 贵</text>
  <rect x="375" y="90" width="250" height="180" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="500" y="118" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0e7c66">输出（生成）</text>
  <rect x="400" y="140" width="200" height="34" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="500" y="162" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0e7c66">模型生成的回答</text>
  <text x="500" y="200" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">生成越长，token 越多</text>
  <text x="500" y="226" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b23a2a">答案越长 = 贵</text>
  <text x="340" y="300" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">token = 模型真正“消费”的最小单位</text>
  <rect x="55" y="318" width="570" height="60" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="340" y="344" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">降本手段：精简 prompt / 缓存上下文 / 摘要压缩旧对话</text>
  <text x="340" y="366" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">做 Agent 时优化 token 是核心工程</text>
</svg>
