<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="Agent 循环出口与系统守卫">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">模型决定“完成”，系统兜底“别失控”</text>
  <rect x="250" y="80" width="180" height="92" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="2"/>
  <text x="340" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#5b3aa6">模型请求</text>
  <text x="340" y="144" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">调用工具 → 回填结果</text>
  <path d="M 430.0,126.0 L 500.0,126.0 L 500.0,60.0" fill="none" stroke="#b26a00" stroke-width="2"/>
  <path d="M 500.0,60.0 L 434.0,60.0 L 434.0,76.0" fill="none" stroke="#b26a00" stroke-width="2"/>
  <text x="520" y="66" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#5e6b7a">重复 step</text>
  <line x1="340" y1="172" x2="340.0" y2="190.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M340.0 190.0 L335.0 190.0 L345.0 190.0 Z" fill="#b26a00"/>
  <rect x="250" y="204" width="180" height="70" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="340" y="232" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">无 tool_call</text>
  <text x="340" y="258" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">正常完成 → turn 结束</text>
  <rect x="60" y="290" width="560" height="62" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.8"/>
  <text x="340" y="318" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">系统硬约束（与模型无关）</text>
  <text x="340" y="340" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">step 上限 · 超时 · 审批拒绝/中断 · 工具致命错误</text>
  <rect x="60" y="356" width="560" height="38" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.5"/>
  <text x="340" y="380" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b23a2a">读循环时数出口：哪些由模型决定，哪些由系统强制</text>
</svg>
