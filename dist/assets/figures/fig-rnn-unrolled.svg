  <text x="300" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">前一步的 h 与当前 x 一起，更新出这一步的记忆</text>
  <text x="300" y="346" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">同一套 W_h、W_x、b 在每一步被共享 → 可处理任意长度</text>
  <line x1="30" y1="372" x2="650" y2="372" stroke="#9db4cc" stroke-width="1.5"/>
  <text x="340.0" y="366" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1c2733">▾ 往下：LSTM 用三个门控制细胞状态 c 的读写</text>
  <text x="250" y="400" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">遗忘门 f        输入门 i        输出门 o，都乘在 c 的通路上</text></svg>
