  <text x="90" y="202" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0f4c81">tanh</text>
  <rect x="230" y="170" width="60" height="56" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
