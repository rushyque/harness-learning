<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="源码 plane 与产物 plane：改了源码却跑旧产物">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">同一份代码，两个 world：src 与 lib</text>
  <rect x="80" y="110" width="240" height="150" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="200" y="138" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f4c81">源码 plane</text>
  <line x1="120" y1="152" x2="280" y2="152" stroke="#9db4cc" stroke-width="1.5"/>
  <text x="200" y="176" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">tsconfig paths</text>
  <text x="200" y="198" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">import 解析到 src/</text>
  <text x="200" y="222" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0f4c81">静态 gate / 测试走这条</text>
  <text x="200" y="246" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">干净树即可跑</text>
  <rect x="360" y="110" width="240" height="150" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="480" y="138" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0e7c66">产物 plane</text>
  <line x1="400" y1="152" x2="560" y2="152" stroke="#9db4cc" stroke-width="1.5"/>
  <text x="480" y="176" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">消费编译后的 lib/</text>
  <text x="480" y="198" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0e7c66">发行 / 子进程走这条</text>
  <text x="480" y="222" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">要 build 之后才有</text>
  <text x="480" y="246" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b23a2a">改了源码未必反映</text>
  <path d="M 80.0,285.0 L 80.0,320.0 L 620.0,320.0 L 620.0,118.0" fill="none" stroke="#b26a00" stroke-width="2.5"/>
  <text x="350" y="316" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b26a00">改了 src 却没 build，测试看到新代码、运行看到旧 lib</text>
  <rect x="90" y="340" width="500" height="44" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.8"/>
  <text x="340" y="366" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#5b3aa6">“改了不生效”先问：我跑的是 src 还是 lib？</text>
</svg>
