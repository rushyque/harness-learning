<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-label="NLP 任务全景：分类、序列标注、抽取、生成、问答、文本结构">
  <rect x="0" y="0" width="680" height="420" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">NLP 任务全景：每种任务回答什么问题、输出什么</text>
  <rect x="70" y="86" width="250" height="72" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.8"/>
  <text x="90" y="114" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f4c81">文本分类</text>
  <text x="90" y="138" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#33475b">输出：类别标签</text>
  <rect x="70" y="176" width="250" height="72" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.8"/>
  <text x="90" y="204" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="700" fill="#0e7c66">序列标注</text>
  <text x="90" y="228" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#33475b">输出：每 token 标签</text>
  <rect x="70" y="266" width="250" height="72" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.8"/>
  <text x="90" y="294" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="700" fill="#b26a00">文本抽取</text>
  <text x="90" y="318" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#33475b">输出：原文片段</text>
  <rect x="360" y="86" width="250" height="72" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.8"/>
  <text x="380" y="114" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="700" fill="#b23a2a">文本生成</text>
  <text x="380" y="138" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#33475b">输出：新文本</text>
  <rect x="360" y="176" width="250" height="72" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.8"/>
  <text x="380" y="204" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="700" fill="#5b3aa6">问答</text>
  <text x="380" y="228" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#33475b">输出：答案</text>
  <rect x="360" y="266" width="250" height="72" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.8"/>
  <text x="380" y="294" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="700" fill="#0e7c66">文本↔结构</text>
  <text x="380" y="318" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#33475b">输出：结构化/文本</text>
  <rect x="180" y="356" width="320" height="46" rx="8" fill="#ffffff" stroke="#b26a00" stroke-width="2"/>
  <text x="340" y="384" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">一个预训练模型 + 统一“生成”范式</text>
  <text x="340.0" y="414" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">理解型用任务头，生成型用 prompt，最终都落到 Agent 的工具调用</text>
</svg>
