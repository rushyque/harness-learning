<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" aria-label="点积的几何含义：a 在 b 上的投影，夹角 θ">
  <rect x="0" y="0" width="680" height="470" rx="8" fill="#fafbfc"/>
  <line x1="60" y1="405" x2="590" y2="238" stroke="#dfe6ec" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="560" y="246" font-family="sans-serif" font-size="13" fill="#5e6b7a">b 的方向</text>
  <line x1="360" y1="120" x2="415.9" y2="295.8" stroke="#f3c7a8" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="415.9" cy="295.8" r="4" fill="#b96b2a"/>
  <text x="425.9" y="289.8" font-family="sans-serif" font-size="12" fill="#b96b2a">投影足</text>
  <text x="368" y="112" font-family="sans-serif" font-size="15" font-style="italic" fill="#0f4c81">a</text>
  <circle cx="120" cy="390" r="4" fill="#33475b"/>
  <text x="126" y="406" font-family="sans-serif" font-size="13" fill="#5e6b7a">O</text>
  <defs>
    <marker id="dot-a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0f4c81"/></marker>
    <marker id="dot-b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0e7c66"/></marker>
  </defs>
  <line x1="120" y1="390" x2="360" y2="120" stroke="#0f4c81" stroke-width="4" marker-end="url(#dot-a)"/>
  <line x1="120" y1="390" x2="560" y2="250" stroke="#0e7c66" stroke-width="4" marker-end="url(#dot-b)"/>
  <text x="520" y="240" font-family="sans-serif" font-size="16" font-style="italic" fill="#0e7c66">b</text>
  <polyline points="177.2,371.8 176.8,370.6 176.4,369.5 175.9,368.3 175.5,367.2 175.0,366.0 174.5,364.9 174.0,363.8 173.4,362.7 172.8,361.6 172.2,360.5 171.6,359.4 171.0,358.4 170.3,357.3 169.6,356.3 168.9,355.3 168.2,354.3 167.5,353.3 166.7,352.3 165.9,351.4 165.1,350.4 164.3,349.5 163.4,348.6 162.6,347.7 161.7,346.8 160.8,346.0 159.9,345.2" fill="none" stroke="#b96b2a" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="192.1" y="343.2" font-family="sans-serif" font-size="15" font-style="italic" fill="#b96b2a">θ ≈ 31°</text>
  <rect x="70" y="24" width="540" height="86" rx="8" fill="#eef4fb" stroke="#c9dcee"/>
  <text x="92" y="56" font-family="sans-serif" font-size="20" fill="#1c2733">a · b = ‖a‖ ‖b‖ cos θ</text>
  <text x="92" y="82" font-family="sans-serif" font-size="14" fill="#5e6b7a">投影长度 = ‖a‖ cos θ，即 a 在 b 方向上的“贡献”</text>
  <text x="70" y="456" font-family="sans-serif" font-size="13" fill="#5e6b7a">夹角弧以原点为圆心、沿两条向量之间扫过 θ；a 在 b 上的投影是垂直的虚线</text>
</svg>