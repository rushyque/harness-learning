<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="RoPE 旋转位置编码">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">RoPE：用“旋转”把位置写进 Q/K 向量</text>
  <circle cx="175" cy="190" r="80" fill="none" stroke="#9db4cc" stroke-width="2"/>
  <line x1="175" y1="190" x2="175.0" y2="120.0" stroke="#b26a00" stroke-width="2"/>
  <text x="175.0" y="120.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">12</text>
  <line x1="175" y1="190" x2="105.0" y2="190.0" stroke="#b26a00" stroke-width="2"/>
  <text x="105.0" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">6</text>
  <line x1="175" y1="190" x2="125.50252531694167" y2="239.49747468305833" stroke="#b26a00" stroke-width="2"/>
  <text x="125.50252531694167" y="239.49747468305833" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">7</text>
  <line x1="175" y1="190" x2="175.0" y2="260.0" stroke="#b26a00" stroke-width="2"/>
  <text x="175.0" y="260.0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">9</text>
  <line x1="175" y1="190" x2="224.49747468305833" y2="239.49747468305833" stroke="#b26a00" stroke-width="2"/>
  <text x="224.49747468305833" y="239.49747468305833" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">10</text>
  <circle cx="175" cy="190" r="5" fill="#b26a00" stroke="#b26a00" stroke-width="2"/>
  <text x="175" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">钟表指针：位置 = 角度</text>
  <text x="175" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">位置越靠后，旋转角越大</text>
  <rect x="330" y="90" width="290" height="240" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="2"/>
  <text x="475" y="118" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#5b3aa6">RoPE 做什么</text>
  <text x="355" y="155" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">给 Q、K 向量</text>
  <text x="355" y="178" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">按位置旋转角度</text>
  <text x="355" y="205" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">点积 → 自带位置差</text>
  <line x1="355" y1="220" x2="595" y2="220" stroke="#9db4cc" stroke-width="1.5"/>
  <text x="475" y="245" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">相对位置依赖</text>
  <text x="475" y="268" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">长度外推更好</text>
  <text x="475" y="292" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">Llama / Qwen 等主流</text>
  <text x="475" y="314" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">YaRN / NTK 的基础</text>
  <text x="340.0" y="366" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">模型既能知道“在第几点”，也能通过角度差知道“相隔几何”</text>
</svg>
