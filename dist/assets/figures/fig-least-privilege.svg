<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="最小权限三件套与风险收敛">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">作用域收窄能碰什么，权限规定能做什么，审批兜住高风险</text>
  <rect x="70" y="80" width="170" height="86" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="155" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">作用域 scope</text>
  <text x="155" y="146" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">在哪个目录/资源里</text>
  <rect x="250" y="80" width="170" height="86" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="335" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">权限 permission</text>
  <text x="335" y="146" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">能做 / 不能做</text>
  <rect x="430" y="80" width="170" height="86" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="515" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">审批 approval</text>
  <text x="515" y="146" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">高风险要确认</text>
  <rect x="70" y="190" width="540" height="52" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.8"/>
  <text x="340" y="216" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">最小权限 = 三件套收窄到“恰好够用”</text>
  <text x="340" y="234" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">只读不给写 · 只在一目录不开整盘 · 不必需 shell 不开</text>
  <rect x="70" y="268" width="250" height="76" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="195" y="296" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">白名单（推荐）</text>
  <text x="195" y="320" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">默认拒绝，只允许列出项</text>
  <text x="195" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#5e6b7a">风险收敛到显式批准集</text>
  <rect x="350" y="268" width="260" height="76" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="2"/>
  <text x="480" y="296" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b23a2a">黑名单（不推荐）</text>
  <text x="480" y="320" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">默认允许，只禁危险项</text>
  <text x="480" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#b23a2a">漏一条就是敞口漏洞</text>
  <rect x="70" y="356" width="540" height="36" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="340" y="379" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f4c81">权限是 Agent 安全的第一道闸门：能碰什么是硬边界</text>
</svg>
