<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260" role="img" aria-label="SVD：A = U Σ Vᵀ 的分解结构">
  <defs>
    <marker id="svd-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0f4c81"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="260" rx="8" fill="#fafbfc"/>

  <!-- A 矩阵 -->
  <rect x="50" y="70" width="70" height="110" rx="3" fill="#eef4fb" stroke="#0f4c81" stroke-width="2"/>
  <text x="66" y="130" font-family="sans-serif" font-size="16" font-style="italic" fill="#0f4c81">A</text>
  <text x="42" y="208" font-family="sans-serif" font-size="12" fill="#5e6b7a">m×n</text>

  <text x="145" y="132" font-family="sans-serif" font-size="26" fill="#0f4c81">=</text>

  <!-- U 矩阵 -->
  <rect x="180" y="70" width="70" height="110" rx="3" fill="#e7f5ef" stroke="#0e7c66" stroke-width="2"/>
  <text x="196" y="130" font-family="sans-serif" font-size="16" font-style="italic" fill="#0e7c66">U</text>
  <text x="172" y="208" font-family="sans-serif" font-size="12" fill="#5e6b7a">m×k 正交列</text>

  <!-- Sigma 对角矩阵 -->
  <rect x="290" y="95" width="90" height="60" rx="3" fill="#fdf3e3" stroke="#b96b2a" stroke-width="2"/>
  <line x1="290" y1="115" x2="380" y2="115" stroke="#b96b2a" stroke-width="1.2"/>
  <line x1="290" y1="135" x2="380" y2="135" stroke="#b96b2a" stroke-width="1.2"/>
  <line x1="290" y1="115" x2="290" y2="135" stroke="#b96b2a" stroke-width="0.8"/>
  <text x="300" y="129" font-family="sans-serif" font-size="14" font-style="italic" fill="#b96b2a">σ₁</text>
  <text x="348" y="129" font-family="sans-serif" font-size="14" font-style="italic" fill="#b96b2a">σ₂</text>
  <text x="296" y="151" font-family="sans-serif" font-size="13" fill="#5e6b7a">对角线奇异值</text>
  <text x="285" y="208" font-family="sans-serif" font-size="12" fill="#5e6b7a">Σ (对角)</text>

  <!-- Vt -->
  <rect x="440" y="70" width="70" height="110" rx="3" fill="#e7f5ef" stroke="#0e7c66" stroke-width="2"/>
  <text x="452" y="130" font-family="sans-serif" font-size="16" font-style="italic" fill="#0e7c66">Vᵀ</text>
  <text x="428" y="208" font-family="sans-serif" font-size="12" fill="#5e6b7a">k×n 正交行</text>

  <!-- 说明 -->
  <text x="540" y="120" font-family="sans-serif" font-size="15" fill="#1c2733">左右相乘还原 A</text>
  <text x="540" y="146" font-family="sans-serif" font-size="13" fill="#5e6b7a">σ 从大到小排，前几个就抓住</text>
  <text x="540" y="166" font-family="sans-serif" font-size="13" fill="#5e6b7a">绝大部分信息 —— 是低秩近似的</text>
  <text x="540" y="186" font-family="sans-serif" font-size="13" fill="#5e6b7a">核心，也是 PCA 与推荐系统的地基</text>

  <text x="50" y="246" font-family="sans-serif" font-size="13" fill="#5e6b7a">A = U Σ Vᵀ：把任意矩阵拆成“旋转（U）+ 伸缩（Σ）+ 旋转（Vᵀ）”三步</text>
</svg>
