  <circle cx="210" cy="200" r="24" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="210" y="205" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f4c81">z₁</text>
  <circle cx="350" cy="200" r="24" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
