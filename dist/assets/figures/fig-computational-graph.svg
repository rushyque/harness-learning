  <text x="421" y="258" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">dL/db2, dL/dW2</text>
  <text x="566" y="258" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">dL/dy</text>
  <text x="350" y="366" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">每个中间梯度只算一次并复用，代价和一次前向同量级</text></svg>
