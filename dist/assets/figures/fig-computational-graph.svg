<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="计算图：前向从输入流到损失，反向梯度从损失流回各参数">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#1c2733">前向传播与反向传播的计算图</text>
  <circle cx="66" cy="200" r="24" fill="#ffffff" stroke="#0f4c81" stroke-width="2"/>
