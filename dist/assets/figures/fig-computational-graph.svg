  <circle cx="492" cy="200" r="24" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="492" y="205" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f4c81">z₂</text>
  <circle cx="618" cy="200" r="26" fill="#f6dddc" stroke="#b23a2a" stroke-width="2"/>
  <text x="618" y="205" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#b23a2a">L</text>
  <line x1="90" y1="200" x2="176.0" y2="200.0" stroke="#0f4c81" stroke-width="2.5"/>
  <path d="M176.0 200.0 L176.0 205.0 L176.0 195.0 Z" fill="#0f4c81"/>
  <line x1="234" y1="200" x2="316.0" y2="200.0" stroke="#0e7c66" stroke-width="2.5"/>
  <path d="M316.0 200.0 L316.0 205.0 L316.0 195.0 Z" fill="#0e7c66"/>
  <line x1="374" y1="200" x2="458.0" y2="200.0" stroke="#0f4c81" stroke-width="2.5"/>
