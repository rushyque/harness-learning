  <line x1="326" y1="234" x2="244.0" y2="234.0" stroke="#b26a00" stroke-width="2.5" stroke-dasharray="6,4"/>
  <path d="M244.0 234.0 L244.0 229.0 L244.0 239.0 Z" fill="#b26a00"/>
