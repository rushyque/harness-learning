  <line x1="516" y1="200" x2="580.0" y2="200.0" stroke="#b23a2a" stroke-width="2.5"/>
  <path d="M580.0 200.0 L580.0 205.0 L580.0 195.0 Z" fill="#b23a2a"/>
  <text x="138" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">线性</text>
  <text x="280" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">ReLU</text>
  <text x="421" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">线性</text>
  <text x="558" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">MSE</text>
