<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="工具的三要素">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">一个工具 = 名字 + 描述 + 参数 schema</text>
  <rect x="70" y="100" width="160" height="130" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="150" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">名字 name</text>
  <text x="150" y="176" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">run_command / write_file</text>
  <rect x="255" y="100" width="160" height="130" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="335" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">描述 description</text>
  <text x="335" y="176" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">何时用、干什么</text>
  <rect x="440" y="100" width="160" height="130" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="520" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">参数 schema</text>
  <text x="520" y="176" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">类型、必填、枚举</text>
  <rect x="70" y="255" width="540" height="58" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="340" y="281" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">模型靠“名字+描述+结构”决定何时调、怎么填</text>
  <text x="340" y="303" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">描述好坏直接影响“会不会用、会不会用错”</text>
  <text x="340.0" y="352" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">工具工程：把“什么时候该用”讲清楚</text>
</svg>
