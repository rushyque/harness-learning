<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="四类隔离与纵深防御的笼子套笼子">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">四类隔离各自挡一类灾难，叠起来是笼子套笼子</text>
  <path d="M 70.0,190.0 L 70.0,210.0 L 530.0,210.0" fill="none" stroke="#b26a00" stroke-width="2.5"/>
  <rect x="70" y="92" width="120" height="92" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="130" y="128" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0f4c81">进程隔离</text>
  <text x="130" y="160" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#33475b">与宿主不共享权限</text>
  <rect x="190" y="92" width="120" height="92" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="250" y="128" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0e7c66">文件隔离</text>
  <text x="250" y="160" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#33475b">只能碰工作区 cwd</text>
  <rect x="310" y="92" width="120" height="92" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="370" y="128" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b26a00">网络隔离</text>
  <text x="370" y="160" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#33475b">断网 / 白名单代理</text>
  <rect x="430" y="92" width="120" height="92" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="2"/>
  <text x="490" y="128" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#5b3aa6">资源隔离</text>
  <text x="490" y="160" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#33475b">CPU / 内存 / 超时</text>
  <text x="300" y="202" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">每层挡住一类灾难 → 组合成纵深</text>
  <rect x="90" y="240" width="150" height="26" rx="6" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.5"/>
  <text x="165" y="258" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b23a2a">提示层</text>
  <text x="360" y="258" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">劝模型别学坏</text>
  <text x="560" y="258" text-anchor="end" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b23a2a">弱</text>
  <rect x="90" y="276" width="150" height="26" rx="6" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="165" y="294" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b26a00">权限层</text>
  <text x="360" y="294" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">别让它能碰</text>
  <text x="560" y="294" text-anchor="end" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b26a00">中</text>
  <rect x="90" y="312" width="150" height="26" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="165" y="330" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0f4c81">审批层</text>
  <text x="360" y="330" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">危险操作再确认</text>
  <text x="560" y="330" text-anchor="end" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0f4c81">中</text>
  <rect x="90" y="348" width="150" height="26" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="165" y="366" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0e7c66">沙箱层</text>
  <text x="360" y="366" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">就算碰也在笼子里</text>
  <text x="560" y="366" text-anchor="end" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0e7c66">强兜底</text>
  <text x="340" y="396" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">沙箱是最后一道兜底：前面全被绕过，破坏仍在笼子里</text>
</svg>
