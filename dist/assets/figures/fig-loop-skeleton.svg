<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="Agent 循环骨架与终止">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">while(未结束) { 推理 → 执行 → 回填 }</text>
  <rect x="90" y="90" width="150" height="90" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="165" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">调模型</text>
  <text x="165" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">思考 + tool_call</text>
  <rect x="270" y="90" width="150" height="90" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="345" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">执行工具</text>
  <text x="345" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">框架真实执行</text>
  <rect x="450" y="90" width="150" height="90" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="525" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">结果回填</text>
  <text x="525" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">追加 tool 消息</text>
  <line x1="240" y1="135" x2="256.0" y2="135.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M256.0 135.0 L256.0 140.0 L256.0 130.0 Z" fill="#b26a00"/>
  <line x1="420" y1="135" x2="436.0" y2="135.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M436.0 135.0 L436.0 140.0 L436.0 130.0 Z" fill="#b26a00"/>
  <line x1="525" y1="180" x2="175.0" y2="207.2" stroke="#0f4c81" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M175.0 207.2 L174.6 202.2 L175.4 212.2 Z" fill="#0f4c81"/>
  <text x="340" y="208" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f4c81">循环回去</text>
  <rect x="90" y="220" width="250" height="64" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.8"/>
  <text x="215" y="246" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b23a2a">终止判断</text>
  <text x="215" y="270" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">无 tool_call → 返回答案</text>
  <rect x="370" y="215" width="230" height="140" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.8"/>
  <text x="485" y="240" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">硬性上限</text>
  <text x="485" y="266" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">最大步数</text>
  <text x="485" y="290" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">token / turn 预算</text>
  <text x="485" y="314" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">用户中断 / 致命错误</text>
  <text x="485" y="338" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b23a2a">循环守卫：超时/审批/重复</text>
</svg>
