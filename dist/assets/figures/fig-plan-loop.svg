<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="规划-执行-检查-修正循环">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">计划：先想清楚，再一步步执行</text>
  <rect x="15" y="105" width="120" height="120" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="75" y="145" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0f4c81">生成计划</text>
  <text x="75" y="178" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">拆目标排步骤</text>
  <rect x="185" y="105" width="120" height="120" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="245" y="145" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">执行 step</text>
  <text x="245" y="178" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">调工具看结果</text>
  <rect x="355" y="105" width="120" height="120" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="415" y="145" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b26a00">检查</text>
  <text x="415" y="178" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">是否符合预期</text>
  <rect x="525" y="105" width="120" height="120" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="2"/>
  <text x="585" y="145" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b23a2a">修正</text>
  <text x="585" y="178" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">重排增删步骤</text>
  <line x1="160" y1="165" x2="170.0" y2="165.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M170.0 165.0 L170.0 170.0 L170.0 160.0 Z" fill="#b26a00"/>
  <line x1="330" y1="165" x2="340.0" y2="165.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M340.0 165.0 L340.0 170.0 L340.0 160.0 Z" fill="#b26a00"/>
  <line x1="500" y1="165" x2="510.0" y2="165.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M510.0 165.0 L510.0 170.0 L510.0 160.0 Z" fill="#b26a00"/>
  <line x1="472" y1="225" x2="420.0" y2="225.0" stroke="#0f4c81" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M420.0 225.0 L420.0 220.0 L420.0 230.0 Z" fill="#0f4c81"/>
  <text x="438" y="215" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0f4c81">不符→修正</text>
  <line x1="470" y1="235" x2="260.0" y2="235.0" stroke="#b23a2a" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M260.0 235.0 L260.0 230.0 L260.0 240.0 Z" fill="#b23a2a"/>
  <text x="360" y="228" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#b23a2a">修正后再执行</text>
  <rect x="90" y="260" width="500" height="60" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="340" y="286" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#5b3aa6">计划是“活的”：可重排、增删、修正</text>
  <text x="340" y="308" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">隐式与显式常结合使用</text>
  <text x="340.0" y="356" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">粒度：太粗难执行，太细过多轮</text>
</svg>
