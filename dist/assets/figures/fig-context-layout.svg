<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="上下文窗口布局">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">窗口里放什么，模型就怎么想</text>
  <rect x="55" y="90" width="570" height="150" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="340" y="116" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f4c81">上下文窗口（有限）</text>
  <rect x="85" y="132" width="93.6" height="40" rx="4" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="131.8" y="157" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#5b3aa6">系统提示</text>
  <rect x="178.6" y="132" width="176.8" height="40" rx="4" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="267.0" y="157" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">历史/对话</text>
  <rect x="355.4" y="132" width="145.60000000000002" height="40" rx="4" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="428.2" y="157" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b26a00">检索片段</text>
  <rect x="501.0" y="132" width="104.0" height="40" rx="4" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.5"/>
  <text x="553.0" y="157" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b23a2a">当前问题</text>
  <text x="340" y="208" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">中间内容容易“漏读”→ 关键信息放开头/结尾</text>
  <text x="340" y="230" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">放什么、怎么压缩，就是上下文工程</text>
  <rect x="55" y="270" width="570" height="60" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="340" y="296" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">窗口放不下 → 截断 / 摘要 / RAG 检索 / 分治</text>
  <text x="340" y="318" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">目标：窗口里永远是此刻最该看的内容</text>
</svg>
