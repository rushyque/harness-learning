<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img" aria-label="精确率/召回率权衡：随阈值变化">
  <rect x="0" y="0" width="680" height="380" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="32" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#1c2733">精确率 vs 召回率：调阈值的一对权衡</text>
  <line x1="82" y1="250" x2="640" y2="250" stroke="#9db4cc" stroke-width="2"/>
  <line x1="82" y1="66" x2="82" y2="250" stroke="#9db4cc" stroke-width="2"/>
  <text x="634" y="246" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="400" fill="#5e6b7a">阈值（越右越保守）→</text>
  <text x="72" y="68" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400" fill="#5e6b7a">指标值</text>
  <path d="M 82.0,209.5 L 132.7,199.5 L 183.5,189.4 L 234.2,179.4 L 284.9,169.4 L 335.6,159.3 L 386.4,149.3 L 437.1,139.3 L 487.8,129.2 L 538.5,119.2 L 589.3,109.2 L 640.0,99.1" fill="none" stroke="#0f4c81" stroke-width="3"/>
  <path d="M 82.0,80.7 L 132.7,90.8 L 183.5,100.8 L 234.2,110.8 L 284.9,120.9 L 335.6,130.9 L 386.4,140.9 L 437.1,151.0 L 487.8,161.0 L 538.5,171.0 L 589.3,181.1 L 640.0,191.1" fill="none" stroke="#0e7c66" stroke-width="3"/>
  <text x="630" y="93.12" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0f4c81">精确率</text>
  <text x="630" y="205.12" text-anchor="end" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">召回率</text>
  <line x1="361.0" y1="66" x2="361.0" y2="250" stroke="#b26a00" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="361.0" y="58" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">临界点</text>
  <text x="82" y="280" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400" fill="#33475b">阈值放低（左）→ 多判正类，召回高、精确低；调高（右）→ 反过来</text>
  <text x="82" y="302" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400" fill="#5e6b7a">选哪一点取决于“漏报”和“误报”哪个代价更大，F1 是综合两者的调和平均</text>
</svg>
