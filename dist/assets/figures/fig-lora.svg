<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="LoRA 低秩适配">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">LoRA：冻结大权重，只学小增量</text>
  <rect x="80" y="100" width="220" height="110" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="190" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">冻结原权重 W</text>
  <text x="190" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#33475b">h = Wx</text>
  <text x="190" y="180" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">不更新，保留预训练能力</text>
  <rect x="380" y="100" width="220" height="110" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="490" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">低秩增量 B·A</text>
  <text x="490" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#33475b">Δh = α·(B·A)x</text>
  <text x="490" y="180" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">只训练 A、B（rank 很小）</text>
  <text x="340" y="165" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#b26a00">+</text>
  <text x="340" y="220" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b26a00">= h = Wx + α·(B·A)x</text>
  <rect x="80" y="240" width="520" height="60" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="340" y="266" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">B 初始为 0 → 增量一开始为 0，不破坏原模型</text>
  <text x="340" y="290" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">省显存算力、可多副本切换、不易灾难性遗忘</text>
  <text x="340.0" y="344" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">“针对任务的调整往往只需要低秩小变化”</text>
</svg>
