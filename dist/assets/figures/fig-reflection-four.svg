<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="反思四件套">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">反思与自我修正的四件套</text>
  <rect x="25" y="100" width="120" height="120" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="85" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">验证 verify</text>
  <text x="85" y="176" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">结果是否符合预期</text>
  <rect x="205" y="100" width="120" height="120" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="265" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">回退 rollback</text>
  <text x="265" y="176" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">回到上一个正确状态</text>
  <rect x="385" y="100" width="120" height="120" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="445" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">重试 retry</text>
  <text x="445" y="176" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">换参数/方式再试</text>
  <rect x="545" y="100" width="130" height="120" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="2"/>
  <text x="610" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#5b3aa6">自我批评</text>
  <text x="610" y="176" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">回顾决策找漏洞</text>
  <text x="90" y="248" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#5e6b7a">通常组合使用</text>
  <rect x="80" y="262" width="520" height="60" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.5"/>
  <text x="340" y="288" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b23a2a">反思不是越多越好，而是正确时机、有限次数纠正</text>
  <text x="340" y="310" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">配合守卫：重复失败要停、成本要预算、回退可回滚</text>
  <text x="340.0" y="356" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">多轮“生成→批评→修正”提质量，但防过度内耗</text>
</svg>
