<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="工作流 vs Agent">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">确定性的流水线 vs 模型自主决策</text>
  <rect x="60" y="90" width="270" height="200" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="195" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">工作流 workflow</text>
  <text x="195" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">检查 --</text>
  <text x="195" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">分类 --</text>
  <text x="195" y="202" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">自动回复</text>
  <text x="195" y="234" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">预设写死、确定可预测</text>
  <text x="195" y="256" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0f4c81">低灵活、低风险、低成本</text>
  <text x="195" y="278" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b23a2a">遇新情况要改代码</text>
  <rect x="360" y="90" width="260" height="200" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="490" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">Agent</text>
  <text x="490" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">给模型工具和目标</text>
  <text x="490" y="176" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">自主决定下一步</text>
  <text x="490" y="202" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0e7c66">高灵活、可随机应变</text>
  <text x="490" y="230" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b23a2a">高成本、需守卫/评测</text>
  <text x="490" y="258" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">任务开放、多解</text>
  <text x="490" y="282" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">组合工具、处理未知</text>
  <rect x="70" y="300" width="540" height="60" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.8"/>
  <text x="340" y="326" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">混合范式</text>
  <text x="340" y="348" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">外层确定性流程 + 内层开放步骤交 agent</text>
</svg>
