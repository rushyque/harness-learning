<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="模型 → 工具调用 → 真实结果回填">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">工具契约让模型会调，框架执行让结果真实</text>
  <rect x="60" y="90" width="250" height="90" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="2"/>
  <text x="185" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#5b3aa6">模型看到契约</text>
  <text x="185" y="146" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">name / description / schema</text>
  <text x="185" y="168" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">决定“何时用、怎么填”</text>
  <line x1="314" y1="135" x2="354.0" y2="135.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M354.0 135.0 L354.0 140.0 L354.0 130.0 Z" fill="#b26a00"/>
  <text x="339" y="123" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b26a00">tool_call</text>
  <rect x="368" y="90" width="250" height="90" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="493" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">框架执行工具</text>
  <text x="493" y="146" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">run(args) → 真实动作</text>
  <text x="493" y="168" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">成功/失败如实返回</text>
  <line x1="493" y1="184" x2="493.0" y2="204.0" stroke="#0e7c66" stroke-width="2.5"/>
  <path d="M493.0 204.0 L488.0 204.0 L498.0 204.0 Z" fill="#0e7c66"/>
  <rect x="368" y="218" width="250" height="74" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="493" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">真实结果回填</text>
  <text x="493" y="274" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">模型基于真状态继续决策</text>
  <line x1="368" y1="270" x2="324.0" y2="270.0" stroke="#b26a00" stroke-width="2.5" stroke-dasharray="4 4"/>
  <path d="M324.0 270.0 L324.0 265.0 L324.0 275.0 Z" fill="#b26a00"/>
  <text x="341" y="262" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b26a00">观察</text>
  <rect x="60" y="310" width="560" height="44" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.8"/>
  <text x="340" y="336" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b23a2a">防幻觉：结果来自真实执行，绝不回填模型自答</text>
  <text x="340" y="356" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">工具 = 由框架做，模型只负责“说”</text>
</svg>
