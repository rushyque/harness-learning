
  <svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img" aria-label="条件概率的文氏图：P(A∩B) 除以 P(B)">
  <rect x="0" y="0" width="680" height="360" rx="8" fill="#fafbfc"/>
  <text x="40" y="42" font-family="sans-serif" font-size="18" font-weight="700" fill="#1c2733">条件概率 = “在 B 的世界里重新归一化”</text>

  <rect x="90" y="80" width="500" height="210" rx="6" fill="#f6f8fa" stroke="#c9d2dc" stroke-width="2"/>
  <text x="106" y="106" font-family="sans-serif" font-size="13" fill="#5e6b7a">样本空间 Ω（所有可能）</text>

  <ellipse cx="285" cy="205" rx="118" ry="82" fill="#0f4c81" opacity="0.18" stroke="#0f4c81" stroke-width="2.5"/>
  <ellipse cx="415" cy="205" rx="118" ry="82" fill="#0e7c66" opacity="0.18" stroke="#0e7c66" stroke-width="2.5"/>

  <text x="270" y="150" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f4c81">A</text>
  <text x="452" y="150" font-family="sans-serif" font-size="16" font-weight="700" fill="#0e7c66">B</text>
  <text x="350" y="188" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#33475b">A ∩ B</text>

  <text x="236" y="258" font-family="sans-serif" font-size="12" fill="#0f4c81">只 A</text>
  <text x="408" y="262" font-family="sans-serif" font-size="12" fill="#0e7c66">只 B</text>

  <rect x="90" y="300" width="500" height="42" rx="6" fill="#ffffff" stroke="#e3e8ee"/>
  <text x="112" y="327" font-family="sans-serif" font-size="15" fill="#1c2733">P(A|B) = P(A∩B) / P(B) — 只看 B 覆盖的区域，再归一化</text>
</svg>