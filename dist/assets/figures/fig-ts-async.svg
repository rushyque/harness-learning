<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="同步与异步的对比：同步逐行等待，异步发起后不阻塞、结果回来再继续">
<defs>
  <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0f4c81"/></marker>
  <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0e7c66"/></marker>
</defs>
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="35" y="40" font-family="sans-serif" font-size="19" font-weight="700" fill="#1c2733">同步 vs 异步：等待的位置不同</text>

  <!-- 左：同步 -->
  <text x="90" y="86" font-family="sans-serif" font-size="15" font-weight="700" fill="#b96b2a">同步：一行没做完，下一行干等</text>
  <line x1="95" y1="110" x2="95" y2="310" stroke="#b96b2a" stroke-width="2.5"/>
  <rect x="83" y="120" width="24" height="24" rx="12" fill="#fdf1e3" stroke="#b96b2a" stroke-width="2.5"/>
  <rect x="83" y="170" width="24" height="60" rx="6" fill="#fdf1e3" stroke="#b96b2a" stroke-width="2.5"/>
  <rect x="83" y="256" width="24" height="24" rx="12" fill="#fdf1e3" stroke="#b96b2a" stroke-width="2.5"/>
  <text x="125" y="137" font-family="sans-serif" font-size="13" fill="#33475b">读取文件（发起）</text>
  <text x="125" y="205" font-family="sans-serif" font-size="13" fill="#33475b">原地等待</text>
  <text x="125" y="223" font-family="sans-serif" font-size="12" fill="#5e6b7a">整个线程卡在这里</text>
  <text x="125" y="273" font-family="sans-serif" font-size="13" fill="#33475b">拿到内容，继续下一行</text>

  <!-- 右：异步 -->
  <text x="400" y="86" font-family="sans-serif" font-size="15" font-weight="700" fill="#0e7c66">异步：发起后先走，结果回来再接上</text>
  <line x1="405" y1="110" x2="405" y2="310" stroke="#0e7c66" stroke-width="2.5"/>
  <rect x="393" y="120" width="24" height="24" rx="12" fill="#e7f5ef" stroke="#0e7c66" stroke-width="2.5"/>
  <rect x="393" y="158" width="24" height="24" rx="12" fill="#e7f5ef" stroke="#0e7c66" stroke-width="2.5"/>
  <rect x="393" y="196" width="24" height="46" rx="6" fill="#e7f5ef" stroke="#0e7c66" stroke-width="2.5"/>
  <rect x="393" y="266" width="24" height="24" rx="12" fill="#e7f5ef" stroke="#0e7c66" stroke-width="2.5"/>
  <text x="435" y="137" font-family="sans-serif" font-size="13" fill="#33475b">发起请求，立刻拿到 Promise</text>
  <text x="435" y="175" font-family="sans-serif" font-size="13" fill="#33475b">先做别的（处理下一条消息）</text>
  <text x="435" y="223" font-family="sans-serif" font-size="13" fill="#33475b">await 挂起等待</text>
  <text x="435" y="241" font-family="sans-serif" font-size="12" fill="#5e6b7a">只让这一个函数暂停</text>
  <text x="435" y="283" font-family="sans-serif" font-size="13" fill="#33475b">结果到达，从挂起点继续</text>

  <!-- 底部说明 -->
  <rect x="35" y="338" width="610" height="40" rx="6" fill="#ffffff" stroke="#e3e8ee" stroke-width="2"/>
  <text x="52" y="363" font-family="sans-serif" font-size="13" fill="#5e6b7a">agent 工程里 IO 密集：等模型响应、等子进程、等网络——异步让单线程同时挂起几十个等待而不空转</text>
</svg>
