  <text x="512" y="118" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#0e7c66">i=4（低频）</text>
  <text x="340.0" y="360" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">PE(pos, 2i) = sin(pos/10000^(2i/d))，奇偶维度分别用 sin/cos</text>
  <text x="340.0" y="384" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">相对位置可通过线性关系表达，且无需训练、长度外推更好</text>
</svg>
