<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="训练工程流水线">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">训练工程：从原始数据到可用模型的地图</text>
  <rect x="45" y="110" width="88" height="92" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="89" y="142" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f4c81">数据</text>
  <text x="89" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">清洗/配比/分片</text>
  <rect x="143.5" y="110" width="88" height="92" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="2"/>
  <text x="187.5" y="142" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#5b3aa6">模型</text>
  <text x="187.5" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">尺寸/架构</text>
  <rect x="242" y="110" width="88" height="92" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="286" y="142" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0e7c66">并行</text>
  <text x="286" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">3D + 分片</text>
  <rect x="340.5" y="110" width="88" height="92" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="384.5" y="142" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#b26a00">调度</text>
  <text x="384.5" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">batch/lr/累积</text>
  <rect x="439" y="110" width="88" height="92" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="483" y="142" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f4c81">检查点</text>
  <text x="483" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">存储/容错</text>
  <rect x="537.5" y="110" width="88" height="92" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="581.5" y="142" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0e7c66">评估</text>
  <text x="581.5" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">指标/收敛</text>
  <text x="138.25" y="156" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">→</text>
  <text x="236.75" y="156" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">→</text>
  <text x="335.25" y="156" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">→</text>
  <text x="433.75" y="156" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">→</text>
  <text x="532.25" y="156" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">→</text>
  <rect x="45" y="232" width="590" height="60" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="340" y="258" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">每一环都可能决定成败</text>
  <text x="340" y="281" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">论文给公式，工程在细节：并行怎么切、检查点何时存都在细节里</text>
  <rect x="45" y="315" width="290" height="66" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.5"/>
  <text x="190" y="338" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b23a2a">无 checkpoint</text>
  <text x="190" y="360" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">崩溃一次 = 好几周白跑</text>
  <rect x="345" y="315" width="290" height="66" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="490" y="338" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">定期 checkpoint</text>
  <text x="490" y="360" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">从最近点续训，只损失几步</text>
</svg>
