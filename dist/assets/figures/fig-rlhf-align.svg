<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="RLHF 对齐流程">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">RLHF：把人的偏好变成可优化目标</text>
  <rect x="55" y="90" width="260" height="120" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="185" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">1. 收集偏好</text>
  <text x="185" y="144" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">人对多个回答排序</text>
  <text x="185" y="168" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0f4c81">“A 好过 B”</text>
  <line x1="315" y1="150" x2="345.0" y2="150.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M345.0 150.0 L345.0 155.0 L345.0 145.0 Z" fill="#b26a00"/>
  <rect x="355" y="90" width="270" height="120" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="490" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">2. 训练奖励模型</text>
  <text x="490" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#33475b">r = RM(prompt, answer)</text>
  <text x="490" y="176" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">输出“人觉得多好”的分数</text>
  <line x1="340" y1="250" x2="340.0" y2="276.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M340.0 276.0 L335.0 276.0 L345.0 276.0 Z" fill="#b26a00"/>
  <text x="352" y="260" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b26a00">3. PPO 强化学习</text>
  <text x="340" y="306" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b26a00">max E[r] – β·KL(π‖π_ref)</text>
  <rect x="120" y="320" width="440" height="52" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="340" y="344" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#5b3aa6">KL 项是“刹车”：别偏离原模型太远，防 reward hacking</text>
  <text x="340" y="364" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">SFT 教“怎么答”，对齐教“好坏与边界”</text>
</svg>
