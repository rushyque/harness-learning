  <text x="335" y="192" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#33475b">能力的封装单元（注册工具/事件/配置）</text>
  <rect x="330" y="240" width="210" height="52" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="435" y="262" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">Bundle</text>
