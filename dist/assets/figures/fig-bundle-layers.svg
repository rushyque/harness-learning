<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="工具 → 插件 → Bundle → Profile 的层级">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">从单个动作到可分发扩展的封装链条</text>
  <path d="M 150.0,300.0 L 150.0,250.0 L 300.0,200.0" fill="none" stroke="#b26a00" stroke-width="2"/>
  <path d="M 300.0,200.0 L 300.0,160.0 L 440.0,150.0" fill="none" stroke="#b26a00" stroke-width="2"/>
