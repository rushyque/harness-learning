  <rect x="60" y="70" width="230" height="52" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="175" y="92" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">工具 tool</text>
