  <rect x="60" y="346" width="300" height="40" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="210" y="370" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0e7c66">先小验证再正规化：需要独立安装/复用 → 做成 bundle</text>
