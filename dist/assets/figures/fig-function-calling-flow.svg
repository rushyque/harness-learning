<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="一次 Function Calling 回合">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">工具调用：模型请求，框架执行</text>
  <rect x="55" y="76" width="230" height="54" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.8"/>
  <text x="170" y="98" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0f4c81">用户</text>
  <text x="170" y="119" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">请创建 hello.txt</text>
  <rect x="55" y="146" width="230" height="54" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.8"/>
  <text x="170" y="168" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">助手（请求）</text>
  <text x="170" y="189" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">tool_call: write_file</text>
  <rect x="55" y="216" width="230" height="54" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.8"/>
  <text x="170" y="238" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b26a00">工具（执行）</text>
  <text x="170" y="259" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">write_file 返回 ok/错误</text>
  <rect x="55" y="286" width="230" height="54" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.8"/>
  <text x="170" y="308" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">助手（继续）</text>
  <text x="170" y="329" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">读取结果，决定下一步</text>
  <rect x="350" y="90" width="275" height="120" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="487" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">框架查表执行</text>
  <text x="487" y="148" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">name → 真实函数</text>
  <text x="487" y="172" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">受控沙箱里运行</text>
  <rect x="350" y="230" width="275" height="90" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="2"/>
  <text x="487" y="258" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b23a2a">纪律</text>
  <text x="487" y="284" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">结果必须真实执行</text>
  <text x="487" y="304" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b23a2a">绝不让模型“猜”结果</text>
  <rect x="55" y="356" width="570" height="40" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="340" y="380" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0f4c81">模型只“请求”调用；执行由框架负责 → 安全、可审计</text>
</svg>
