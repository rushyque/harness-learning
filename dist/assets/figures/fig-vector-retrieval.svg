<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="向量检索原理">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">向量检索：找“语义最近”的资料块</text>
  <circle cx="330" cy="100" r="8" fill="#b23a2a" stroke="#b23a2a" stroke-width="2"/>
  <text x="330" y="84" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b23a2a">问题向量</text>
  <circle cx="250" cy="210" r="7" fill="#0e7c66" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="250" y="232" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">相关块 A</text>
  <circle cx="330" cy="260" r="7" fill="#0e7c66" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="330" y="282" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">相关块 B</text>
  <circle cx="460" cy="220" r="7" fill="#5e6b7a" stroke="#5e6b7a" stroke-width="1.5"/>
  <text x="460" y="242" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#5e6b7a">无关块 C</text>
  <circle cx="500" cy="250" r="7" fill="d0d4e0" stroke="d0d4e0" stroke-width="1.5"/>
  <text x="500" y="272" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="d0d4e0">无关块 E</text>
  <line x1="330" y1="100" x2="250" y2="210" stroke="#0e7c66" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="330" y1="100" x2="330" y2="260" stroke="#0e7c66" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="330" y1="100" x2="460" y2="220" stroke="#9db4cc" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="330" y1="100" x2="500" y2="250" stroke="#9db4cc" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="70" y="300" width="540" height="60" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="340" y="326" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">相似度取 top-k → 只把相关片段注入上下文</text>
  <text x="340" y="350" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">可混合 BM25 关键字检索提高召回</text>
</svg>
