<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="KV cache 机制">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">KV cache：不重算历史注意力</text>
  <rect x="55" y="85" width="270" height="140" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="2"/>
  <text x="190" y="113" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#b23a2a">朴素做法（浪费）</text>
  <text x="190" y="142" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">每个 token 重新算所有</text>
  <text x="190" y="164" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">历史位置的 K/V</text>
  <text x="190" y="192" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b23a2a">每步成本随长度增长</text>
  <rect x="355" y="85" width="270" height="140" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="490" y="113" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0e7c66">KV cache（省算）</text>
  <text x="490" y="142" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">旧 K/V 从缓存取</text>
  <text x="490" y="164" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">只算新 token 的 K/V</text>
  <text x="490" y="192" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0e7c66">每步成本与长度无关</text>
  <rect x="55" y="250" width="570" height="70" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="340" y="276" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b26a00">基石技术：vLLM、TensorRT-LLM 等推理库都靠它</text>
  <text x="340" y="300" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">代价：缓存本身占显存，随序列长度增长</text>
  <text x="340.0" y="350" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0f4c81">KV cache 是推理加速第一块基石</text>
</svg>
