  <rect x="300" y="134" width="80" height="38" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="340" y="158.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">e</text>
  <rect x="300" y="178" width="80" height="38" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="340" y="202.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">s</text>
  <rect x="300" y="222" width="80" height="38" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="340" y="246.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">t</text>
