  <text x="340.0" y="354" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#33475b">新文本按词表做贪心/最长匹配切分</text>
  <text x="340.0" y="380" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">常见词保持整体，罕见词能在子词层面被“拼”出来</text>
