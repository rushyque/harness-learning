  <rect x="530" y="90" width="80" height="38" rx="6" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="570" y="114.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">low</text>
