<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img" aria-label="研究工作流：Notebook 探索，验证后沉淀为脚本，脚本配测试，最终产出可复现实验">
<defs>
  <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0f4c81"/></marker>
  <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0e7c66"/></marker>
</defs>
  <rect x="0" y="0" width="680" height="360" rx="8" fill="#fafbfc"/>
  <text x="35" y="42" font-family="sans-serif" font-size="19" font-weight="700" fill="#1c2733">探索 → 沉淀 → 兜底 → 可复现</text>
  <rect x="40" y="120" width="150" height="78" rx="6" fill="#f6f8fa" stroke="#0f4c81" stroke-width="2"/>
  <text x="115" y="148" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733" text-anchor="middle">Notebook</text>
  <text x="115" y="168" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a" text-anchor="middle">快速探索、画图</text>
  <rect x="265" y="120" width="150" height="78" rx="6" fill="#f6f8fa" stroke="#0e7c66" stroke-width="2"/>
  <text x="340" y="148" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733" text-anchor="middle">Script</text>
  <text x="340" y="168" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a" text-anchor="middle">沉淀成函数</text>
  <rect x="490" y="120" width="150" height="78" rx="6" fill="#f6f8fa" stroke="#b96b2a" stroke-width="2"/>
  <text x="565" y="148" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733" text-anchor="middle">Test</text>
  <text x="565" y="168" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a" text-anchor="middle">给行为兜底</text>
  <rect x="265" y="240" width="375" height="62" rx="6" fill="#f6f8fa" stroke="#8e44ad" stroke-width="2"/>
  <text x="452.5" y="268" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733" text-anchor="middle">可复现实验</text>
  <text x="452.5" y="288" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a" text-anchor="middle">固定种子 + 锁依赖 + 记录结果</text>
  <line x1="190" y1="150" x2="265" y2="150" stroke="#0e7c66" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="415" y1="150" x2="490" y2="150" stroke="#b96b2a" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="565" y1="198" x2="565" y2="240" stroke="#8e44ad" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="340" y1="198" x2="380" y2="240" stroke="#8e44ad" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="35" y="96" font-family="sans-serif" font-size="13" font-weight="400" fill="#5e6b7a">notebook 负责想得快；脚本负责信得过；测试让改动有安全感</text>
  <rect x="35" y="320" width="610" height="30" rx="6" fill="#ffffff" stroke="#e3e8ee" stroke-width="2"/>
  <text x="52" y="340" font-family="sans-serif" font-size="13" font-weight="400" fill="#5e6b7a">不要把 notebook 当最终交付：它难 review、难复现、单元易被误改</text>
</svg>