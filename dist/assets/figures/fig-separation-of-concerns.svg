<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="框架的关注点分离骨架">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">一条条缝，把框架切成可替换的层</text>
  <rect x="140" y="70" width="250" height="38" rx="6" fill="#fafbfc" stroke="#0f4c81" stroke-width="2"/>
  <text x="265" y="86" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0f4c81">模型适配</text>
  <text x="265" y="103" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">怎么和不同 LLM 说话</text>
  <rect x="140" y="126" width="250" height="38" rx="6" fill="#fafbfc" stroke="#0e7c66" stroke-width="2"/>
  <text x="265" y="142" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">工具</text>
  <text x="265" y="159" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">有哪些能力可以调用</text>
  <rect x="140" y="182" width="250" height="38" rx="6" fill="#fafbfc" stroke="#b26a00" stroke-width="2"/>
  <text x="265" y="198" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b26a00">记忆</text>
  <text x="265" y="215" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">历史怎么存、怎么取</text>
  <rect x="140" y="238" width="250" height="38" rx="6" fill="#fafbfc" stroke="#5b3aa6" stroke-width="2"/>
  <text x="265" y="254" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">循环</text>
  <text x="265" y="271" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">turn / step 怎么驱动</text>
  <rect x="140" y="294" width="250" height="38" rx="6" fill="#fafbfc" stroke="#b23a2a" stroke-width="2"/>
  <text x="265" y="310" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b23a2a">权限 / 安全</text>
  <text x="265" y="327" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">能做与不能做</text>
  <rect x="430" y="70" width="190" height="240" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="525" y="96" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0f4c81">组合原则</text>
  <text x="525" y="126" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">关注点分离</text>
  <text x="525" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">可替换（接口）</text>
  <text x="525" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">可组合（积木）</text>
  <text x="525" y="216" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">接口 &gt; 实现</text>
  <text x="525" y="240" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">改工具不动循环</text>
  <text x="525" y="262" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">换模型不动记忆</text>
  <text x="525" y="284" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">加能力 = 加插件</text>
  <line x1="390" y1="108" x2="430" y2="108" stroke="#9db4cc" stroke-width="2"/>
  <line x1="390" y1="164" x2="430" y2="164" stroke="#9db4cc" stroke-width="2"/>
  <line x1="390" y1="220" x2="430" y2="220" stroke="#9db4cc" stroke-width="2"/>
  <line x1="390" y1="276" x2="430" y2="276" stroke="#9db4cc" stroke-width="2"/>
  <line x1="390" y1="332" x2="430" y2="332" stroke="#9db4cc" stroke-width="2"/>
  <rect x="70" y="348" width="540" height="40" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="340" y="372" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#5b3aa6">一切皆插件：可增量扩展、可替换、可组合、可测试</text>
</svg>
