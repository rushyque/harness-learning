<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img" aria-label="sigmoid：把任意分数 z 压到 0 到 1 的概率">
  <rect x="0" y="0" width="680" height="360" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1c2733">sigmoid：把“分数 z”压成“概率 p”</text>
  <line x1="82" y1="270" x2="640" y2="270" stroke="#9db4cc" stroke-width="2"/>
  <line x1="82" y1="64" x2="82" y2="270" stroke="#9db4cc" stroke-width="2"/>
  <text x="616" y="266" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="400" fill="#5e6b7a">分数 z →</text>
  <text x="44" y="68" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="400" fill="#5e6b7a">p(z)</text>
