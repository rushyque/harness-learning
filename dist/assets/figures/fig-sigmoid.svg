  <line x1="82" y1="64" x2="640" y2="64" stroke="#9db4cc" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="82" y1="270" x2="640" y2="270" stroke="#9db4cc" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="361.0" y1="270" x2="361.0" y2="64" stroke="#33475b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="361.0" cy="167.0" r="5" fill="#b26a00"/>
  <text x="369.0" y="159.0" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">z = 0 → p = 0.5</text>
  <text x="530.4" y="70.41999999999999" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400" fill="#0e7c66">p → 1</text>
  <text x="100.60000000000002" y="271.64" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400" fill="#5e6b7a">p → 0</text>
  <text x="82" y="304" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="400" fill="#33475b">分数越大，概率越高；多分类用 softmax 对所有类别分数归一化</text>
</svg>
