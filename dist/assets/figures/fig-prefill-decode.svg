<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="预填充与解码">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">推理两阶段：prefill 与 decode</text>
  <rect x="55" y="90" width="270" height="160" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="190" y="118" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f4c81">预填充 prefill</text>
  <text x="190" y="148" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">一次性把整个 prompt 前向</text>
  <text x="190" y="172" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">算出初始 KV</text>
  <text x="190" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">占时间少</text>
  <rect x="355" y="90" width="270" height="160" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="490" y="118" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#b26a00">解码 decode</text>
  <text x="490" y="148" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">逐 token 生成</text>
  <text x="490" y="172" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">每步一次前向</text>
  <text x="490" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b23a2a">占时间最多 → 优化重点</text>
  <line x1="325" y1="170" x2="341.0" y2="170.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M341.0 170.0 L341.0 175.0 L341.0 165.0 Z" fill="#b26a00"/>
  <text x="338" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">→</text>
  <rect x="55" y="275" width="570" height="70" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="340" y="301" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">预填充一次性算全 prompt，解码每生成一个词都要再前向一次</text>
  <text x="340" y="325" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">所以“生成的下一 token”是慢的根源，KV cache 专治这一步</text>
</svg>
