<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="缩放配平：参数量、数据、算力三者要刚好匹配">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">Chinchilla 配平：参数 N ≈ 20 × token 数 D</text>
  <rect x="50" y="70" width="300" height="60" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.8"/>
  <text x="200" y="92" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b23a2a">参数太多 / 数据太少</text>
  <text x="200" y="114" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#33475b">过拟合，浪费能力</text>
  <rect x="50" y="144" width="300" height="60" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.8"/>
  <text x="200" y="166" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">数据太多 / 参数太少</text>
  <text x="200" y="188" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#33475b">学不透，浪费数据</text>
  <rect x="50" y="218" width="300" height="60" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.8"/>
  <text x="200" y="240" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">两者都大 / 算力不足</text>
  <text x="200" y="262" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#33475b">训练成本爆炸</text>
  <circle cx="500" cy="145" r="18" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="500" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">参数 N</text>
  <circle cx="500" cy="205" r="18" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="500" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">token D</text>
  <circle cx="500" cy="265" r="18" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="500" y="235" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">算力 C</text>
  <line x1="500" y1="165" x2="500" y2="185" stroke="#0e7c66" stroke-width="2"/>
  <line x1="500" y1="225" x2="500" y2="245" stroke="#b26a00" stroke-width="2"/>
  <text x="340.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#33475b">最优的是“参数与数据配平”，不是“越大越好”</text>
  <text x="340.0" y="372" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">70B 模型理想上约用 1.4T token 训练才不浪费</text>
</svg>
