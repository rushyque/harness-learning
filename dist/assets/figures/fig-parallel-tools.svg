<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="并行工具调用">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">一次回复携带多个 tool_call，减少往返</text>
  <rect x="55" y="90" width="270" height="130" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="190" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">串行（慢）</text>
  <text x="190" y="148" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">read(a)→结果→再请求</text>
  <text x="190" y="172" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">read(b)→结果</text>
  <text x="190" y="198" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0f4c81">每步一次往返，轮数多</text>
  <rect x="355" y="90" width="270" height="130" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="490" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">并行（快）</text>
  <text x="490" y="148" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">[read(a), read(b)]</text>
  <text x="490" y="172" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">result(a), result(b)</text>
  <text x="490" y="198" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0e7c66">一次往返，效率更高</text>
  <rect x="55" y="245" width="570" height="60" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="340" y="271" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#5b3aa6">一条 assistant 多个 tool_call + 多条 tool 回传</text>
  <text x="340" y="295" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">多用于“查多个文件、跑多条命令”类可并行场景</text>
</svg>
