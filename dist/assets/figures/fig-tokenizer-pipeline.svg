<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img" aria-label="tokenizer 三件套：词表、encode、decode">
  <rect x="0" y="0" width="680" height="380" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">tokenizer 三件套：可逆的“编码-解码”</text>
  <rect x="55" y="80" width="160" height="90" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="135" y="112" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">文本</text>
  <text x="135" y="136" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">“hello world”</text>
  <line x1="215" y1="125" x2="265.0" y2="125.0" stroke="#0f4c81" stroke-width="2"/>
  <path d="M265.0 125.0 L265.0 130.0 L265.0 120.0 Z" fill="#0f4c81"/>
  <rect x="275" y="80" width="170" height="90" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="360" y="112" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">encode（查词表）</text>
  <text x="360" y="136" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">token 索引 [5, 12, 99]</text>
  <text x="360" y="158" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">模型真正“消费”的</text>
  <line x1="445" y1="125" x2="495.0" y2="125.0" stroke="#0e7c66" stroke-width="2"/>
  <path d="M495.0 125.0 L495.0 130.0 L495.0 120.0 Z" fill="#0e7c66"/>
  <rect x="505" y="80" width="140" height="90" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="575" y="112" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">decode</text>
  <text x="575" y="136" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">还原文本</text>
  <line x1="575" y1="170" x2="575.0" y2="205.0" stroke="#b23a2a" stroke-width="2" stroke-dasharray="4,3"/>
  <path d="M575.0 205.0 L570.0 205.0 L580.0 205.0 Z" fill="#b23a2a"/>
  <text x="575" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b23a2a">可逆：decode(encode(t)) ≈ t</text>
  <line x1="135" y1="228" x2="135.0" y2="240.0" stroke="#b23a2a" stroke-width="2" stroke-dasharray="4,3"/>
  <path d="M135.0 240.0 L130.0 240.0 L140.0 240.0 Z" fill="#b23a2a"/>
  <rect x="55" y="260" width="590" height="60" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="350" y="286" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">词表：常见词整体 + 可复用子词 + 特殊符号</text>
  <text x="350" y="308" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">decode 必须无损还原 encode 的文本，否则信息丢失</text>
</svg>
