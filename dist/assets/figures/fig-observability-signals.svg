<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="可观测三大信号">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">Logs / Metrics / Traces 配合使用</text>
  <rect x="60" y="100" width="160" height="140" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="140" y="130" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0f4c81">Logs 日志</text>
  <text x="140" y="165" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">某件事发生了</text>
  <text x="140" y="200" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#5e6b7a">事件文本/返回/错误</text>
  <rect x="260" y="100" width="160" height="140" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="340" y="130" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">Metrics 指标</text>
  <text x="340" y="165" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">可量化统计</text>
  <text x="340" y="200" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#5e6b7a">成功率/step/token</text>
  <rect x="460" y="100" width="160" height="140" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="540" y="130" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b26a00">Traces 追踪</text>
  <text x="540" y="165" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">一次调用链</text>
  <text x="540" y="200" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#5e6b7a">模型/工具/子代理</text>
  <rect x="60" y="268" width="560" height="46" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.8"/>
  <text x="340" y="294" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#5b3aa6">追踪建立在会话日志之上：日志是事件源，追踪串成调用链</text>
  <text x="340" y="312" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">能回放日志，就有完整的追踪底稿</text>
  <text x="340.0" y="352" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">指标让这次改动有用吗有数字答案</text>
</svg>
