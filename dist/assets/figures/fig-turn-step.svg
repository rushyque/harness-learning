<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="turn 与 step 的关系">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">一个 turn 含多个 step</text>
  <rect x="70" y="80" width="540" height="70" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="340" y="106" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f4c81">turn（一轮）</text>
  <text x="340" y="132" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">用户发话 → 模型给最终答复的完整回合</text>
  <rect x="160" y="175" width="390" height="40" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.8"/>
  <text x="205" y="200" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0e7c66">step 1</text>
  <text x="420" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">模型请求 → 调用 ls</text>
  <rect x="160" y="227" width="390" height="40" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.8"/>
  <text x="205" y="252" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b26a00">step 2</text>
  <text x="420" y="252" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">模型请求 → 调用 git status</text>
  <rect x="160" y="279" width="390" height="40" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.8"/>
  <text x="205" y="304" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0e7c66">step 3</text>
  <text x="420" y="304" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">模型请求 → 调用 pnpm build</text>
  <rect x="70" y="300" width="540" height="58" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="340" y="326" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">step = “一次模型请求 + 执行其工具调用”</text>
  <text x="340" y="348" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">步数/token/超时上限都基于这个单位设计</text>
</svg>
