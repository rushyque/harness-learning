<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img" aria-label="感受野：每多叠一层 3×3 卷积，输出点看到的原始面积向四周扩一圈">
  <rect x="0" y="0" width="680" height="360" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">感受野随层数扩大：3×3 → 5×5 → 7×7</text>
  <rect x="50" y="150" width="42" height="42" rx="4" fill="#ffffff" stroke="#9db4cc" stroke-width="1.5"/>
  <circle cx="71.0" cy="171.0" r="6" fill="#0f4c81"/>
  <text x="71.0" y="136" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#33475b">第 1 层</text>
  <text x="71.0" y="214" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f4c81">3×3</text>
  <rect x="280" y="150" width="70" height="70" rx="4" fill="#ffffff" stroke="#9db4cc" stroke-width="1.5"/>
  <circle cx="315.0" cy="185.0" r="6" fill="#0e7c66"/>
  <text x="315.0" y="136" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#33475b">第 2 层</text>
  <text x="315.0" y="242" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0e7c66">5×5</text>
  <rect x="510" y="150" width="98" height="98" rx="4" fill="#ffffff" stroke="#9db4cc" stroke-width="1.5"/>
  <circle cx="559.0" cy="199.0" r="6" fill="#b26a00"/>
  <text x="559.0" y="136" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#33475b">第 3 层</text>
  <text x="559.0" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#b26a00">7×7</text>
  <text x="170" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">×1 个 3×3</text>
  <text x="392" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">×2 个 3×3</text>
  <text x="525" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">×3 个 3×3</text>
  <text x="340.0" y="330" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">中心点越深，原始图像里影响它的面积越大</text></svg>
