  <rect x="60" y="300" width="400" height="60" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="260" y="326" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#5b3aa6">最小安全面：不在配置里的插件不出现</text>
  <text x="260" y="348" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">不暴露 = 最强的安全</text>
