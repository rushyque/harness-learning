  <line x1="240" y1="192" x2="266.0" y2="190.6" stroke="#0e7c66" stroke-width="2"/>
  <path d="M266.0 190.6 L266.3 195.5 L265.7 185.6 Z" fill="#0e7c66"/>
  <rect x="530" y="90" width="120" height="90" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="2"/>
  <text x="590" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#5b3aa6">Agent 变体</text>
  <text x="590" y="144" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">叠加 overlay</text>
  <text x="590" y="166" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">派生 + 组合</text>
  <text x="590" y="188" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="400" fill="#5e6b7a">避免重复维护</text>
