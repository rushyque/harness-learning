<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="基础 bundle + 补丁派生变体">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1c2733">同一套骨架 + 不同补丁 = 不同专用 Agent</text>
  <rect x="60" y="90" width="180" height="130" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="150" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">基础 bundle</text>
  <text x="150" y="150" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">通用能力骨架</text>
  <text x="150" y="174" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">+ shell / fs</text>
  <text x="150" y="196" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">+ llm 适配</text>
  <text x="150" y="216" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">(通用基座)</text>
  <rect x="280" y="90" width="200" height="34" rx="6" fill="#fafbfc" stroke="#b26a00" stroke-width="2"/>
  <text x="380" y="112" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b26a00">补丁 A：+web</text>
  <rect x="280" y="132" width="200" height="34" rx="6" fill="#fafbfc" stroke="#0e7c66" stroke-width="2"/>
  <text x="380" y="154" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0e7c66">补丁 B：改系统提示</text>
  <rect x="280" y="174" width="200" height="34" rx="6" fill="#fafbfc" stroke="#b23a2a" stroke-width="2"/>
  <text x="380" y="196" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b23a2a">补丁 C：禁某能力</text>
  <line x1="240" y1="108" x2="266.0" y2="106.6" stroke="#b26a00" stroke-width="2"/>
