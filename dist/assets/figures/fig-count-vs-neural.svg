<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="统计计数 vs 神经网络逼近">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">两种语言模型：数频率 vs 学映射</text>
  <rect x="60" y="70" width="270" height="250" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="195" y="102" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f4c81">统计语言模型</text>
  <text x="195" y="130" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#33475b">思路：在语料里数频率</text>
  <text x="85" y="184" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">the→cat    40 次</text>
  <rect x="220" y="172" width="38.64" height="16" rx="4" fill="#0f4c81"/>
  <text x="85" y="218" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">the→dog    25 次</text>
  <rect x="220" y="206" width="25.76" height="16" rx="4" fill="#0f4c81"/>
  <text x="85" y="252" text-anchor="start" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">the→mat    12 次</text>
  <rect x="220" y="240" width="14.72" height="16" rx="4" fill="#0f4c81"/>
  <text x="195" y="292" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0e7c66">优点：简单、可解释</text>
  <rect x="350" y="70" width="270" height="250" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="2"/>
  <text x="485" y="102" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#5b3aa6">神经语言模型</text>
  <text x="485" y="130" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#33475b">思路：可微函数逼近</text>
  <text x="485" y="170" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">输入 前文 one-hot</text>
  <line x1="485" y1="195" x2="485.0" y2="215.0" stroke="#5b3aa6" stroke-width="2"/>
  <path d="M485.0 215.0 L480.0 215.0 L490.0 215.0 Z" fill="#5b3aa6"/>
  <rect x="410" y="230" width="150" height="34" rx="6" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="485" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#5b3aa6">神经网络 f</text>
  <line x1="485" y1="264" x2="485.0" y2="278.0" stroke="#5b3aa6" stroke-width="2"/>
  <path d="M485.0 278.0 L480.0 278.0 L490.0 278.0 Z" fill="#5b3aa6"/>
  <text x="485" y="308" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">词表概率分布</text>
  <text x="340.0" y="350" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="400" fill="#5e6b7a">统计在数“见过的组合”，网络在学“泛化的下一词映射”</text>
  <text x="340.0" y="378" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">后者能用固定参数去利用更长、更广的上下文</text>
</svg>
