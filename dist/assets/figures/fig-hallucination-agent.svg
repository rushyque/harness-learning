<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="Agent 中的幻觉：编造工具结果">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">幻觉在 Agent 里更危险：会“编造”外部世界状态</text>
  <rect x="55" y="90" width="280" height="140" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="2"/>
  <text x="195" y="118" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#b23a2a">危险：凭空编造</text>
  <text x="195" y="148" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">幻觉调用不存在的工具</text>
  <text x="195" y="172" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">报告“命令成功了”没执行</text>
  <text x="195" y="196" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">“修正”根本没有的错误</text>
  <rect x="345" y="90" width="280" height="140" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="485" y="118" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0e7c66">工程约束</text>
  <text x="485" y="148" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">真实工具结果回传</text>
  <text x="485" y="172" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">沙箱隔离</text>
  <text x="485" y="196" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">不允许模型猜测结果</text>
  <rect x="55" y="250" width="570" height="70" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.5"/>
  <text x="340" y="276" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b26a00">缓解：RAG、要求引用、低温度、明说“不知道”、结构化输出</text>
  <text x="340" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">目标是“降低率 + 可校验”，不是彻底消除</text>
  <text x="340.0" y="352" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">deepseek-harness：工具返回走“真实函数输出”，不让模型猜测</text>
</svg>
