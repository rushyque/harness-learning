<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-label="Transformer 编码器-解码器宏观">
  <rect x="0" y="0" width="680" height="420" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">Transformer 宏观：Encoder 双向 + Decoder 掩码自回归</text>
  <rect x="70" y="90" width="240" height="180" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="190" y="118" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f4c81">Encoder × N</text>
  <rect x="95" y="140" width="190" height="42" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="190" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f4c81">多头自注意力（双向）</text>
  <text x="190" y="196" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#5e6b7a">每个 token 看整句</text>
  <text x="190" y="222" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0e7c66">理解类任务</text>
  <text x="190" y="246" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">无掩码</text>
  <rect x="370" y="90" width="240" height="180" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="490" y="118" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0e7c66">Decoder × N</text>
  <rect x="395" y="140" width="190" height="42" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="490" y="166" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0e7c66">掩码自注意力 + 交叉注意力</text>
  <text x="490" y="196" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#5e6b7a">只看左边 / 查询 Encoder</text>
  <text x="490" y="222" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b26a00">生成类任务</text>
  <text x="490" y="246" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5e6b7a">因果掩码</text>
  <line x1="310" y1="180" x2="360.0" y2="180.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M360.0 180.0 L360.0 185.0 L360.0 175.0 Z" fill="#b26a00"/>
  <text x="340" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b26a00">上下文</text>
  <rect x="70" y="300" width="540" height="60" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="340" y="326" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">交叉注意力：把“输入信息”接进生成过程</text>
  <text x="340" y="348" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">现代 LLM 常只用 Decoder（GPT），见下图</text>
</svg>
