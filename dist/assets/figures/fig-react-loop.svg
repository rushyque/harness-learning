<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="ReAct 思考-行动-观察循环">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">ReAct：思考 → 行动 → 观察，直到完成</text>
  <rect x="120" y="80" width="230" height="110" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="235" y="120" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f4c81">Thought 思考</text>
  <text x="235" y="150" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">我该先做什么 / 查什么</text>
  <text x="235" y="172" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">模型内置推理</text>
  <rect x="400" y="80" width="230" height="110" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="515" y="120" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0e7c66">Action 行动</text>
  <text x="515" y="150" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">调用工具 / 问问题</text>
  <rect x="400" y="250" width="230" height="110" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="515" y="290" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#b26a00">Observation 观察</text>
  <text x="515" y="320" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">工具返回了什么结果</text>
  <rect x="120" y="250" width="230" height="110" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="2"/>
  <text x="235" y="288" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#5b3aa6">完成</text>
  <text x="235" y="314" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">输出最终答案</text>
  <line x1="350" y1="135" x2="386.0" y2="135.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M386.0 135.0 L386.0 140.0 L386.0 130.0 Z" fill="#b26a00"/>
  <text x="373" y="126" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b26a00">决定</text>
  <line x1="515" y1="190" x2="515.0" y2="236.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M515.0 236.0 L510.0 236.0 L520.0 236.0 Z" fill="#b26a00"/>
  <text x="528" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b26a00">结果</text>
  <line x1="400" y1="305" x2="364.0" y2="305.0" stroke="#0f4c81" stroke-width="2.5"/>
  <path d="M364.0 305.0 L364.0 300.0 L364.0 310.0 Z" fill="#0f4c81"/>
  <text x="377" y="297" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f4c81">回填上下文</text>
  <line x1="330" y1="135" x2="294.0" y2="135.0" stroke="#33475b" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M294.0 135.0 L294.0 130.0 L294.0 140.0 Z" fill="#33475b"/>
  <rect x="70" y="330" width="540" height="46" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="340" y="356" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">观察结果驱动下一轮思考，直到无需行动</text>
</svg>
