<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="Agent 级评测维度">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">Agent 评测：看整条任务，不只是文本</text>
  <rect x="70" y="90" width="540" height="50" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.8"/>
  <text x="105" y="120" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0f4c81">任务成功率</text>
  <text x="370" y="120" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">是否完成用户目标</text>
  <rect x="70" y="150" width="540" height="50" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.8"/>
  <text x="105" y="180" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0e7c66">工具调用正确性</text>
  <text x="370" y="180" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">该调的工具调没调、参数对不对</text>
  <rect x="70" y="210" width="540" height="50" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="1.8"/>
  <text x="105" y="240" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b26a00">轨迹质量</text>
  <text x="370" y="240" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">规划是否合理、试错是否浪费</text>
  <rect x="70" y="270" width="540" height="50" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.8"/>
  <text x="105" y="300" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b23a2a">安全性</text>
  <text x="370" y="300" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">有无危险操作</text>
  <rect x="70" y="330" width="540" height="50" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.8"/>
  <text x="105" y="360" text-anchor="start" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">成本与延迟</text>
  <text x="370" y="360" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="400" fill="#33475b">token、轮数、耗时</text>
</svg>
