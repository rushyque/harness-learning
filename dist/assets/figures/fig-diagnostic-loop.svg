<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="端到端任务的诊断循环">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">小步验证 + 五段诊断，把“会”变成“能独立完成”</text>
  <rect x="60" y="100" width="84" height="84" rx="8" fill="#f6dddc" stroke="#b23a2a" stroke-width="2"/>
  <text x="102" y="138" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b23a2a">复现</text>
  <text x="102" y="170" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#33475b">能否稳定复现</text>
  <rect x="180" y="100" width="84" height="84" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="222" y="138" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b26a00">定位</text>
  <text x="222" y="170" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#33475b">看日志/轨迹</text>
  <rect x="300" y="100" width="84" height="84" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="342" y="138" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f4c81">归类</text>
  <text x="342" y="170" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#33475b">哪一层出错</text>
  <rect x="420" y="100" width="84" height="84" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="462" y="138" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">修最小</text>
  <text x="462" y="170" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#33475b">改最小那层</text>
  <rect x="540" y="100" width="84" height="84" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="2"/>
  <text x="582" y="138" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#5b3aa6">再跑</text>
  <text x="582" y="170" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="400" fill="#33475b">确认无回归</text>
  <line x1="144" y1="142" x2="166.0" y2="142.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M166.0 142.0 L166.0 147.0 L166.0 137.0 Z" fill="#b26a00"/>
  <line x1="264" y1="142" x2="286.0" y2="142.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M286.0 142.0 L286.0 147.0 L286.0 137.0 Z" fill="#b26a00"/>
  <line x1="384" y1="142" x2="406.0" y2="142.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M406.0 142.0 L406.0 147.0 L406.0 137.0 Z" fill="#b26a00"/>
  <line x1="504" y1="142" x2="526.0" y2="142.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M526.0 142.0 L526.0 147.0 L526.0 137.0 Z" fill="#b26a00"/>
  <path d="M 582.0,184.0 L 595.0,220.0 L 85.0,220.0 L 102.0,188.0" fill="none" stroke="#b26a00" stroke-width="2.5"/>
  <text x="340" y="214" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">循环直到修好且无回归</text>
  <rect x="60" y="248" width="560" height="44" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.8"/>
  <text x="340" y="274" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0e7c66">小步验证：分离“工具 / 注册 / 配置 / 循环”分层</text>
  <text x="340" y="292" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="400" fill="#33475b">失败时能快速定位是哪层</text>
  <rect x="60" y="320" width="560" height="52" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.8"/>
  <text x="340" y="346" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#5b3aa6">收尾验证三件事：功能 / 轨迹 / 工程</text>
  <text x="340" y="366" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#33475b">完成后复盘：卡在哪、下次先做什么</text>
</svg>
