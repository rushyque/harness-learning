<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="预训练 → 微调 流水线">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1c2733">预训练 + 微调：用免费文本打底，用少许标注落地</text>
  <rect x="60" y="90" width="250" height="150" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="185" y="118" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f4c81">预训练</text>
  <text x="185" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">海量无标注文本</text>
  <text x="185" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">自监督（遮词/续写）</text>
  <rect x="90" y="190" width="190" height="34" rx="6" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="185" y="212" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">通用语言底座</text>
  <line x1="310" y1="165" x2="370.0" y2="165.0" stroke="#b26a00" stroke-width="2"/>
  <path d="M370.0 165.0 L370.0 170.0 L370.0 160.0 Z" fill="#b26a00"/>
  <text x="345" y="152" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b26a00">底座</text>
  <rect x="380" y="90" width="250" height="150" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="505" y="118" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#b26a00">微调</text>
  <text x="505" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">少量标注数据</text>
  <text x="505" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#33475b">任务头 / prompt 化</text>
  <rect x="410" y="190" width="190" height="34" rx="6" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.5"/>
  <text x="505" y="212" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#5b3aa6">专用任务模型</text>
  <rect x="60" y="270" width="570" height="70" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="1.5"/>
  <text x="345" y="298" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7c66">两种微调落地：①加任务头（BERT）②任务 prompt 化（GPT）</text>
  <text x="345" y="322" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b23a2a">风险：灾难性遗忘——只学新任务可能忘掉底座能力</text>
</svg>
