<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="记忆的存与取">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">长期记忆 = 存下来，需要时再取回</text>
  <rect x="70" y="90" width="260" height="120" rx="8" fill="#dce8f5" stroke="#0f4c81" stroke-width="2"/>
  <text x="200" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f4c81">保存 memory_save</text>
  <text x="200" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">存“常用 Python”→记忆</text>
  <line x1="330" y1="150" x2="366.0" y2="150.0" stroke="#b26a00" stroke-width="2.5"/>
  <path d="M366.0 150.0 L366.0 155.0 L366.0 145.0 Z" fill="#b26a00"/>
  <rect x="380" y="90" width="230" height="120" rx="8" fill="#dcefe7" stroke="#0e7c66" stroke-width="2"/>
  <text x="495" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">存储</text>
  <text x="495" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">档案 / 向量库</text>
  <text x="495" y="172" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="400" fill="#5e6b7a">平时“待命”</text>
  <line x1="495" y1="210" x2="495.0" y2="236.0" stroke="#0f4c81" stroke-width="2.5"/>
  <path d="M495.0 236.0 L490.0 236.0 L500.0 236.0 Z" fill="#0f4c81"/>
  <text x="510" y="236" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0f4c81">需要时</text>
  <rect x="380" y="250" width="230" height="90" rx="8" fill="#f7e9d2" stroke="#b26a00" stroke-width="2"/>
  <text x="495" y="278" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b26a00">检索 memory_recall</text>
  <text x="495" y="304" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">top-k 相关旧记忆</text>
  <text x="495" y="324" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#b26a00">取回放回上下文</text>
  <rect x="70" y="250" width="230" height="90" rx="8" fill="#e5e0f4" stroke="#5b3aa6" stroke-width="1.8"/>
  <text x="185" y="278" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b3aa6">Agent 主动决定</text>
  <text x="185" y="304" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#33475b">把存取做成工具</text>
  <text x="185" y="324" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#5b3aa6">save / recall</text>
  <text x="340.0" y="366" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b23a2a">取舍：召回不准 / 摘要损失 / 隐私 / 陈旧</text>
</svg>
