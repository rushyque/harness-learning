  <text x="340.0" y="300" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#33475b">纵轴是 −log(p)：p 接近 1 时损失趋近 0；p 很小时损失飞快变大</text>
  <text x="340.0" y="322" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#5e6b7a">这逼模型“拿不准就别说得太满”——比线性惩罚更符合分类本质</text>
