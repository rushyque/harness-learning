<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="n-gram 的根本矛盾：依赖太少记不住长程上下文，依赖太多参数与数据爆炸">
  <rect x="0" y="0" width="680" height="400" rx="8" fill="#fafbfc"/>
  <text x="340.0" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2733">n-gram 的根本矛盾：长程记忆 vs 参数爆炸不可兼得</text>
  <rect x="40" y="70" width="290" height="300" rx="8" fill="#ffffff" stroke="#9db4cc" stroke-width="1.5"/>
  <text x="185" y="96" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#33475b">n 很小（bigram）</text>
  <rect x="60" y="116" width="250" height="34" rx="6" fill="#dce8f5" stroke="#0f4c81" stroke-width="1.5"/>
  <text x="185" y="138" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0f4c81">P(w_t | w_{t-1}) 只看上一个词</text>
  <text x="185" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">✓ 参数少，数据够用</text>
  <text x="185" y="204" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b23a2a">✗ 长程依赖全部丢掉</text>
  <text x="185" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b23a2a">✗ “纽约”前面 20 个词看不到</text>
  <text x="185" y="352" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">记不住真正重要的长程上下文</text>
  <rect x="350" y="70" width="290" height="300" rx="8" fill="#ffffff" stroke="#9db4cc" stroke-width="1.5"/>
  <text x="495" y="96" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#33475b">n 很大（高阶 n-gram）</text>
  <rect x="370" y="116" width="250" height="34" rx="6" fill="#f6dddc" stroke="#b23a2a" stroke-width="1.5"/>
  <text x="495" y="138" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#b23a2a">看更多上文 → Vⁿ 参数</text>
  <text x="495" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7c66">✓ 记得住更远上下文</text>
  <text x="495" y="204" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b23a2a">✗ 参数爆炸、数据稀疏</text>
  <text x="495" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#b23a2a">✗ 大多数组合出现太少</text>
  <text x="495" y="352" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="400" fill="#5e6b7a">数据不够，估不准概率</text>
  <text x="340.0" y="382" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#b26a00">神经网络用固定参数建模无限长上下文，正是来解决这个矛盾</text>
</svg>
